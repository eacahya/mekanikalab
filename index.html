<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mekanika Lab</title>
<meta name="description" content="Aplikasi pendamping buku Mekanika: simulasi interaktif tiap bab.">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1c2230; --muted:#5d6577; --line:#dcd7cc;
  --accent:#0f6b6b; --accent-soft:#e1efee;
  --vA:#c0392b; --vB:#1f5fbf; --vR:#1d7a3a; --vD:#8e44ad; --vAcc:#d4790f;
  --grid:#e9e5dc; --axis:#b9b2a3; --chip:#efeae0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --panel:#1c2029; --ink:#e7e9ee; --muted:#9aa2b2; --line:#2e3441;
    --accent:#4fb3b0; --accent-soft:#1f3434;
    --vA:#ff6b5b; --vB:#5c9cff; --vR:#4cc574; --vD:#c58af0; --vAcc:#ffae4a;
    --grid:#232834; --axis:#454d5e; --chip:#262b36;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2029; --ink:#e7e9ee; --muted:#9aa2b2; --line:#2e3441;
  --accent:#4fb3b0; --accent-soft:#1f3434;
  --vA:#ff6b5b; --vB:#5c9cff; --vR:#4cc574; --vD:#c58af0; --vAcc:#ffae4a;
  --grid:#232834; --axis:#454d5e; --chip:#262b36;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header a.brand{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.2px}
header a.brand span{color:var(--accent)}
header .sp{flex:1}
header button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:.2em 0 .1em}
h2{font-size:1.1rem;margin:1.2em 0 .5em}
.muted{color:var(--muted)}
.code{display:inline-block;font:600 .8rem ui-monospace,Consolas,monospace;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ch h3{margin:0 0 6px;font-size:.98rem}
.ch .num{color:var(--accent);font-weight:700;margin-right:6px}
.ch ul{margin:0;padding-left:0;list-style:none}
.ch li{margin:4px 0}
.ch li a{color:var(--ink);text-decoration:none}
.ch li a:hover{color:var(--accent)}
.ch .soon{color:var(--muted);font-size:.85rem;font-style:italic}
.goto{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}
.goto input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:160px}
.goto button,.btn{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:820px){.simwrap{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
canvas{display:block;width:100%;touch-action:none}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 8px;font-size:.92rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1}
.row input[type=range]{flex:1.4}
.row output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.86rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
table.ro{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.ro td{padding:3px 2px;border-bottom:1px dashed var(--line)}
table.ro td:last-child{text-align:right;font-family:ui-monospace,Consolas,monospace}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:14px}
.task ol{margin:.3em 0 0;padding-left:1.2em}
.task li{margin:.3em 0}
.crumb{font-size:.88rem;margin-bottom:6px}
.crumb a{color:var(--accent);text-decoration:none}
.hint{position:absolute;left:10px;bottom:8px;font-size:.8rem;color:var(--muted);pointer-events:none}
footer{max-width:1100px;margin:24px auto;padding:0 16px 24px;color:var(--muted);font-size:.82rem}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Mekanika <span>Lab</span></a>
  <div class="sp"></div>
  <button id="themeBtn" title="Ganti tema">◐</button>
</header>
<main id="app"></main>
<footer>Mekanika Lab — aplikasi pendamping buku <i>Mekanika: Dari Newton hingga Lagrange</i>. Pindai kode QR di buku atau ketik kode SIM.</footer>

<script>
/* ===================== Data buku ===================== */
const CHAPTERS = [
  {n:1,  t:"Vektor dan Kinematika", sims:[["SIM-1.1","Penjumlahan & Komponen Vektor"],["SIM-1.2","Perkalian Titik & Silang"],["SIM-1.3","Kinematika Koordinat Polar"]]},
  {n:2,  t:"Hukum-Hukum Newton", sims:[["SIM-2.1","Bidang Miring dan Gaya Gesek"],["SIM-2.2","Mesin Atwood"]]},
  {n:3,  t:"Gerak Lurus: Gaya Bergantung Waktu, Posisi, Kecepatan", sims:[["SIM-3.1","Diagram Energi Potensial"],["SIM-3.2","Jatuh dengan Hambatan Udara"]]},
  {n:4,  t:"Osilator Harmonik Sederhana dan Teredam", sims:[["SIM-4.1","Osilator Pegas dan Bandul"],["SIM-4.2","Osilasi Teredam"]]},
  {n:5,  t:"Osilasi Paksa dan Resonansi", sims:[["SIM-5.1","Kurva Resonansi"],["SIM-5.2","Transien dan Layangan"]]},
  {n:6,  t:"Gerak Partikel dalam Tiga Dimensi", sims:[["SIM-6.1","Proyektil dengan Hambatan Udara"],["SIM-6.2","Usaha Sepanjang Lintasan"]]},
  {n:7,  t:"Kerangka Acuan Non-Inersia", sims:[["SIM-7.1","Bola di Komidi Putar"],["SIM-7.2","Bandul Foucault"]]},
  {n:8,  t:"Gravitasi", sims:[["SIM-8.1","Medan Gravitasi Bola dan Kulit"],["SIM-8.2","Meriam Newton"]]},
  {n:9,  t:"Gaya Sentral dan Gerak Planet", sims:[["SIM-9.1","Orbit Kepler dan Hukum Luas"],["SIM-9.2","Potensial Efektif"]]},
  {n:10, t:"Dinamika Sistem Partikel", sims:[["SIM-10.1","Tumbukan Satu Dimensi"],["SIM-10.2","Roket"]]},
  {n:11, t:"Benda Tegar: Rotasi terhadap Sumbu Tetap", sims:[["SIM-11.1","Momen Inersia"],["SIM-11.2","Bandul Fisis"]]},
  {n:12, t:"Benda Tegar: Gerak Bidang dan Menggelinding", sims:[["SIM-12.1","Lomba Menggelinding"],["SIM-12.2","Dari Meluncur ke Menggelinding"]]},
  {n:13, t:"Mekanika Lagrange I", sims:[["SIM-13.1","Manik pada Cincin Berputar"],["SIM-13.2","Bandul Ganda dan Kekacauan"]]},
  {n:14, t:"Mekanika Lagrange II", sims:[["SIM-14.1","Osilator Tergandeng dan Mode Normal"],["SIM-14.2","Ruang Fase Bandul"]]},
];
const SIMS = {};
const app = document.getElementById('app');
let stopCurrent = null;

/* ===================== Tema ===================== */
const root = document.documentElement;
try{ const th = localStorage.getItem('ml-theme'); if(th) root.dataset.theme = th; }catch(e){}
document.getElementById('themeBtn').onclick = () => {
  const dark = getComputedStyle(root).getPropertyValue('--bg').trim() === '#14171d';
  root.dataset.theme = dark ? 'light' : 'dark';
  try{ localStorage.setItem('ml-theme', root.dataset.theme); }catch(e){}
};
const css = v => getComputedStyle(root).getPropertyValue(v).trim();

/* ===================== Router ===================== */
function route(){
  if(stopCurrent){ stopCurrent(); stopCurrent = null; }
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/\s/g,'');
  window.scrollTo(0,0);
  if(SIMS[h]) return SIMS[h]();
  home(h);
}
window.addEventListener('hashchange', route);

function home(bad){
  app.innerHTML = `
  <h1>Simulasi Buku Mekanika</h1>
  <p class="muted">Setiap simulasi punya kode SIM yang tercetak di buku, misalnya <span class="code">SIM-1.3</span> = Bab 1, simulasi ke-3.</p>
  <div class="goto"><input id="code" placeholder="Ketik kode, mis. SIM-1.1" value="${bad||''}">
  <button id="go">Buka</button></div>
  ${bad ? `<p class="muted">Kode <b>${bad}</b> belum tersedia.</p>`:''}
  <div class="chapters">${CHAPTERS.map(c=>`
    <div class="ch"><h3><span class="num">Bab ${c.n}</span>${c.t}</h3>
    ${c.sims.length? `<ul>${c.sims.map(s=>`<li><a href="#${s[0]}"><span class="code">${s[0]}</span> ${s[1]}</a></li>`).join('')}</ul>`
      : `<div class="soon">Simulasi menyusul</div>`}</div>`).join('')}
  </div>`;
  const go = () => { let v = document.getElementById('code').value.trim().toUpperCase(); if(!v.startsWith('SIM-')) v = 'SIM-'+v; location.hash = v; };
  document.getElementById('go').onclick = go;
  document.getElementById('code').onkeydown = e => { if(e.key==='Enter') go(); };
}

function shell(code, title, chap, tasks){
  app.innerHTML = `
  <div class="crumb"><a href="#">← Semua bab</a> · Bab ${chap}</div>
  <h1><span class="code">${code}</span> ${title}</h1>
  <div class="simwrap">
    <div><div class="stage"><canvas id="cv"></canvas><div class="hint" id="hint"></div></div>
      <div class="task"><b>Coba ini</b><ol>${tasks.map(t=>`<li>${t}</li>`).join('')}</ol></div></div>
    <div class="side" id="side"></div>
  </div>`;
  return { cv: document.getElementById('cv'), side: document.getElementById('side'), hint: document.getElementById('hint') };
}

/* ===================== Utilitas gambar ===================== */
function setupCanvas(cv, aspect){
  const ctx = cv.getContext('2d');
  function resize(){
    const w = cv.parentElement.clientWidth;
    const h = Math.round(Math.min(w*aspect, window.innerHeight*0.68));
    const dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cv._w = w; cv._h = h;
  }
  resize();
  return {ctx, resize};
}
function makeView(cv, unitsAcross){
  // dunia: satuan; layar: piksel. Origin di tengah, y ke atas.
  const v = {};
  v.update = () => { v.s = cv._w/unitsAcross; v.ox = cv._w/2; v.oy = cv._h/2; };
  v.X = x => v.ox + x*v.s; v.Y = y => v.oy - y*v.s;
  v.inv = (px,py) => [(px-v.ox)/v.s, (v.oy-py)/v.s];
  v.update();
  return v;
}
function grid(ctx, v, cv, step=1){
  ctx.fillStyle = css('--panel'); ctx.fillRect(0,0,cv._w,cv._h);
  ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
  const [x0,y1] = v.inv(0,0), [x1,y0] = v.inv(cv._w,cv._h);
  ctx.beginPath();
  for(let x=Math.ceil(x0/step)*step; x<=x1; x+=step){ ctx.moveTo(v.X(x),0); ctx.lineTo(v.X(x),cv._h); }
  for(let y=Math.ceil(y0/step)*step; y<=y1; y+=step){ ctx.moveTo(0,v.Y(y)); ctx.lineTo(cv._w,v.Y(y)); }
  ctx.stroke();
  ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,v.Y(0)); ctx.lineTo(cv._w,v.Y(0)); ctx.moveTo(v.X(0),0); ctx.lineTo(v.X(0),cv._h); ctx.stroke();
  ctx.fillStyle = css('--muted'); ctx.font = '12px system-ui';
  ctx.fillText('x', cv._w-14, v.Y(0)-6); ctx.fillText('y', v.X(0)+6, 14);
}
function arrow(ctx, x0,y0,x1,y1, color, w=2.6, label, dash){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy); if(L<1) return;
  const ux=dx/L, uy=dy/L, hl=Math.min(13, L*0.4), hw=hl*0.45;
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1-ux*hl*0.8,y1-uy*hl*0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-ux*hl-uy*hw, y1-uy*hl+ux*hw); ctx.lineTo(x1-ux*hl+uy*hw, y1-uy*hl-ux*hw); ctx.closePath(); ctx.fill();
  if(label){ ctx.font='bold 14px system-ui'; ctx.fillText(label, x1+8*(-uy)+4, y1+8*ux-4); }
  ctx.restore();
}
function slider(parent, id, label, min, max, step, val, fmt=v=>v){
  const d = document.createElement('div'); d.className='row';
  d.innerHTML = `<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o"></output>`;
  parent.appendChild(d);
  const inp = d.querySelector('input'), out = d.querySelector('output');
  const upd = () => out.textContent = fmt(+inp.value); upd();
  inp.addEventListener('input', upd);
  return inp;
}
function seg(parent, options, active, onChange){
  const d = document.createElement('div'); d.className='seg';
  options.forEach(([k,lab])=>{
    const b=document.createElement('button'); b.textContent=lab; b.dataset.k=k; if(k===active) b.classList.add('on');
    b.onclick=()=>{ d.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); onChange(k); };
    d.appendChild(b);
  });
  parent.appendChild(d); return d;
}
function check(parent, label, val){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<label><input type="checkbox" ${val?'checked':''}> ${label}</label>`;
  parent.appendChild(d); return d.querySelector('input');
}
function card(side, title){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<h4>${title}</h4>`; side.appendChild(c); return c; }
const f2 = x => (Math.abs(x)<0.005?0:x).toFixed(2);
const deg = r => r*180/Math.PI;

/* draggable points */
function dragger(cv, v, pts, onMove){
  let active = null;
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e => {
    const [px,py]=pos(e); let best=null, bd=24;
    pts().forEach(p=>{ const d=Math.hypot(v.X(p.x)-px, v.Y(p.y)-py); if(d<bd){bd=d;best=p;} });
    if(best){ active=best; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', e => {
    const [px,py]=pos(e);
    if(!active){ cv.style.cursor = pts().some(p=>Math.hypot(v.X(p.x)-px,v.Y(p.y)-py)<24)?'grab':'default'; return; }
    let [x,y]=v.inv(px,py); x=Math.round(x*2)/2; y=Math.round(y*2)/2;   // snap 0,5 satuan
    active.x=x; active.y=y; onMove();
  });
  const up = ()=>{ active=null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}

/* ===================== SIM-1.1 Penjumlahan & komponen vektor ===================== */
SIMS['SIM-1.1'] = function(){
  const {cv, side, hint} = shell('SIM-1.1','Penjumlahan & Komponen Vektor',1,[
    'Buat <b>A</b> = (3, 0) dan <b>B</b> = (0, 4). Berapa |<b>A</b> + <b>B</b>|? Apakah sama dengan |<b>A</b>| + |<b>B</b>|?',
    'Cari dua vektor yang panjangnya masing-masing 3 dan 4 tetapi jumlahnya hanya 1. Kapan |<b>A</b>+<b>B</b>| paling besar dan paling kecil?',
    'Pilih mode <b>A − B</b>. Tunjukkan bahwa <b>A − B</b> adalah vektor dari ujung <b>B</b> ke ujung <b>A</b>.',
    'Tampilkan komponen. Periksa bahwa komponen <b>R</b> selalu = jumlah komponen <b>A</b> dan <b>B</b>, walaupun panjangnya tidak dijumlah begitu saja.'
  ]);
  hint.textContent = 'Seret ujung panah A atau B';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 16);
  const A = {x:3, y:1}, B = {x:1, y:3};
  let mode = 'sum';
  const c1 = card(side,'Operasi');
  seg(c1, [['sum','A + B'],['diff','A − B'],['tail','Ekor-ke-ujung']], mode, k=>{mode=k; draw();});
  const showComp = check(c1,'Tampilkan komponen x, y', false);
  const showPar = check(c1,'Tampilkan jajaran genjang', true);
  showComp.onchange = showPar.onchange = draw;
  const c2 = card(side,'Nilai'); const ro = document.createElement('table'); ro.className='ro'; c2.appendChild(ro);
  const c3 = card(side,'Atur cepat');
  const pres = [['A=(3,0), B=(0,4)',[3,0,0,4]],['Searah',[3,0,4,0]],['Berlawanan',[3,0,-4,0]],['Acak',null]];
  const pd = document.createElement('div'); pd.className='seg'; c3.appendChild(pd);
  pres.forEach(([lab,val])=>{ const b=document.createElement('button'); b.textContent=lab; pd.appendChild(b);
    b.onclick=()=>{ const r=val||[0,0,0,0].map(()=>Math.round((Math.random()*10-5)*2)/2); [A.x,A.y,B.x,B.y]=r; draw(); }; });

  dragger(cv, v, ()=>[A,B], draw);
  function draw(){
    v.update(); grid(ctx, v, cv);
    const cA=css('--vA'), cB=css('--vB'), cR=css('--vR'), cD=css('--vD');
    const R = mode==='diff' ? {x:A.x-B.x, y:A.y-B.y} : {x:A.x+B.x, y:A.y+B.y};
    const O = [v.X(0), v.Y(0)];
    if(mode==='sum'){
      if(showPar.checked){
        ctx.save(); ctx.fillStyle=cR+'22'; ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(A.x),v.Y(A.y)); ctx.lineTo(v.X(R.x),v.Y(R.y)); ctx.lineTo(v.X(B.x),v.Y(B.y)); ctx.closePath(); ctx.fill(); ctx.restore();
        arrow(ctx, v.X(A.x),v.Y(A.y), v.X(R.x),v.Y(R.y), cB, 1.6, null, [5,5]);
        arrow(ctx, v.X(B.x),v.Y(B.y), v.X(R.x),v.Y(R.y), cA, 1.6, null, [5,5]);
      }
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cR, 3.2, 'R = A + B');
    } else if(mode==='diff'){
      arrow(ctx, v.X(B.x),v.Y(B.y), v.X(A.x),v.Y(A.y), cD, 1.8, null, [6,5]);
      arrow(ctx, ...O, v.X(-B.x), v.Y(-B.y), cB, 1.6, '−B', [4,4]);
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cD, 3.2, 'A − B');
    } else {
      arrow(ctx, v.X(A.x),v.Y(A.y), v.X(R.x),v.Y(R.y), cB, 2.6, 'B');
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cR, 3.2, 'R');
    }
    if(showComp.checked){
      [[A,cA],[B,cB],[R, mode==='diff'?cD:cR]].forEach(([p,c])=>{
        ctx.save(); ctx.strokeStyle=c; ctx.globalAlpha=.75; ctx.setLineDash([3,4]); ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(v.X(p.x),v.Y(0)); ctx.lineTo(v.X(p.x),v.Y(p.y)); ctx.moveTo(v.X(0),v.Y(p.y)); ctx.lineTo(v.X(p.x),v.Y(p.y)); ctx.stroke(); ctx.restore();
      });
    }
    arrow(ctx, ...O, v.X(A.x), v.Y(A.y), cA, 2.8, 'A');
    if(mode!=='tail') arrow(ctx, ...O, v.X(B.x), v.Y(B.y), cB, 2.8, 'B');
    [A, mode==='tail'?null:B].forEach(p=>{ if(!p) return; ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.arc(v.X(p.x),v.Y(p.y),6,0,7); ctx.fill(); ctx.stroke(); });
    if(mode==='tail'){ ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.arc(v.X(B.x),v.Y(B.y),5,0,7); ctx.fill(); ctx.stroke(); }
    const mag = p => Math.hypot(p.x,p.y), ang = p => (deg(Math.atan2(p.y,p.x))+360)%360;
    const lab = mode==='diff'?'A − B':'R';
    const sw = c => `<span class="sw" style="background:${c}"></span>`;
    ro.innerHTML = `
      <tr><td>${sw(cA)}A</td><td>(${f2(A.x)}, ${f2(A.y)})</td></tr>
      <tr><td>|A|, θ<sub>A</sub></td><td>${f2(mag(A))}, ${ang(A).toFixed(1)}°</td></tr>
      <tr><td>${sw(cB)}B</td><td>(${f2(B.x)}, ${f2(B.y)})</td></tr>
      <tr><td>|B|, θ<sub>B</sub></td><td>${f2(mag(B))}, ${ang(B).toFixed(1)}°</td></tr>
      <tr><td>${sw(mode==='diff'?cD:cR)}${lab}</td><td>(${f2(R.x)}, ${f2(R.y)})</td></tr>
      <tr><td>|${lab}|</td><td><b>${f2(mag(R))}</b></td></tr>
      <tr><td>|A| ${mode==='diff'?'−':'+'} |B|</td><td>${f2(mode==='diff'?mag(A)-mag(B):mag(A)+mag(B))}</td></tr>`;

/* ===================== SIM-1.2 Perkalian titik & silang ===================== */
SIMS['SIM-1.2'] = function(){
  const {cv, side, hint} = shell('SIM-1.2','Perkalian Titik & Silang',1,[
    'Putar <b>B</b> sampai tegak lurus <b>A</b>. Berapa <b>A</b>·<b>B</b>? Berapa luas jajaran genjang?',
    'Buat <b>A</b> dan <b>B</b> searah. Mengapa |<b>A</b>×<b>B</b>| = 0 walaupun kedua vektor tidak nol?',
    'Tukar urutan: bandingkan arah <b>A</b>×<b>B</b> dan <b>B</b>×<b>A</b> (keluar ⊙ atau masuk ⊗ bidang layar).',
    'Buat sudut antara 90° dan 180°. Apa tanda <b>A</b>·<b>B</b>? Lihat proyeksi <b>B</b> pada <b>A</b> jatuh di mana.'
  ]);
  hint.textContent = 'Seret ujung panah A atau B';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 14);
  const A = {x:4, y:0}, B = {x:2, y:3};
  let show = 'dot';
  const c1 = card(side,'Tampilkan');
  seg(c1, [['dot','A · B (proyeksi)'],['cross','A × B (luas)'],['both','Keduanya']], show, k=>{show=k; draw();});
  const c2 = card(side,'Nilai'); const ro=document.createElement('table'); ro.className='ro'; c2.appendChild(ro);
  const c3 = card(side,'Grafik terhadap sudut θ');
  const g = document.createElement('canvas'); g.style.width='100%'; c3.appendChild(g);
  dragger(cv, v, ()=>[A,B], draw);

  function plot(theta, a, b){
    const W = c3.clientWidth-28, H = 150, dpr=window.devicePixelRatio||1;
    g.width=W*dpr; g.height=H*dpr; g.style.height=H+'px'; const c=g.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle=css('--panel'); c.fillRect(0,0,W,H);
    const m=a*b||1, X=t=>8+t/Math.PI*(W-16), Y=y=>H/2 - y/m*(H/2-12);
    c.strokeStyle=css('--axis'); c.beginPath(); c.moveTo(8,H/2); c.lineTo(W-8,H/2); c.stroke();
    [[Math.cos,css('--vR'),'AB cos θ'],[Math.sin,css('--vD'),'AB sin θ']].forEach(([fn,col,lb],i)=>{
      c.strokeStyle=col; c.lineWidth=2; c.beginPath();
      for(let k=0;k<=100;k++){ const t=k/100*Math.PI; k?c.lineTo(X(t),Y(m*fn(t))):c.moveTo(X(t),Y(m*fn(t))); }
      c.stroke(); c.fillStyle=col; c.font='11px system-ui'; c.fillText(lb, W-70, 14+i*14);
      c.beginPath(); c.arc(X(theta),Y(m*fn(theta)),4,0,7); c.fill();
    });
    c.fillStyle=css('--muted'); c.fillText('0°',6,H-4); c.fillText('90°',W/2-10,H-4); c.fillText('180°',W-30,H-4);
  }
  function draw(){
    v.update(); grid(ctx, v, cv);
    const cA=css('--vA'), cB=css('--vB'), cR=css('--vR'), cD=css('--vD');
    const a=Math.hypot(A.x,A.y), b=Math.hypot(B.x,B.y);
    const dot=A.x*B.x+A.y*B.y, crz=A.x*B.y-A.y*B.x;
    const th = Math.acos(Math.max(-1,Math.min(1, a&&b? dot/(a*b):1)));
    const O=[v.X(0),v.Y(0)];
    if(show!=='dot'){
      ctx.save(); ctx.fillStyle=cD+'30'; ctx.strokeStyle=cD; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(A.x),v.Y(A.y)); ctx.lineTo(v.X(A.x+B.x),v.Y(A.y+B.y)); ctx.lineTo(v.X(B.x),v.Y(B.y)); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      // simbol arah A×B
      const cx=v.X((A.x+B.x)/2), cy=v.Y((A.y+B.y)/2);
      if(Math.abs(crz)>0.01){
        ctx.save(); ctx.strokeStyle=cD; ctx.fillStyle=cD; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,11,0,7); ctx.stroke();
        if(crz>0){ ctx.beginPath(); ctx.arc(cx,cy,3.5,0,7); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(cx-7,cy-7); ctx.lineTo(cx+7,cy+7); ctx.moveTo(cx+7,cy-7); ctx.lineTo(cx-7,cy+7); ctx.stroke(); }
        ctx.restore();
      }
    }
    if(show!=='cross' && a>0){
      const k=dot/(a*a), P={x:k*A.x, y:k*A.y};
      ctx.save(); ctx.strokeStyle=css('--muted'); ctx.setLineDash([3,4]); ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(v.X(B.x),v.Y(B.y)); ctx.lineTo(v.X(P.x),v.Y(P.y)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(v.X(-A.x*3),v.Y(-A.y*3)); ctx.lineTo(v.X(A.x*3),v.Y(A.y*3)); ctx.globalAlpha=.35; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.strokeStyle=cR; ctx.lineWidth=7; ctx.globalAlpha=.55; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(P.x),v.Y(P.y)); ctx.stroke(); ctx.restore();
    }
    // busur sudut
    const aA=Math.atan2(A.y,A.x), aB=Math.atan2(B.y,B.x);
    ctx.save(); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.2; ctx.beginPath();
    let d=aB-aA; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    ctx.arc(O[0],O[1],26,-aA,-(aA+d), d>0); ctx.stroke(); ctx.restore();
    arrow(ctx,...O,v.X(A.x),v.Y(A.y),cA,2.8,'A'); arrow(ctx,...O,v.X(B.x),v.Y(B.y),cB,2.8,'B');
    [A,B].forEach(p=>{ ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.arc(v.X(p.x),v.Y(p.y),6,0,7); ctx.fill(); ctx.stroke(); });
    const sw=c=>`<span class="sw" style="background:${c}"></span>`;
    ro.innerHTML=`
      <tr><td>|A|, |B|</td><td>${f2(a)}, ${f2(b)}</td></tr>
      <tr><td>sudut θ</td><td>${deg(th).toFixed(1)}°</td></tr>
      <tr><td>${sw(cR)}A·B = A<sub>x</sub>B<sub>x</sub>+A<sub>y</sub>B<sub>y</sub></td><td><b>${f2(dot)}</b></td></tr>
      <tr><td>|A||B| cos θ</td><td>${f2(a*b*Math.cos(th))}</td></tr>
      <tr><td>${sw(cD)}(A×B)<sub>z</sub> = A<sub>x</sub>B<sub>y</sub>−A<sub>y</sub>B<sub>x</sub></td><td><b>${f2(crz)}</b></td></tr>
      <tr><td>|A||B| sin θ = luas</td><td>${f2(a*b*Math.sin(th))}</td></tr>
      <tr><td>arah A×B</td><td>${Math.abs(crz)<0.01?'— (nol)':crz>0?'⊙ keluar layar (+z)':'⊗ masuk layar (−z)'}</td></tr>`;
    plot(th, a, b);
  }
  const onR=()=>{resize();draw();}; window.addEventListener('resize',onR);
  stopCurrent=()=>window.removeEventListener('resize',onR);
  draw();
};

/* ===================== SIM-1.3 Kinematika koordinat polar ===================== */
SIMS['SIM-1.3'] = function(){
  const {cv, side, hint} = shell('SIM-1.3','Kinematika Koordinat Polar',1,[
    'Pilih <b>Melingkar beraturan</b>. Laju tetap, tetapi apakah percepatannya nol? Ke mana arahnya?',
    'Pilih <b>Garis lurus</b>. θ terus berubah, tetapi lihat a<sub>r</sub> dan a<sub>θ</sub>: suku-sukunya saling meniadakan sehingga percepatan nol.',
    'Pilih <b>Spiral</b>. Perhatikan suku 2ṙθ̇ (percepatan Coriolis): ia muncul walaupun ω tetap.',
    'Amati ê<sub>r</sub> dan ê<sub>θ</sub>: panjangnya selalu 1, tetapi arahnya ikut berubah bersama partikel.'
  ]);
  hint.textContent = 'Lintasan partikel; panah biru = êᵣ, ungu = êθ';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 14);
  let preset='circ', t=0, playing=true, trail=[], last=performance.now(), raf;
  const c1=card(side,'Jenis gerak');
  seg(c1,[['circ','Melingkar beraturan'],['acc','Melingkar dipercepat'],['spiral','Spiral'],['line','Garis lurus']],preset,k=>{preset=k;t=0;trail=[];});
  const c2=card(side,'Parameter');
  const sR=slider(c2,'pR','R atau r₀ (m)',1,5,0.5,3,x=>x.toFixed(1));
  const sW=slider(c2,'pW','ω, α, atau v',0.2,2,0.1,0.8,x=>x.toFixed(1));
  const sU=slider(c2,'pU','ṙ spiral (m/s)',0.1,1,0.05,0.35,x=>x.toFixed(2));
  const sSp=slider(c2,'pS','Kecepatan putar ulang',0.25,2,0.25,1,x=>x+'×');
  const bar=document.createElement('div'); bar.className='row';
  bar.innerHTML='<button class="btn" id="pp">Jeda</button><button class="btn ghost" id="rs">Ulang</button>'; c2.appendChild(bar);
  const c3=card(side,'Tampilkan');
  const shU=check(c3,'Vektor satuan ê<sub>r</sub>, ê<sub>θ</sub>',true);
  const shV=check(c3,'Kecepatan v',true);
  const shA=check(c3,'Percepatan a',true);
  const shC=check(c3,'Komponen a<sub>r</sub>, a<sub>θ</sub>',false);
  const c4=card(side,'Nilai saat t'); const ro=document.createElement('table'); ro.className='ro'; c4.appendChild(ro);
  document.getElementById('pp').onclick=e=>{playing=!playing; e.target.textContent=playing?'Jeda':'Jalan';};
  document.getElementById('rs').onclick=()=>{t=0;trail=[];};
  [sR,sW,sU].forEach(s=>s.addEventListener('input',()=>{t=0;trail=[];}));

  function state(t){
    const R=+sR.value, w=+sW.value, u=+sU.value;
    if(preset==='circ') return {r:R, rd:0, rdd:0, th:w*t, thd:w, thdd:0};
    if(preset==='acc'){ const a=w*0.25; return {r:R, rd:0, rdd:0, th:0.5*a*t*t, thd:a*t, thdd:a}; }
    if(preset==='spiral') return {r:0.6+u*t, rd:u, rdd:0, th:w*t, thd:w, thdd:0};
    // garis lurus: x = -6 + v t, y = R
    const vx=w*1.5, x=-6+vx*t, y=R, r=Math.hypot(x,y), rd=x*vx/r, thd=-y*vx/(r*r);
    return {r, rd, rdd:(vx*vx-rd*rd)/r, th:Math.atan2(y,x), thd, thdd:2*y*vx*rd/(r*r*r)};
  }
  function limit(){ if(preset==='spiral') return (6.2-0.6)/(+sU.value); if(preset==='line') return 12/(+sW.value*1.5); if(preset==='acc') return Math.sqrt(2*6*Math.PI/(+sW.value*0.25)); return 1e9; }

  function frame(now){

    if(playing){ t+=dt*(+sSp.value); if(t>limit()){t=0;trail=[];} }
    draw(); raf=requestAnimationFrame(frame);
  }
  function draw(){
    v.update(); grid(ctx,v,cv);
    const s=state(t), c=Math.cos(s.th), sn=Math.sin(s.th);
    const x=s.r*c, y=s.r*sn, P=[v.X(x),v.Y(y)];
    trail.push([x,y]); if(trail.length>900) trail.shift();
    ctx.save(); ctx.strokeStyle=css('--muted'); ctx.globalAlpha=.6; ctx.lineWidth=1.6; ctx.beginPath();
    trail.forEach((p,i)=> i?ctx.lineTo(v.X(p[0]),v.Y(p[1])):ctx.moveTo(v.X(p[0]),v.Y(p[1]))); ctx.stroke(); ctx.restore();
    // garis r dan busur θ
    ctx.save(); ctx.strokeStyle=css('--axis'); ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(v.X(0),v.Y(0)); ctx.lineTo(...P); ctx.stroke(); ctx.setLineDash([]);
    ctx.beginPath(); const th=((s.th%(2*Math.PI))+2*Math.PI)%(2*Math.PI); ctx.arc(v.X(0),v.Y(0),22,0,-th,true); ctx.stroke();
    ctx.fillStyle=css('--muted'); ctx.font='12px system-ui'; ctx.fillText('θ',v.X(0)+26,v.Y(0)-8); ctx.restore();
    const vr=s.rd, vth=s.r*s.thd, ar=s.rdd-s.r*s.thd*s.thd, ath=s.r*s.thdd+2*s.rd*s.thd;
    const er=[c,sn], et=[-sn,c];
    const sc=v.s, U=1.1*sc, Vs=0.9*sc, As=0.9*sc;
    const tip=(vec,k)=>[P[0]+vec[0]*k, P[1]-vec[1]*k];
    if(shU.checked){ arrow(ctx,...P,...tip(er,U),css('--vB'),2,'êᵣ'); arrow(ctx,...P,...tip(et,U),css('--vD'),2,'êθ'); }
    const vvec=[vr*er[0]+vth*et[0], vr*er[1]+vth*et[1]], avec=[ar*er[0]+ath*et[0], ar*er[1]+ath*et[1]];
    if(shV.checked) arrow(ctx,...P,...tip(vvec,Vs),css('--vR'),3,'v');
    if(shC.checked){ arrow(ctx,...P,...tip([ar*er[0],ar*er[1]],As),css('--vAcc'),1.8,'aᵣ',[5,4]); arrow(ctx,...P,...tip([ath*et[0],ath*et[1]],As),css('--vAcc'),1.8,'aθ',[5,4]); }
    if(shA.checked) arrow(ctx,...P,...tip(avec,As),css('--vA'),3,'a');
    ctx.beginPath(); ctx.fillStyle=css('--ink'); ctx.arc(...P,6,0,7); ctx.fill();
    const sw=col=>`<span class="sw" style="background:${col}"></span>`;
    ro.innerHTML=`
      <tr><td>t</td><td>${t.toFixed(2)} s</td></tr>
      <tr><td>r, θ</td><td>${f2(s.r)} m, ${deg(th).toFixed(0)}°</td></tr>
      <tr><td>ṙ, θ̇</td><td>${f2(s.rd)}, ${f2(s.thd)} rad/s</td></tr>
      <tr><td>${sw(css('--vR'))}v<sub>r</sub> = ṙ</td><td>${f2(vr)}</td></tr>
      <tr><td>v<sub>θ</sub> = rθ̇</td><td>${f2(vth)}</td></tr>
      <tr><td>|v|</td><td><b>${f2(Math.hypot(vr,vth))}</b> m/s</td></tr>
      <tr><td>&nbsp;&nbsp;r̈</td><td>${f2(s.rdd)}</td></tr>
      <tr><td>&nbsp;&nbsp;−rθ̇² (sentripetal)</td><td>${f2(-s.r*s.thd*s.thd)}</td></tr>
      <tr><td>${sw(css('--vAcc'))}a<sub>r</sub></td><td><b>${f2(ar)}</b></td></tr>
      <tr><td>&nbsp;&nbsp;rθ̈</td><td>${f2(s.r*s.thdd)}</td></tr>
      <tr><td>&nbsp;&nbsp;2ṙθ̇ (Coriolis)</td><td>${f2(2*s.rd*s.thd)}</td></tr>
      <tr><td>${sw(css('--vAcc'))}a<sub>θ</sub></td><td><b>${f2(ath)}</b></td></tr>
      <tr><td>${sw(css('--vA'))}|a|</td><td><b>${f2(Math.hypot(ar,ath))}</b> m/s²</td></tr>`;
  }
  const onR=()=>{resize();}; window.addEventListener('resize',onR);
  raf=requestAnimationFrame(frame);
  stopCurrent=()=>{cancelAnimationFrame(raf); window.removeEventListener('resize',onR);};
};

/* ===================== Utilitas tambahan ===================== */
function anim(step){
  let raf, last = performance.now(), alive = true;
  function f(now){ if(!alive) return; const dt = Math.max(0, Math.min(0.05,(now-last)/1000)); last = now; step(dt); raf = requestAnimationFrame(f); }
  raf = requestAnimationFrame(f);
  return () => { alive = false; cancelAnimationFrame(raf); };
}
function makePlot(parent, title, h){
  h = h || 160;
  const c = card(parent, title);
  const cv = document.createElement('canvas'); cv.style.width = '100%'; cv.style.display = 'block'; c.appendChild(cv);
  const draw = function(series, o){
    o = o || {};
    const W = Math.max(200, c.clientWidth - 28), H = o.h || h, dpr = window.devicePixelRatio || 1;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H+'px'; }
    const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle = css('--panel'); g.fillRect(0,0,W,H);
    let x0 = o.xmin, x1 = o.xmax, y0 = o.ymin, y1 = o.ymax;
    if(x0 === undefined || x1 === undefined || y0 === undefined || y1 === undefined){
      let a=Infinity,b=-Infinity,cc=Infinity,d=-Infinity;
      series.forEach(s => s.pts.forEach(p => { if(isFinite(p[0])&&isFinite(p[1])){ if(p[0]<a)a=p[0]; if(p[0]>b)b=p[0]; if(p[1]<cc)cc=p[1]; if(p[1]>d)d=p[1]; } }));
      if(x0===undefined) x0=a; if(x1===undefined) x1=b; if(y0===undefined) y0=cc; if(y1===undefined) y1=d;
    }
    if(!isFinite(x0)||!isFinite(x1)){x0=0;x1=1;} if(x1-x0<1e-12) x1=x0+1;
    if(!isFinite(y0)||!isFinite(y1)){y0=0;y1=1;} if(y1-y0<1e-12){ y0-=1; y1+=1; }
    if(!o.ymin && o.ymin!==0){ const m=(y1-y0)*0.06; y0-=m; y1+=m; }
    const L = 40, R = 8, T = 8, B = 20;
    const X = x => L + (x-x0)/(x1-x0)*(W-L-R), Y = y => H-B - (y-y0)/(y1-y0)*(H-B-T);
    g.strokeStyle = css('--grid'); g.lineWidth = 1; g.beginPath();
    for(let i=0;i<=4;i++){ const yy=T+i*(H-B-T)/4; g.moveTo(L,yy); g.lineTo(W-R,yy); } g.stroke();
    g.strokeStyle = css('--axis');
    if(y0<0 && y1>0){ g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-R,Y(0)); g.stroke(); }
    g.beginPath(); g.moveTo(L,T); g.lineTo(L,H-B); g.lineTo(W-R,H-B); g.stroke();
    g.fillStyle = css('--muted'); g.font = '10px system-ui';
    const fmt = v => Math.abs(v)>=1000||(Math.abs(v)<0.01&&v!==0) ? v.toExponential(1) : (+v.toFixed(2)).toString();
    g.textAlign='right'; g.fillText(fmt(y1), L-3, T+8); g.fillText(fmt(y0), L-3, H-B);
    g.textAlign='left'; g.fillText(fmt(x0), L, H-6); g.textAlign='right'; g.fillText(fmt(x1)+(o.xl?' '+o.xl:''), W-R, H-6); g.textAlign='left';
    let ly = 12;
    series.forEach(s => {
      g.save(); g.strokeStyle = s.color; g.lineWidth = s.w || 2; if(s.dash) g.setLineDash(s.dash);
      g.beginPath(); let started=false;
      s.pts.forEach(p => { if(!isFinite(p[1])) { started=false; return; } const px=X(p[0]), py=Y(Math.max(y0-(y1-y0),Math.min(y1+(y1-y0),p[1]))); if(!started){ g.moveTo(px,py); started=true; } else g.lineTo(px,py); });
      g.stroke(); g.restore();
      if(s.dot){ g.fillStyle = s.color; g.beginPath(); g.arc(X(s.dot[0]), Y(s.dot[1]), 4, 0, 7); g.fill(); }
      if(s.label){ g.fillStyle = s.color; g.font='11px system-ui'; g.textAlign='right'; g.fillText(s.label, W-R-2, T+ly); g.textAlign='left'; ly += 13; }
    });
    if(o.vline!==undefined){ g.strokeStyle=css('--muted'); g.setLineDash([3,3]); g.beginPath(); g.moveTo(X(o.vline),T); g.lineTo(X(o.vline),H-B); g.stroke(); g.setLineDash([]); }
    return {X, Y, g, W, H};
  };
  draw.canvas = cv; draw.card = c;
  return draw;
}
function readout(side, title){ const c = card(side, title||'Nilai'); const t = document.createElement('table'); t.className='ro'; c.appendChild(t); return rows => { t.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join(''); }; }
function buttons(parent, list){ const d=document.createElement('div'); d.className='row'; list.forEach(([lab,fn,ghost])=>{ const b=document.createElement('button'); b.className='btn'+(ghost?' ghost':''); b.textContent=lab; b.onclick=()=>fn(b); d.appendChild(b); }); parent.appendChild(d); return d; }
function rk4(f, y, t, h){
  const k1=f(t,y), y2=y.map((v,i)=>v+h/2*k1[i]), k2=f(t+h/2,y2), y3=y.map((v,i)=>v+h/2*k2[i]), k3=f(t+h/2,y3), y4=y.map((v,i)=>v+h*k3[i]), k4=f(t+h,y4);
  return y.map((v,i)=>v+h/6*(k1[i]+2*k2[i]+2*k3[i]+k4[i]));
}
function sim(code, title, chap, tasks, aspect, units){
  const s = shell(code, title, chap, tasks);
  const cs = setupCanvas(s.cv, aspect||0.62);
  s.ctx = cs.ctx; s.resize = cs.resize;
  s.v = makeView(s.cv, units||10);
  const onR = () => { cs.resize(); s.v.update(); };
  window.addEventListener('resize', onR);
  s.cleanup = [() => window.removeEventListener('resize', onR)];
  stopCurrent = () => s.cleanup.forEach(f => f());
  s.clear = () => { s.ctx.fillStyle = css('--panel'); s.ctx.fillRect(0,0,s.cv._w,s.cv._h); };
  return s;
}
function txt(ctx, s, x, y, col, font, align){ ctx.save(); ctx.fillStyle = col||css('--ink'); ctx.font = font||'13px system-ui'; ctx.textAlign = align||'left'; ctx.fillText(s, x, y); ctx.restore(); }
function box(ctx, x, y, w, h, fill, stroke){ ctx.save(); ctx.fillStyle=fill; ctx.fillRect(x,y,w,h); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
const G0 = 9.8;

/* ===================== SIM-2.1 Bidang miring ===================== */
SIMS['SIM-2.1'] = function(){
  const S = sim('SIM-2.1','Bidang Miring dan Gaya Gesek',2,[
    'Atur sudut 30°, μ<sub>s</sub> = 0,40, μ<sub>k</sub> = 0,30, tanpa dorongan (Contoh 2.1). Bandingkan percepatan dengan 2,35 m/s².',
    'Kecilkan sudut sampai balok tepat diam. Bandingkan tan θ dengan μ<sub>s</sub>.',
    'Saat balok diam, ubah gaya dorong ke atas bidang. Amati gesekan statis menyesuaikan diri sampai batas μ<sub>s</sub>N.'
  ], 0.62);
  const c1 = card(S.side,'Parameter');
  const sT = slider(c1,'th','Sudut θ (°)',0,60,1,30,x=>x+'°');
  const sM = slider(c1,'m','Massa m (kg)',1,10,0.5,5,x=>x.toFixed(1));
  const sMs = slider(c1,'ms','μ<sub>s</sub>',0,1,0.01,0.40,x=>x.toFixed(2));
  const sMk = slider(c1,'mk','μ<sub>k</sub>',0,1,0.01,0.30,x=>x.toFixed(2));
  const sF = slider(c1,'F','Dorongan ke atas bidang (N)',0,80,1,0,x=>x+' N');
  let s=0, v=0, t=0, hist=[];
  const reset = () => { s=0; v=0; t=0; hist=[]; };
  buttons(c1,[['Ulang',reset]]);
  [sT,sM,sMs,sMk].forEach(x=>x.addEventListener('input',reset));
  const ro = readout(S.side);
  const pl = makePlot(S.side,'Kecepatan sepanjang bidang v(t)');
  let st = {};
  S.cleanup.push(anim(dt => {
    const th = (+sT.value)*Math.PI/180, m=+sM.value, ms=+sMs.value, mk=+sMk.value, F=+sF.value;
    const N = m*G0*Math.cos(th), Fd = m*G0*Math.sin(th) - F;   // positif = menuruni bidang
    let f, a;
    if(Math.abs(v) < 1e-6){
      if(Math.abs(Fd) <= ms*N + 1e-9){ f = -Fd; a = 0; v = 0; }
      else { f = -Math.sign(Fd)*mk*N; a = (Fd+f)/m; }
    } else { f = -Math.sign(v)*mk*N; a = (Fd+f)/m; }
    const vn = v + a*dt;
    if(Math.abs(v)>1e-6 && Math.sign(vn)!==Math.sign(v)){ v = 0; } else v = vn;
    s += v*dt; t += dt;
    if(s>5.5 || s<-0.2 || t>12){ reset(); }
    if(hist.length===0 || t-hist[hist.length-1][0]>0.03) hist.push([t,v]);
    st = {th,m,N,f,a,F,Fd,ms,mk};
    draw();
  }));
  function draw(){
    const {ctx,cv} = S; S.clear();
    const th=st.th||0, W=cv._w, H=cv._h;
    const Lpx = Math.min(W*0.8, (H*0.75)/Math.max(0.2,Math.sin(th)+0.01)), base=Lpx*Math.cos(th), hgt=Lpx*Math.sin(th);
    const x0 = (W-base)/2, y0 = H*0.88;
    ctx.fillStyle = css('--chip'); ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+base,y0); ctx.lineTo(x0,y0-hgt); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = css('--axis'); ctx.stroke();
    const scale = Lpx/6, u = [Math.cos(th), Math.sin(th)];          // arah menuruni bidang (layar: x kanan, y bawah)
    const pos = 0.3 + s; const cx = x0 + u[0]*pos*scale, cy = y0 - hgt + u[1]*pos*scale;
    const bw=46, bh=30;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(th); ctx.fillStyle=css('--accent'); ctx.globalAlpha=0.85; ctx.fillRect(-bw/2,-bh,bw,bh); ctx.restore();
    const n=[Math.sin(th),-Math.cos(th)]; const C=[cx+n[0]*bh/2, cy+n[1]*bh/2];
    const k = 60/(Math.max(0.1,st.m||1)*G0);
    const ar=(vec,col,lab)=>arrow(ctx,C[0],C[1],C[0]+vec[0]*k,C[1]+vec[1]*k,col,2.4,lab);
    ar([0,(st.m||1)*G0], css('--vA'),'mg');
    ar([n[0]*(st.N||0), n[1]*(st.N||0)], css('--vB'),'N');
    if(Math.abs(st.f||0)>0.01) ar([u[0]*(st.f), u[1]*(st.f)], css('--vAcc'),'f');
    if((st.F||0)>0) ar([-u[0]*st.F, -u[1]*st.F], css('--vR'),'F');
    const moving = Math.abs(v)>1e-6;
    ro([
      ['tan θ', Math.tan(st.th||0).toFixed(3)],
      ['N = mg cos θ', f2(st.N||0)+' N'],
      ['komponen berat sejajar bidang', f2((st.m||0)*G0*Math.sin(st.th||0))+' N'],
      ['μ<sub>s</sub>N (batas statis)', f2((st.ms||0)*(st.N||0))+' N'],
      ['gesekan f', f2(Math.abs(st.f||0))+' N ('+(moving?'kinetis':'statis')+')'],
      ['percepatan a', f2(st.a||0)+' m/s²'],
      ['kecepatan v', f2(v)+' m/s'],
      ['keadaan', moving||Math.abs(st.a||0)>1e-6 ? '<b>bergerak</b>' : '<b>diam</b>']
    ]);
    pl([{pts:hist, color:css('--vR'), label:'v (m/s)'}], {xmin:0, xmax:Math.max(4,t), xl:'s'});
  }
};

/* ===================== SIM-2.2 Mesin Atwood ===================== */
SIMS['SIM-2.2'] = function(){
  const S = sim('SIM-2.2','Mesin Atwood',2,[
    'Atur m<sub>1</sub> = 2 kg dan m<sub>2</sub> = 3 kg (Contoh 2.2). Bandingkan T dengan m<sub>1</sub>g dan m<sub>2</sub>g.',
    'Buat m<sub>1</sub> = m<sub>2</sub>, lalu tekan "Beri dorongan". Apakah sistem berhenti?',
    'Buat m<sub>2</sub> jauh lebih besar dari m<sub>1</sub>. Menuju nilai berapa a dan T?'
  ], 0.7);
  const c1 = card(S.side,'Parameter');
  const s1 = slider(c1,'m1','m<sub>1</sub> (kg)',0.1,10,0.1,2,x=>x.toFixed(1));
  const s2 = slider(c1,'m2','m<sub>2</sub> (kg)',0.1,10,0.1,3,x=>x.toFixed(1));
  let y=0, v=0;
  const reset=()=>{y=0;v=0;};
  buttons(c1,[['Ulang',reset],['Beri dorongan',()=>{v=1;},true]]);
  [s1,s2].forEach(x=>x.addEventListener('input',reset));
  const ro = readout(S.side);
  S.cleanup.push(anim(dt=>{
    const m1=+s1.value, m2=+s2.value, a=(m2-m1)*G0/(m1+m2), T=2*m1*m2*G0/(m1+m2);
    v += a*dt; y += v*dt; if(Math.abs(y)>1.6) reset();
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, cx=W/2, py=H*0.12, R=Math.min(40,W*0.07), sc=H*0.22;
    ctx.strokeStyle=css('--axis'); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(cx,py-30); ctx.lineTo(cx,py); ctx.stroke();
    ctx.fillStyle=css('--chip'); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(cx,py,R,0,7); ctx.fill(); ctx.stroke();
    ctx.save(); ctx.translate(cx,py); ctx.rotate(-y/(R/sc)); ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(R,0); ctx.stroke(); ctx.restore();
    const y1 = py+H*0.4 - y*sc, y2 = py+H*0.4 + y*sc;
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(cx-R,py); ctx.lineTo(cx-R,y1); ctx.moveTo(cx+R,py); ctx.lineTo(cx+R,y2); ctx.stroke();
    const bs = m => 18+Math.sqrt(m)*10;
    const b1=bs(m1), b2=bs(m2);
    box(ctx,cx-R-b1/2,y1,b1,b1,css('--vA'),null); box(ctx,cx+R-b2/2,y2,b2,b2,css('--vB'),null);
    txt(ctx,'m₁',cx-R,y1+b1/2+5,'#fff','bold 13px system-ui','center'); txt(ctx,'m₂',cx+R,y2+b2/2+5,'#fff','bold 13px system-ui','center');
    const k=3;
    arrow(ctx,cx-R,y1,cx-R,y1-T*k,css('--vR'),2.4,'T'); arrow(ctx,cx-R,y1+b1,cx-R,y1+b1+m1*G0*k,css('--vAcc'),2.4,'m₁g');
    arrow(ctx,cx+R,y2,cx+R,y2-T*k,css('--vR'),2.4,'T'); arrow(ctx,cx+R,y2+b2,cx+R,y2+b2+m2*G0*k,css('--vAcc'),2.4,'m₂g');
    ro([['a = (m₂−m₁)g/(m₁+m₂)', f2(a)+' m/s²'],['T = 2m₁m₂g/(m₁+m₂)', f2(T)+' N'],['m₁g', f2(m1*G0)+' N'],['m₂g', f2(m2*G0)+' N'],['kecepatan m₂ (ke bawah)', f2(v)+' m/s']]);
  }));
};

/* ===================== SIM-3.1 Diagram energi potensial ===================== */
SIMS['SIM-3.1'] = function(){
  const S = sim('SIM-3.1','Diagram Energi Potensial',3,[
    'Pilih sumur ganda. Cari energi terkecil yang membuat partikel dapat berpindah lembah (bandingkan dengan V(0) = 2 J).',
    'Amati batang energi kinetik dan potensial. Di mana K maksimum?',
    'Tekan "Taruh di puncak": partikel diletakkan di x = 0 dengan laju hampir nol. Apa yang terjadi?'
  ], 0.62);
  const P = {
    pegas:{name:'Pegas  V = ½kx² (k = 2)', V:x=>x*x, dV:x=>2*x, x0:0, xr:[-2.2,2.2], vr:[-0.3,4.5], E:1},
    ganda:{name:'Sumur ganda  V = 2(x²−1)²', V:x=>2*(x*x-1)**2, dV:x=>8*x*(x*x-1), x0:1, xr:[-1.9,1.9], vr:[-0.3,5], E:1},
    molekul:{name:'Molekul (Morse)', V:x=>3*(1-Math.exp(-2*(x-1)))**2, dV:x=>12*(1-Math.exp(-2*(x-1)))*Math.exp(-2*(x-1)), x0:1, xr:[0.55,4], vr:[-0.3,5], E:1.5}
  };
  let key='ganda', x=1, v=0, E=1;
  const c1=card(S.side,'Bentuk potensial');
  seg(c1,[['pegas','Pegas'],['ganda','Sumur ganda'],['molekul','Molekul']],key,k=>{key=k; sE.value=P[k].E; sE.dispatchEvent(new Event('input')); start();});
  const sE = slider(c1,'E','Energi total E (J)',0.05,4.5,0.05,1,x=>x.toFixed(2)+' J');
  buttons(c1,[['Taruh di puncak',()=>{ if(key!=='ganda') return; x=0.0005; v=0; E=P.ganda.V(x); }],['Ulang',()=>start(),true]]);
  function start(){ const p=P[key]; E=+sE.value; x=p.x0; v=Math.sqrt(Math.max(0,2*(E-p.V(x)))); }
  sE.addEventListener('input',start); start();
  const ro = readout(S.side);
  S.cleanup.push(anim(dt=>{
    const p=P[key];
    for(let i=0;i<10;i++){ const y=rk4((t,y)=>[y[1],-p.dV(y[0])],[x,v],0,dt/10); x=y[0]; v=y[1]; }
    if(key==='molekul' && x>3.9){ start(); }
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, L=40,B=30;
    const X=t=>L+(t-p.xr[0])/(p.xr[1]-p.xr[0])*(W-L-10), Y=e=>H-B-(e-p.vr[0])/(p.vr[1]-p.vr[0])*(H-B-10);
    ctx.fillStyle=css('--chip'); ctx.globalAlpha=0.7;
    for(let px=L; px<W-10; px+=2){ const xx=p.xr[0]+(px-L)/(W-L-10)*(p.xr[1]-p.xr[0]); if(p.V(xx)>E) ctx.fillRect(px,10,2,H-B-10); }
    ctx.globalAlpha=1;
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(L,Y(0)); ctx.lineTo(W-10,Y(0)); ctx.moveTo(L,10); ctx.lineTo(L,H-B); ctx.stroke();
    ctx.strokeStyle=css('--vB'); ctx.lineWidth=2.5; ctx.beginPath();
    for(let px=L; px<W-10; px++){ const xx=p.xr[0]+(px-L)/(W-L-10)*(p.xr[1]-p.xr[0]); const yy=Y(Math.min(p.vr[1]+1,p.V(xx))); px===L?ctx.moveTo(px,yy):ctx.lineTo(px,yy); } ctx.stroke();
    ctx.strokeStyle=css('--vA'); ctx.setLineDash([6,4]); ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(L,Y(E)); ctx.lineTo(W-10,Y(E)); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx,'E',W-24,Y(E)-6,css('--vA'),'bold 13px system-ui'); txt(ctx,'V(x)',L+6,22,css('--vB'),'bold 13px system-ui'); txt(ctx,'x',W-20,H-10,css('--muted'));
    txt(ctx,'daerah terarsir: terlarang (V > E)',L+6,H-8,css('--muted'),'11px system-ui');
    const Vx=p.V(x), K=Math.max(0,E-Vx);
    ctx.strokeStyle=css('--vR'); ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(X(x),Y(Vx)); ctx.lineTo(X(x),Y(E)); ctx.stroke();
    ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(X(x),Y(E),7,0,7); ctx.fill();
    ctx.fillStyle=css('--vB'); ctx.beginPath(); ctx.arc(X(x),Y(Vx),4,0,7); ctx.fill();
    txt(ctx,'K',X(x)+8,(Y(Vx)+Y(E))/2,css('--vR'),'bold 12px system-ui');
    ro([['potensial', p.name],['x', f2(x)+' m'],['v', f2(v)+' m/s'],['V(x)', f2(Vx)+' J'],['K = E − V', f2(K)+' J'],['gaya F = −dV/dx', f2(-p.dV(x))+' N']]);
  }));
};

/* ===================== SIM-3.2 Jatuh dengan hambatan udara ===================== */
SIMS['SIM-3.2'] = function(){
  const S = sim('SIM-3.2','Jatuh dengan Hambatan Udara',3,[
    'Pilih air (tetes hujan) dan diameter 2 mm (Contoh 3.4). Bandingkan kecepatan terminal model kuadratik dengan 6,4 m/s.',
    'Kecilkan diameter sampai model linear dan kuadratik berbeda jauh. Lihat rasio f<sub>kuad</sub>/f<sub>lin</sub>: model mana yang benar?',
    'Bandingkan bola besi dan bola gabus berdiameter sama.'
  ], 0.5);
  const c1=card(S.side,'Bola');
  const mats=[['7800','Besi'],['2500','Kaca'],['1000','Air'],['200','Gabus']];
  let rho=1000;
  seg(c1,mats,'1000',k=>{rho=+k; compute();});
  const sD = slider(c1,'D','log₁₀ diameter (m)',-5,-0.5,0.05,Math.log10(0.002),x=>{const d=10**x; return d<1e-3?(d*1e6).toFixed(0)+' μm':d<1?(d*1e3).toFixed(1)+' mm':d.toFixed(2)+' m';});
  sD.addEventListener('input',()=>compute());
  const ro=readout(S.side);
  const pl=makePlot(S.side,'Laju v(t) untuk tiga model',190);
  let data=null, tCur=0;
  function compute(){
    const D=10**(+sD.value), m=rho*Math.PI/6*D**3, c1=1.6e-4*D, c2=0.25*D*D;
    const vtl=m*G0/c1, vtq=Math.sqrt(m*G0/c2);
    // nyata: c1 v + c2 v^2 = mg
    const vtr=(-c1+Math.sqrt(c1*c1+4*c2*m*G0))/(2*c2);
    const tEnd=Math.min(60,Math.max(0.01, 4*Math.min(vtr,vtq*2)/G0));
    const N=300, lin=[], kua=[], vak=[], nyata=[];
    let vv=0;
    for(let i=0;i<=N;i++){ const t=tEnd*i/N;
      vak.push([t,G0*t]); lin.push([t,vtl*(1-Math.exp(-G0*t/vtl))]); kua.push([t,vtq*Math.tanh(G0*t/vtq)]);
      nyata.push([t,vv]); const h=tEnd/N; for(let k=0;k<20;k++){ vv+=(G0-(c1*vv+c2*vv*vv)/m)*h/20; }
    }
    data={D,m,c1,c2,vtl,vtq,vtr,tEnd,lin,kua,vak,nyata};
    ro([['massa', m.toExponential(2)+' kg'],['v<sub>t</sub> linear = mg/c₁', vtl.toPrecision(3)+' m/s'],['v<sub>t</sub> kuadratik = √(mg/c₂)', vtq.toPrecision(3)+' m/s'],['v<sub>t</sub> gabungan (nyata)', vtr.toPrecision(3)+' m/s'],['rasio f<sub>kuad</sub>/f<sub>lin</sub> di v<sub>t</sub>', (1600*D*vtr).toPrecision(3)],['model yang tepat', 1600*D*vtr>10?'kuadratik':1600*D*vtr<0.1?'linear':'keduanya penting']]);
    tCur=0;
  }
  compute();
  S.cleanup.push(anim(dt=>{
    if(!data) return; tCur+=dt*data.tEnd/5; if(tCur>data.tEnd*1.15) tCur=0;
    const t=Math.min(tCur,data.tEnd), idx=Math.round(t/data.tEnd*300);
    const top=Math.min(data.vak[300][1], Math.max(data.vtq,data.vtl,data.vtr)*1.3);
    pl([{pts:data.vak,color:css('--muted'),dash:[4,4],label:'tanpa hambatan'},{pts:data.lin,color:css('--vB'),label:'linear'},{pts:data.kua,color:css('--vA'),label:'kuadratik'},{pts:data.nyata,color:css('--vR'),w:3,label:'gabungan',dot:data.nyata[idx]}],{xmin:0,xmax:data.tEnd,ymin:0,ymax:top,xl:'s',vline:t});
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h;
    const lanes=[['tanpa hambatan',data.vak,css('--muted')],['linear',data.lin,css('--vB')],['kuadratik',data.kua,css('--vA')],['gabungan',data.nyata,css('--vR')]];
    const dist = arr => { let s=0; for(let i=1;i<=idx;i++) s+=(arr[i][1]+arr[i-1][1])/2*(data.tEnd/300); return s; };
    const maxd = dist(data.nyata)>0 ? Math.max(...lanes.map(l=>{let s=0; for(let i=1;i<=300;i++) s+=(l[1][i][1]+l[1][i-1][1])/2*(data.tEnd/300); return s;})) : 1;
    lanes.forEach((l,i)=>{ const x=W*(0.15+0.23*i), d=dist(l[1]); const y=20+(H-50)*Math.min(1,d/maxd);
      ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x,H-30); ctx.stroke();
      ctx.fillStyle=l[2]; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill(); txt(ctx,l[0],x,H-12,l[2],'11px system-ui','center'); });
    txt(ctx,'t = '+t.toPrecision(3)+' s',10,16,css('--muted'),'12px system-ui');
  }));
};

/* ===================== SIM-4.1 Osilator pegas & bandul ===================== */
SIMS['SIM-4.1'] = function(){
  const S = sim('SIM-4.1','Osilator Pegas dan Bandul',4,[
    'Mode pegas: ubah amplitudo. Apakah periode berubah?',
    'Mode bandul: bandingkan periode terukur untuk simpangan 10°, 30°, 60°, dan 90° dengan T₀ = 2π√(L/g).',
    'Bandingkan kapan v dan a mencapai maksimum pada grafik.'
  ], 0.5);
  let mode='pegas';
  const c1=card(S.side,'Mode'); seg(c1,[['pegas','Pegas–massa'],['bandul','Bandul']],mode,k=>{mode=k; reset();});
  const c2=card(S.side,'Parameter');
  const sM=slider(c2,'m','m (kg) / L (m)',0.2,2,0.1,0.5,x=>x.toFixed(1));
  const sK=slider(c2,'k','k (N/m)',5,100,1,20,x=>x.toFixed(0));
  const sA=slider(c2,'A','Amplitudo (m) / θ₀ (°)',0.1,170,0.1,0.5,x=>x.toFixed(1));
  [sM,sK,sA].forEach(s=>s.addEventListener('input',()=>reset()));
  const ro=readout(S.side);
  const pl=makePlot(S.side,'x (atau θ), v, a terhadap t',170);
  const ph=makePlot(S.side,'Ruang fase',170);
  let y=[0,0], t=0, hist=[], phase=[], lastCross=null, Tmeas=null, prev=0;
  function reset(){ const A=+sA.value; y = mode==='pegas' ? [Math.min(A,1.5),0] : [Math.min(A,170)*Math.PI/180,0]; t=0; hist=[]; phase=[]; lastCross=null; Tmeas=null; prev=y[0]; }
  reset();
  S.cleanup.push(anim(dt=>{
    const m=+sM.value, k=+sK.value, L=+sM.value;
    const f = mode==='pegas' ? (t,y)=>[y[1],-k/m*y[0]] : (t,y)=>[y[1],-G0/L*Math.sin(y[0])];
    for(let i=0;i<8;i++){ const yn=rk4(f,y,t,dt/8);
      if(y[1]>0 && yn[1]<=0){ const tc=t+dt/8; if(lastCross!==null) Tmeas=tc-lastCross; lastCross=tc; }
      y=yn; t+=dt/8; }
    const a = f(t,y)[1];
    hist.push([t,y[0],y[1],a]); if(hist.length>400) hist.shift(); phase.push([y[0],y[1]]); if(phase.length>800) phase.shift();
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h;

  function comp(){ const r=work(fields[fk],paths[pk]); cum=r.out; s=0;
    const all=Object.keys(paths).map(k=>[paths[k].n, work(fields[fk],paths[k]).W.toFixed(3)+' J']);

/* ===================== SIM-7.1 Komidi putar ===================== */
SIMS['SIM-7.1'] = function(){

  let from='pusat'; seg(c1,[['pusat','Dari pusat ke luar'],['tepi','Dari tepi ke pusat']],from,k=>{from=k;reset();});

    const w=+sW.value, v=+sV.value; t+=dt*0.8;
    let r0, V; if(from==='pusat'){ r0=[0,0]; V=[v,0]; } else { r0=[1,0]; V=[-v,w*1]; }
    const ri=[r0[0]+V[0]*t, r0[1]+V[1]*t]; if(Math.hypot(ri[0],ri[1])>1.15 || t>8){ reset(); return; }
    const c=Math.cos(-w*t), s=Math.sin(-w*t), rr=[c*ri[0]-s*ri[1], s*ri[0]+c*ri[1]];
    trailI.push(ri); trailR.push(rr);
    const vI=V, vr0=[vI[0]+w*ri[1], vI[1]-w*ri[0]], vr=[c*vr0[0]-s*vr0[1], s*vr0[0]+c*vr0[1]];
    const cen=[w*w*rr[0], w*w*rr[1]], cor=[2*w*vr[1], -2*w*vr[0]];
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, R=Math.min(W/4-14,H/2-24);

      const q=trail[trail.length-1]; ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(cx+q[0]*R,cy-q[1]*R,6,0,7); ctx.fill();
      txt(ctx,title,cx,cy+R+18,css('--muted'),'12px system-ui','center');
    };
    panel(W*0.25,H/2,w*t,trailI,'Dilihat dari luar (inersia)');

  }));

/* ===================== SIM-7.2 Bandul Foucault ===================== */

  ], 0.75, 2.6);

    ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.arc(v.X(0),v.Y(0),v.s*1.05,0,7); ctx.stroke();
    ['U','S','T','B'].forEach((d,i)=>{ const a=[Math.PI/2,-Math.PI/2,0,Math.PI][i]; txt(ctx,d,v.X(1.18*Math.cos(a)),v.Y(1.18*Math.sin(a))+4,css('--muted'),'bold 12px system-ui','center'); });

    const sl=Math.sin(lam), Tp=Math.abs(sl)>1e-4?23.934/Math.abs(sl):Infinity;
    ro([['periode presesi nyata', isFinite(Tp)?Tp.toFixed(1)+' jam = '+(Tp/24).toFixed(2)+' hari':'tak berhingga (tidak berpresesi)'],['arah presesi (dari atas)', Math.abs(sl)<1e-4?'—':sl>0?'searah jarum jam':'berlawanan jarum jam'],['sudut bidang ayun', ((ang*180/Math.PI)%360).toFixed(1)+'°'],['catatan','rotasi Bumi diperbesar agar presesi terlihat']]);
  }));

/* ===================== SIM-9.1 Orbit Kepler ===================== */
SIMS['SIM-9.1'] = function(){

    'Ubah laju awal; catat T dan a, lalu periksa T²/a³ (satuan tahun dan AU) selalu 1.'
  ], 0.75, 7);

  reset();
  const f=(t,y)=>{ const r=Math.hypot(y[0],y[1]), k=-GM/(r*r*r); return [y[2],y[3],k*y[0],k*y[1]]; };
  S.cleanup.push(anim(dt=>{
    const step=T/600; for(let i=0;i<6;i++){ y=rk4(f,y,t,step); t+=step; const k=Math.floor(t/(T/12)); if(k>=12){ reset(); return; } while(secs.length<=k) secs.push([secs[secs.length-1].slice(-1)[0]]); secs[k].push([y[0],y[1]]); }
    const {ctx,cv,v}=S; v.update(); S.clear(); const sc=Math.min(2.5, 3/Math.max(rmax,0.3)), cx=0;

    ctx.strokeStyle=css('--muted'); ctx.lineWidth=1.2; ctx.beginPath(); for(let i=0;i<=360;i++){ const th=i*Math.PI/180, r=a*(1-e*e)/(1+sg*e*Math.cos(th)); const p=P([r*Math.cos(th),r*Math.sin(th)]); i?ctx.lineTo(...p):ctx.moveTo(...p); } ctx.stroke();

    const r=Math.hypot(y[0],y[1]), vv=Math.hypot(y[2],y[3]), dA=(y[0]*y[3]-y[1]*y[2])/2;
    ro([['r', r.toFixed(3)+' AU'],['laju v', vv.toFixed(3)+' AU/thn'],['dA/dt = |r×v|/2', dA.toFixed(4)+' AU²/thn (tetap)'],['a, e', a.toFixed(3)+' AU, '+e.toFixed(3)],['periode T', T.toFixed(3)+' tahun'],['T²/a³', (T*T/(a**3)).toFixed(4)],['r<sub>p</sub>v<sub>p</sub> dan r<sub>a</sub>v<sub>a</sub>', (rmin*vmax).toFixed(3)+' dan '+(rmax*vmin).toFixed(3)]]);
  }));

  function run(){
    const mu=+sM.value; let v=+sV.value, u=+sW.value, x=0, ang=0, t=0, tr=null; const dt=0.002, R=0.11; const pv=[[0,v]], pw=[[0,u]], xs=[[0,0,0]];
    while(t<6){ const slip=v-u; if(Math.abs(slip)>1e-4){ const s=Math.sign(slip); v+=-s*mu*G0*dt; u+=s*2.5*mu*G0*dt; if(Math.sign(v-u)!==s){ const m=(v+2.5*u)/3.5; v=m;u=m; if(tr===null) tr=[t,v,x]; } } else { if(tr===null) tr=[t,v,x]; }
      x+=v*dt; ang+=u/R*dt; t+=dt; if(Math.round(t/dt)%10===0){ pv.push([t,v]); pw.push([t,u]); xs.push([t,x,ang]); } }
    data={pv,pw,xs,tr}; tA=0;
    ro([['saat mulai menggelinding', tr?tr[0].toFixed(2)+' s':'—'],['laju saat itu', tr?tr[1].toFixed(2)+' m/s':'—'],['jarak selama selip', tr?tr[2].toFixed(2)+' m':'—'],['rumus (tanpa putaran awal) 5v₀/7', (5*(+sV.value)/7).toFixed(2)+' m/s']]);
  }
  run();
  S.cleanup.push(anim(dt=>{
    tA+=dt; if(tA>6) tA=0; const i=Math.min(data.xs.length-1,Math.round(tA/0.02));
    pl([{pts:data.pv,color:css('--vB'),dot:data.pv[i]},{pts:data.pw,color:css('--vA'),dot:data.pw[i]}],{xmin:0,xmax:6,xl:'s',vline:data.tr?data.tr[0]:undefined});
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, xmax=Math.max(1,...data.xs.map(p=>Math.abs(p[1]))), sc=(W-60)/xmax/1.05;
    const X=x=>30+x*sc, y=H-24, r=16, q=data.xs[i];
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(10,y+r); ctx.lineTo(W-10,y+r); ctx.stroke();
    ctx.fillStyle=css('--vD'); ctx.beginPath(); ctx.arc(X(q[1]),y,r,0,7); ctx.fill();
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(X(q[1]),y); ctx.lineTo(X(q[1])+r*Math.sin(q[2]),y-r*Math.cos(q[2])); ctx.stroke();
    if(data.tr){ ctx.strokeStyle=css('--vR'); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(X(data.tr[2]),10); ctx.lineTo(X(data.tr[2]),y+r); ctx.stroke(); ctx.setLineDash([]); txt(ctx,'mulai menggelinding',X(data.tr[2])+4,22,css('--vR'),'11px system-ui'); }
  }));
};

/* ===================== SIM-13.1 Manik pada cincin berputar ===================== */
SIMS['SIM-13.1'] = function(){
  const S = sim('SIM-13.1','Manik pada Cincin Berputar',13,[
    'Naikkan ω perlahan dari nol. Pada nilai berapa dasar cincin berhenti menjadi tempat setimbang yang stabil?',
    'Bandingkan sudut setimbang manik dengan cos θ₀ = g/(Rω²).',
    'Perhatikan diagram bifurkasi θ₀ terhadap ω di panel samping.'
  ], 0.7, 0.32);
  const Rr=0.1, wc=Math.sqrt(G0/Rr);
  const c1=card(S.side,'R = 10 cm, ω<sub>c</sub> = √(g/R) ≈ 9,90 rad/s');
  const sW=slider(c1,'w','ω (rad/s)',0,25,0.1,6,x=>x.toFixed(1));
  const cD=check(c1,'Sedikit gesekan (agar manik menetap)',true);
  buttons(c1,[['Ganggu manik',()=>{y[1]+=3;}]]);
  const ro=readout(S.side);
  const pu=makePlot(S.side,'Potensial efektif U(θ) (kerangka berputar)',150), pb=makePlot(S.side,'Bifurkasi: θ₀ (°) terhadap ω',150);
  let y=[0.3,0], phi=0;
  S.cleanup.push(anim(dt=>{
    const w=+sW.value, c=cD.checked?1.0:0;
    for(let i=0;i<10;i++) y=rk4((t,y)=>[y[1],Math.sin(y[0])*(w*w*Math.cos(y[0])-G0/Rr)-c*y[1]],y,0,dt/10);
    if(y[0]>Math.PI) y[0]-=2*Math.PI; if(y[0]<-Math.PI) y[0]+=2*Math.PI;
    phi+=w*dt;
    const U=th=>-0.5*Rr*Rr*w*w*Math.sin(th)**2-G0*Rr*Math.cos(th);
    const pts=[]; for(let i=0;i<=200;i++){ const th=-Math.PI+i*2*Math.PI/200; pts.push([th*180/Math.PI,U(th)]); }
    pu([{pts,color:css('--vB'),dot:[y[0]*180/Math.PI,U(y[0])]}],{xmin:-180,xmax:180,xl:'θ (°)'});
    const b1=[],b2=[],b3=[]; for(let i=0;i<=200;i++){ const ww=25*i/200; b1.push([ww,0]); if(ww>wc){ const a=Math.acos(G0/(Rr*ww*ww))*180/Math.PI; b2.push([ww,a]); b3.push([ww,-a]); } }
    const th0 = w>wc?Math.acos(G0/(Rr*w*w))*180/Math.PI:0;
    pb([{pts:b1.filter(p=>p[0]<=wc),color:css('--vR')},{pts:b1.filter(p=>p[0]>=wc),color:css('--muted'),dash:[4,4]},{pts:b2,color:css('--vR')},{pts:b3,color:css('--vR'),dot:[w,th0]}],{xmin:0,xmax:25,ymin:-95,ymax:95,xl:'rad/s'});
    const {ctx,cv,v}=S; v.update(); S.clear(); const R=v.s*0.1;
    const sx=Math.cos(phi);
    ctx.strokeStyle=css('--axis'); ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(v.X(0),v.Y(0.14)); ctx.lineTo(v.X(0),v.Y(-0.14)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(v.X(0),v.Y(0),Math.abs(sx)*R+1,R,0,0,7); ctx.stroke();
    const bx=v.X(0)+R*Math.sin(y[0])*sx, by=v.Y(0)+R*Math.cos(y[0]);
    ctx.fillStyle=css('--vA'); ctx.beginPath(); ctx.arc(bx,by,8,0,7); ctx.fill();
    ro([['ω / ω<sub>c</sub>', (w/wc).toFixed(2)],['θ manik', (y[0]*180/Math.PI).toFixed(1)+'°'],['θ₀ teori', w>wc?'±'+th0.toFixed(1)+'°':'0° (dasar stabil)'],['frekuensi osilasi kecil', w<wc?Math.sqrt(G0/Rr-w*w).toFixed(2)+' rad/s di dasar':(w*Math.sin(th0*Math.PI/180)).toFixed(2)+' rad/s di θ₀']]);
  }));
};

/* ===================== SIM-13.2 Bandul ganda ===================== */
SIMS['SIM-13.2'] = function(){
  const S = sim('SIM-13.2','Bandul Ganda dan Kekacauan',13,[
    'Dengan simpangan kecil (10°), apakah kedua bandul tetap berdekatan?',
    'Dengan simpangan besar (120°), setelah berapa detik keduanya berpisah (selisih > 10°)?',
    'Amati energi total: tetapkah nilainya? Apa artinya bagi ketelitian perhitungan numerik?'
  ], 0.75, 5);
  const c1=card(S.side,'m₁ = m₂ = 1 kg, l₁ = l₂ = 1 m');
  const sA=slider(c1,'a','simpangan awal θ₁ = θ₂ (°)',5,175,1,120,x=>x+'°');
  const sD=slider(c1,'d','selisih awal bandul kedua (°)',0.0001,1,0.0001,0.001,x=>x.toFixed(4)+'°');
  [sA,sD].forEach(s=>s.addEventListener('input',reset)); buttons(c1,[['Ulang',reset]]);
  const ro=readout(S.side);
  const pe=makePlot(S.side,'Selisih θ₂ kedua bandul (°)',150);
  let A,B,t,tr1,tr2,diff,tsep,E0;
  const g=G0;
  const f=(t,y)=>{ const [a1,a2,w1,w2]=y, d=a1-a2, den=3-Math.cos(2*d);
    const dw1=(-g*3*Math.sin(a1)-g*Math.sin(a1-2*a2)-2*Math.sin(d)*(w2*w2+w1*w1*Math.cos(d)))/den;
    const dw2=(2*Math.sin(d)*(w1*w1*2+g*2*Math.cos(a1)+w2*w2*Math.cos(d)))/den;
    return [w1,w2,dw1,dw2]; };
  const En=y=>{ const [a1,a2,w1,w2]=y; return w1*w1+0.5*w2*w2+w1*w2*Math.cos(a1-a2)-2*g*Math.cos(a1)-g*Math.cos(a2); };
  function reset(){ const a=(+sA.value)*Math.PI/180, d=(+sD.value)*Math.PI/180; A=[a,a,0,0]; B=[a,a+d,0,0]; t=0; tr1=[]; tr2=[]; diff=[]; tsep=null; E0=En(A); }
  reset();
  S.cleanup.push(anim(dt=>{
    for(let i=0;i<20;i++){ A=rk4(f,A,t,dt/20); B=rk4(f,B,t,dt/20); t+=dt/20; }
    const dd=Math.abs(((B[1]-A[1])*180/Math.PI+540)%360-180); if(tsep===null && dd>10) tsep=t;
    diff.push([t,dd]); if(diff.length>2000) diff.shift();
    const {ctx,cv,v}=S; v.update(); S.clear();
    const P=(y)=>{ const x1=Math.sin(y[0]), y1=-Math.cos(y[0]), x2=x1+Math.sin(y[1]), y2=y1-Math.cos(y[1]); return [[0,0.6],[x1,y1+0.6],[x2,y2+0.6]]; };
    const pa=P(A), pb2=P(B);
    tr1.push(pa[2]); tr2.push(pb2[2]); if(tr1.length>600){tr1.shift();tr2.shift();}
    [[tr1,css('--vB')],[tr2,css('--vA')]].forEach(([tr,c])=>{ ctx.strokeStyle=c; ctx.globalAlpha=0.35; ctx.lineWidth=1.2; ctx.beginPath(); tr.forEach((p,i)=>i?ctx.lineTo(v.X(p[0]),v.Y(p[1])):ctx.moveTo(v.X(p[0]),v.Y(p[1]))); ctx.stroke(); ctx.globalAlpha=1; });
    [[pa,css('--vB')],[pb2,css('--vA')]].forEach(([p,c])=>{ ctx.strokeStyle=c; ctx.lineWidth=2.5; ctx.beginPath(); p.forEach((q,i)=>i?ctx.lineTo(v.X(q[0]),v.Y(q[1])):ctx.moveTo(v.X(q[0]),v.Y(q[1]))); ctx.stroke(); ctx.fillStyle=c; [1,2].forEach(k=>{ ctx.beginPath(); ctx.arc(v.X(p[k][0]),v.Y(p[k][1]),8,0,7); ctx.fill(); }); });
    ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(v.X(0),v.Y(0.6),4,0,7); ctx.fill();
    pe([{pts:diff,color:css('--vD')}],{xmin:Math.max(0,t-30),xmax:Math.max(30,t),ymin:0,ymax:180,xl:'s'});
    ro([['waktu', t.toFixed(1)+' s'],['selisih sudut bandul bawah', dd.toFixed(3)+'°'],['berpisah (> 10°) pada', tsep?tsep.toFixed(1)+' s':'belum'],['energi relatif E/E₀ − 1', (En(A)/E0-1).toExponential(2)]]);
  }));
};

/* ===================== SIM-14.1 Osilator tergandeng ===================== */
SIMS['SIM-14.1'] = function(){
  const S = sim('SIM-14.1','Osilator Tergandeng dan Mode Normal',14,[
    'Eksitasi mode 1 dan mode 2 terpisah; bandingkan frekuensinya dengan √(k/m) dan √((k+2k′)/m).',
    'Simpangkan satu balok saja; ukur periode pertukaran energi dan bandingkan dengan 2π/(ω₂ − ω₁).',
    'Perkecil k′. Apa yang terjadi pada periode layangan?'
  ], 0.35);
  const c1=card(S.side,'m = 0,5 kg');
  const sK=slider(c1,'k','k (N/m)',10,100,1,50,x=>x.toFixed(0)), sC=slider(c1,'kc','k′ penggandeng (N/m)',0.5,50,0.5,10,x=>x.toFixed(1));
  let ini='satu'; seg(c1,[['mode1','Mode 1 (searah)'],['mode2','Mode 2 (berlawanan)'],['satu','Satu balok saja']],ini,k=>{ini=k;reset();});
  [sK,sC].forEach(s=>s.addEventListener('input',reset));
  const ro=readout(S.side);
  const px=makePlot(S.side,'x₁ (biru) dan x₂ (merah)',150), pn=makePlot(S.side,'Koordinat normal (x₁+x₂)/2 dan (x₁−x₂)/2',150);
  let y,t,h;
  function reset(){ y = ini==='mode1'?[0.3,0.3,0,0]:ini==='mode2'?[0.3,-0.3,0,0]:[0.3,0,0,0]; t=0; h=[]; }
  reset();
  S.cleanup.push(anim(dt=>{
    const m=0.5,k=+sK.value,kc=+sC.value;
    for(let i=0;i<10;i++){ y=rk4((t,y)=>[y[2],y[3],(-k*y[0]-kc*(y[0]-y[1]))/m,(-k*y[1]-kc*(y[1]-y[0]))/m],y,t,dt/10); t+=dt/10; }
    h.push([t,y[0],y[1]]); if(h.length>900) h.shift();
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, cy=H/2, sc=W*0.12, p1=W*0.33+y[0]*sc, p2=W*0.67+y[1]*sc;
    const spring=(a,b,col)=>{ ctx.strokeStyle=col; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(a,cy); for(let i=1;i<=12;i++) ctx.lineTo(a+(b-a)*i/12, cy+(i%2?-8:8)*(i<12?1:0)); ctx.stroke(); };
    ctx.fillStyle=css('--axis'); ctx.fillRect(4,cy-30,8,60); ctx.fillRect(W-12,cy-30,8,60);
    spring(12,p1-18,css('--ink')); spring(p1+18,p2-18,css('--vD')); spring(p2+18,W-12,css('--ink'));
    box(ctx,p1-18,cy-18,36,36,css('--vB'),null); box(ctx,p2-18,cy-18,36,36,css('--vA'),null);
    const t0=h[0][0];
    px([{pts:h.map(q=>[q[0],q[1]]),color:css('--vB')},{pts:h.map(q=>[q[0],q[2]]),color:css('--vA')}],{xmin:t0,xmax:Math.max(t0+1,t),ymin:-0.35,ymax:0.35,xl:'s'});
    pn([{pts:h.map(q=>[q[0],(q[1]+q[2])/2]),color:css('--vR'),label:'mode 1'},{pts:h.map(q=>[q[0],(q[1]-q[2])/2]),color:css('--vAcc'),label:'mode 2'}],{xmin:t0,xmax:Math.max(t0+1,t),ymin:-0.35,ymax:0.35,xl:'s'});
    const w1=Math.sqrt(k/m), w2=Math.sqrt((k+2*kc)/m);
    ro([['ω₁ = √(k/m)', w1.toFixed(2)+' rad/s'],['ω₂ = √((k+2k′)/m)', w2.toFixed(2)+' rad/s'],['periode layangan 2π/(ω₂−ω₁)', (2*Math.PI/(w2-w1)).toFixed(2)+' s']]);
  }));
};

/* ===================== SIM-14.2 Ruang fase bandul ===================== */
SIMS['SIM-14.2'] = function(){
  const S = sim('SIM-14.2','Ruang Fase Bandul',14,[
    'Ketuk titik-titik di dekat pusat ruang fase. Bentuk apa yang Anda lihat?',
    'Cari separatriks dengan mencoba energi yang makin besar.',
    'Mulai tepat di separatriks (tombol). Berapa lama bandul mencapai puncak?'
  ], 0.62);
  const c1=card(S.side,'Bandul: m = 1 kg, l = 1 m; H = p²/2ml² − mgl cos θ');
  buttons(c1,[['Mulai di separatriks',()=>{ y=[0,2*Math.sqrt(G0)*0.99999]; tr=[]; t=0; }],['Hapus jejak',()=>{tr=[];},true]]);
  const ro=readout(S.side);
  let y=[1,0], tr=[], t=0;
  const pmax=9;
  S.cv.addEventListener('pointerdown',e=>{ const r=S.cv.getBoundingClientRect(), W=S.cv._w*0.7, H=S.cv._h; const px=e.clientX-r.left, py=e.clientY-r.top; if(px>W) return; y=[(px/W*2-1)*Math.PI, (1-py/H*2)*pmax]; tr=[]; t=0; });
  const Hf=(th,p)=>p*p/2-G0*Math.cos(th);
  S.cleanup.push(anim(dt=>{
    for(let i=0;i<10;i++){ y=rk4((t,y)=>[y[1],-G0*Math.sin(y[0])],y,t,dt/10); t+=dt/10; }
    let th=((y[0]+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
    tr.push([th,y[1]]); if(tr.length>1500) tr.shift();
    const {ctx,cv}=S; S.clear(); const W=cv._w*0.7, H=cv._h;
    const X=a=>(a/Math.PI+1)/2*W, Y=p=>(1-p/pmax)/2*H;
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(0,Y(0)); ctx.lineTo(W,Y(0)); ctx.moveTo(X(0),0); ctx.lineTo(X(0),H); ctx.stroke();
    [-8,-5,-2,1,4,7,9.8,13,18,25,35].forEach(E=>{ const sep=Math.abs(E-G0)<0.01; ctx.strokeStyle=sep?css('--vA'):css('--grid'); ctx.lineWidth=sep?2:1.2;
      [1,-1].forEach(sg=>{ ctx.beginPath(); let st=false; for(let i=0;i<=400;i++){ const a=-Math.PI+i*2*Math.PI/400, q=2*(E+G0*Math.cos(a)); if(q<0){st=false;continue;} const p=sg*Math.sqrt(q); if(!st){ctx.moveTo(X(a),Y(p));st=true;} else ctx.lineTo(X(a),Y(p)); } ctx.stroke(); }); });
    ctx.strokeStyle=css('--vB'); ctx.lineWidth=2; ctx.beginPath(); tr.forEach((q,i)=>{ if(i&&Math.abs(q[0]-tr[i-1][0])>3){ ctx.moveTo(X(q[0]),Y(q[1])); } else i?ctx.lineTo(X(q[0]),Y(q[1])):ctx.moveTo(X(q[0]),Y(q[1])); }); ctx.stroke();
    ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(X(th),Y(y[1]),5,0,7); ctx.fill();
    txt(ctx,'θ',W-12,Y(0)-6,css('--muted')); txt(ctx,'p_θ',X(0)+6,14,css('--muted')); txt(ctx,'merah: separatriks (E = mgl)',8,H-8,css('--vA'),'11px system-ui');
    const cx=W+(cv._w-W)/2, cy=H*0.35, L=Math.min(cv._w-W,H)*0.4;
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+L*Math.sin(y[0]),cy+L*Math.cos(y[0])); ctx.stroke();
    ctx.fillStyle=css('--accent'); ctx.beginPath(); ctx.arc(cx+L*Math.sin(y[0]),cy+L*Math.cos(y[0]),10,0,7); ctx.fill();
    const E=Hf(y[0],y[1]);
    ro([['energi H', E.toFixed(2)+' J'],['energi separatriks mgl', G0.toFixed(2)+' J'],['jenis gerak', Math.abs(E-G0)<0.05?'di separatriks':E<G0?'<b>librasi</b> (berayun)':'<b>rotasi</b> (berputar penuh)'],['petunjuk','ketuk ruang fase untuk memulai']]);
  }));
};
