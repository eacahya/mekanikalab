></semantics></math>\nrad/s,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>08</mn></mrow><annotation encoding=\"application/x-tex\">K \\approx 3{,}08</annotation></semantics></math>\nkJ.</li>\n<li>Cakram:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mo>∫</mo><mn>0</mn><mi>R</mi></msubsup><msup><mi>r</mi><mn>2</mn></msup><mspace width=\"0.167em\"></mspace><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mi>M</mi><mi>/</mi><msup><mi>R</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>r</mi><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">\\int_0^R r^2\\,(2M/R^2)\\,r\\,dr</annotation></semantics></math>;\nbola: jumlahkan cakram tipis\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>d</mi><mi>m</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msup><mi>r</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac{1}{2}(dm)r^2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mi>/</mi><mn>3</mn><mo>,</mo><mn>5</mn><mo>=</mo><mn>2</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">a = g/3{,}5 = 2{,}8</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>1</mn></msub><mo>=</mo><mn>12</mn><mo>,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">T_1 = 12{,}6</annotation></semantics></math>\nN;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>2</mn></msub><mo>=</mo><mn>14</mn><mo>,</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">T_2 = 14{,}0</annotation></semantics></math>\nN.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>m</mi><mi>g</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><mo>+</mo><mi>M</mi><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>3</mn><mo>,</mo><mn>27</mn></mrow><annotation encoding=\"application/x-tex\">a = mg/(m + M/2) \\approx 3{,}27</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><mi>a</mi><mo>≈</mo><mn>6</mn><mo>,</mo><mn>53</mn></mrow><annotation encoding=\"application/x-tex\">T = \\tfrac{1}{2}Ma \\approx 6{,}53</annotation></semantics></math>\nN.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mn>3</mn><mi>g</mi><mi>/</mi><mn>2</mn><mi>L</mi><mo>=</mo><mn>14</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">\\alpha = 3g/2L = 14{,}7</annotation></semantics></math>\nrad/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><mn>14</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">a_t = 14{,}7</annotation></semantics></math>\nm/s²\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>1</mn><mo>,</mo><mn>5</mn><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">= 1{,}5g</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mn>2</mn><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">I = 2MR^2</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">d = R</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mrow><mn>2</mn><mi>R</mi><mi>/</mi><mi>g</mi></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>27</mn></mrow><annotation encoding=\"application/x-tex\">T = 2\\pi\\sqrt{2R/g} \\approx 1{,}27</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>T</mi><mi>/</mi><mi>d</mi><mi>d</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">dT/dd = 0</annotation></semantics></math>\ndi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><msub><mi>k</mi><mtext mathvariant=\"normal\">pm</mtext></msub><mo>=</mo><mi>L</mi><mi>/</mi><msqrt><mn>12</mn></msqrt><mo>≈</mo><mn>0</mn><mo>,</mo><mn>289</mn></mrow><annotation encoding=\"application/x-tex\">d = k_{\\text{pm}} = L/\\sqrt{12} \\approx 0{,}289</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mo>min</mo></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mrow><mn>2</mn><msub><mi>k</mi><mtext mathvariant=\"normal\">pm</mtext></msub><mi>/</mi><mi>g</mi></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>53</mn></mrow><annotation encoding=\"application/x-tex\">T_{\\min} = 2\\pi\\sqrt{2k_{\\text{pm}}/g} \\approx 1{,}53</annotation></semantics></math>\ns.</li>\n<li>Terhadap diameter:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>1</mn><mn>4</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac{1}{4}MR^2</annotation></semantics></math>;\nterhadap garis singgung:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>1</mn><mn>4</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mfrac displaystyle=\"false\"><mn>5</mn><mn>4</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\tfrac{1}{4}MR^2 + MR^2 = \\tfrac{5}{4}MR^2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>P</mi><mo>=</mo><mi>τ</mi><mi>ω</mi><mo>≈</mo><mn>15</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">P = \\tau\\omega \\approx 15{,}7</annotation></semantics></math>\nkW.</li>\n<li>Samakan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>k</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>d</mi><mn>1</mn><mn>2</mn></msubsup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><msub><mi>d</mi><mn>1</mn></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>k</mi><mn>2</mn></msup><mo>+</mo><msubsup><mi>d</mi><mn>2</mn><mn>2</mn></msubsup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><msub><mi>d</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">(k^2 + d_1^2)/d_1 = (k^2 + d_2^2)/d_2</annotation></semantics></math>.\nJarak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>d</mi><mn>1</mn></msub><mo>+</mo><msub><mi>d</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">d_1 + d_2</annotation></semantics></math>\nantara dua poros dapat diukur sangat teliti, dan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math>\ntidak perlu diketahui.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mi>m</mi><mi>v</mi><mi>L</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>3</mn></mfrac><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><mo>+</mo><mi>m</mi><msup><mi>L</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>5</mn><mo>,</mo><mn>91</mn></mrow><annotation encoding=\"application/x-tex\">\\omega = mvL/(\\tfrac{1}{3}ML^2 + mL^2) \\approx 5{,}91</annotation></semantics></math>\nrad/s; energi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>11</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 11{,}8</annotation></semantics></math>\nJ\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><mi>g</mi><mi>L</mi><mi>/</mi><mn>2</mn><mo>+</mo><mi>m</mi><mi>g</mi><mi>L</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><mo>cos</mo><msub><mi>θ</mi><mo>max</mo></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">= (MgL/2 + mgL)(1 - \\cos\\theta_{\\max})</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mo>max</mo></msub><mo>≈</mo><mn>101</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\max} \\approx 101°</annotation></semantics></math>.\nPoros mengerjakan gaya luar mendatar selama tumbukan, tetapi gaya itu\ntidak memberi momen gaya terhadap poros.</li>\n</ol>\n"}, "12": {"t": "Benda Tegar: Gerak Bidang dan Menggelinding", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>β</mi><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math>\nbola pejal paling kecil.<br />\n<strong>2. D.</strong> Syarat tanpa selip.<br />\n<strong>3. E.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext mathvariant=\"normal\">pm</mtext></msub><mo>+</mo><mi>R</mi><mi>ω</mi><mo>=</mo><mn>2</mn><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">v_{\\text{pm}} + R\\omega = 2v</annotation></semantics></math>.<br />\n<strong>4. D.</strong> Percepatan hanya bergantung pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>β</mi><annotation encoding=\"application/x-tex\">\\beta</annotation></semantics></math>.<br />\n<strong>5. E.</strong> Titik kerja gaya diam sesaat.<br />\n<strong>6. A.</strong> Gesekan memberi momen gaya yang mempercepat\nrotasi.<br />\n<strong>7. D.</strong> Itulah mekanisme peralihan ke\nmenggelinding.<br />\n<strong>8. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>K</mi><mtext mathvariant=\"normal\">rot</mtext></msub><mi>/</mi><mi>K</mi><mo>=</mo><mi>β</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>+</mo><mi>β</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>1</mn><mi>/</mi><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">K_{\\text{rot}}/K = \\beta/(1 + \\beta) = 1/3</annotation></semantics></math>.<br />\n<strong>9. D.</strong> Yo-yo dipercepat ke bawah, sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>&lt;</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">T &lt; mg</annotation></semantics></math>.<br />\n<strong>10. B.</strong> Momen gaya gravitasi memutar arah\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝐋</mi><annotation encoding=\"application/x-tex\">\\mathbf{L}</annotation></semantics></math>.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>10</mn><mi>g</mi><mi>h</mi><mi>/</mi><mn>7</mn></mrow></msqrt><mo>≈</mo><mn>5</mn><mo>,</mo><mn>29</mn></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{10gh/7} \\approx 5{,}29</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>2</mn><mn>3</mn></mfrac><mi>g</mi><mo>sin</mo><mn>30</mn><mi>°</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>27</mn></mrow><annotation encoding=\"application/x-tex\">a = \\tfrac{2}{3}g\\sin 30° \\approx 3{,}27</annotation></semantics></math>\nm/s².</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>=</mo><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>37</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">K = Mv^2 = 37{,}5</annotation></semantics></math>\nJ (setengah translasi, setengah rotasi).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub><mo>≥</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>3</mn></mfrac><mo>tan</mo><mn>30</mn><mi>°</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>19</mn></mrow><annotation encoding=\"application/x-tex\">\\mu_s \\ge \\tfrac{1}{3}\\tan 30° \\approx 0{,}19</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≈</mo><mn>66</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">\\omega \\approx 66{,}7</annotation></semantics></math>\nrad/s; titik atas\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>40</mn><annotation encoding=\"application/x-tex\">40</annotation></semantics></math>\nm/s\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>144</mn></mrow><annotation encoding=\"application/x-tex\">= 144</annotation></semantics></math>\nkm/jam.</li>\n<li>Persamaan (12.5) dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mi>a</mi><mi>/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha = a/R</annotation></semantics></math>;\natau turunkan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mi>g</mi><mi>x</mi><mo>sin</mo><mi>θ</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>+</mo><mi>β</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">Mgx\\sin\\theta = \\tfrac{1}{2}Mv^2(1 + \\beta)</annotation></semantics></math>\nterhadap waktu.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mi>/</mi><mn>19</mn><mo>≈</mo><mn>0</mn><mo>,</mo><mn>52</mn></mrow><annotation encoding=\"application/x-tex\">a = g/19 \\approx 0{,}52</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mi>m</mi><mi>g</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><mn>1</mn><mi>/</mi><mn>19</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mfrac displaystyle=\"false\"><mn>18</mn><mn>19</mn></mfrac><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">T = mg(1 - 1/19) = \\tfrac{18}{19}mg</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><mo>−</mo><msub><mi>μ</mi><mi>k</mi></msub><mi>g</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">v = v_0 - \\mu_kgt</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mi>ω</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>5</mn><mn>2</mn></mfrac><msub><mi>μ</mi><mi>k</mi></msub><mi>g</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">R\\omega = \\tfrac{5}{2}\\mu_kgt</annotation></semantics></math>;\nsamakan. Jarak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>8</mn><mo>,</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 8{,}0</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mi>v</mi><mo>=</mo><mi>J</mi></mrow><annotation encoding=\"application/x-tex\">Mv = J</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>2</mn><mn>5</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mi>ω</mi><mo>=</mo><mi>J</mi><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">\\tfrac{2}{5}MR^2\\omega = Jh</annotation></semantics></math>;\nsyarat\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mi>R</mi><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">v = R\\omega</annotation></semantics></math>\nmemberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>2</mn><mn>5</mn></mfrac><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">h = \\tfrac{2}{5}R</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>L</mi><mi>/</mi><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">2L/3</annotation></semantics></math>\ndari ujung yang dipegang.</li>\n<li>Persamaan gerak:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>−</mo><mi>f</mi><mo>=</mo><mi>M</mi><mi>a</mi></mrow><annotation encoding=\"application/x-tex\">F - f = Ma</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mi>R</mi><mo>−</mo><mi>F</mi><mi>r</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>a</mi><mi>/</mi><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">fR - Fr = \\tfrac{1}{2}MR^2(a/R)</annotation></semantics></math>.</li>\n<li>Di puncak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>2</mn></msup><mo>≥</mo><mi>g</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">v^2 \\ge gR</annotation></semantics></math>;\nenergi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mi>g</mi><mi>h</mi><mo>=</mo><mi>M</mi><mi>g</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>+</mo><mfrac displaystyle=\"false\"><mn>7</mn><mn>10</mn></mfrac><mi>M</mi><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">Mgh = Mg(2R) + \\tfrac{7}{10}Mv^2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Ω</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>62</mn></mrow><annotation encoding=\"application/x-tex\">\\Omega \\approx 0{,}62</annotation></semantics></math>\nrad/s; periode presesi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 10</annotation></semantics></math>\ns.</li>\n<li>Pusat bola bergerak pada lingkaran berjari-jari\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>−</mo><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">R - r</annotation></semantics></math>;\nenergi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>7</mn><mn>10</mn></mfrac><mi>m</mi><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mo>−</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><msup><mover><mi>ϕ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mi>m</mi><mi>g</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mo>−</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>−</mo><mo>cos</mo><mi>ϕ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\tfrac{7}{10}m(R - r)^2\\dot{\\phi}^2 + mg(R - r)(1 - \\cos\\phi)</annotation></semantics></math>.</li>\n<li>Tidak ada gaya mendatar, sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>x</mi><mtext mathvariant=\"normal\">pm</mtext></msub><annotation encoding=\"application/x-tex\">x_{\\text{pm}}</annotation></semantics></math>\ntetap. Saat mendatar,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext mathvariant=\"normal\">pm</mtext></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">v_{\\text{pm}} = (L/2)\\dot{\\theta}</annotation></semantics></math>\ndan energi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mi>g</mi><mi>L</mi><mi>/</mi><mn>2</mn><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>6</mn></mfrac><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">MgL/2 = \\tfrac{1}{6}ML^2\\dot{\\theta}^2</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext mathvariant=\"normal\">pm</mtext></msub><mo>≈</mo><mn>2</mn><mo>,</mo><mn>71</mn></mrow><annotation encoding=\"application/x-tex\">v_{\\text{pm}} \\approx 2{,}71</annotation></semantics></math>\nm/s.</li>\n</ol>\n"}, "13": {"t": "Mekanika Lagrange I", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mi>T</mi><mo>−</mo><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">L = T - V</annotation></semantics></math>.<br />\n<strong>2. B.</strong> Satu sudut sudah cukup.<br />\n<strong>3. D.</strong> Kendala sudah terpenuhi oleh pemilihan\nkoordinat.<br />\n<strong>4. E.</strong> Koordinat umum bebas dipilih.<br />\n<strong>5. A.</strong> Persamaan Lagrange:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>∂</mi><mi>L</mi><mi>/</mi><mi>∂</mi><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>∂</mi><mi>L</mi><mi>/</mi><mi>∂</mi><mi>q</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\frac{d}{dt}(\\partial L/\\partial\\dot{q}) = \\partial L/\\partial q = 0</annotation></semantics></math>.<br />\n<strong>6. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><mi>S</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\delta S = 0</annotation></semantics></math>.<br />\n<strong>7. A.</strong> Akar\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>θ</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\theta_0</annotation></semantics></math>\nhanya ada jika\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>ω</mi><mn>2</mn></msup><mo>&gt;</mo><mi>g</mi><mi>/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\omega^2 &gt; g/R</annotation></semantics></math>.<br />\n<strong>8. E.</strong> Momentum sudut kekal.<br />\n<strong>9. A.</strong> Keduanya setara; Lagrange lebih efisien untuk\nsistem berkendala.<br />\n<strong>10. E.</strong> Dua sudut.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>−</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}m\\dot{x}^2 - \\tfrac{1}{2}kx^2</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mover><mi>x</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mo>−</mo><mi>k</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">m\\ddot{x} = -kx</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>2</mn></msub><mo>−</mo><msub><mi>m</mi><mn>1</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>g</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}(m_1 + m_2)\\dot{x}^2 + (m_2 - m_1)gx</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>2</mn></msub><mo>−</mo><msub><mi>m</mi><mn>1</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>g</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">a = (m_2 - m_1)g/(m_1 + m_2)</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mover><mi>s</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mi>m</mi><mi>g</mi><mi>s</mi><mo>sin</mo><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}m\\dot{s}^2 + mgs\\sin\\alpha</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>s</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mi>g</mi><mo>sin</mo><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\ddot{s} = g\\sin\\alpha</annotation></semantics></math>.</li>\n<li><ol type=\"a\">\n<li>2; (b) 6; (c) 5; (d) 3.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mover><mi>ρ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><msup><mi>ρ</mi><mn>2</mn></msup><msup><mover><mi>ϕ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><msup><mover><mi>z</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}m(\\dot{\\rho}^2 + \\rho^2\\dot{\\phi}^2 + \\dot{z}^2)</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>ρ</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mi>ρ</mi><msup><mover><mi>ϕ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\ddot{\\rho} = \\rho\\dot{\\phi}^2</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>ρ</mi><mn>2</mn></msup><mover><mi>ϕ</mi><mo accent=\"true\">̇</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\frac{d}{dt}(\\rho^2\\dot{\\phi}) = 0</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>z</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\ddot{z} = 0</annotation></semantics></math>.</li>\n<li>Persamaan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>θ</mi><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mo>sin</mo><mi>θ</mi><mo>cos</mo><mi>θ</mi><mspace width=\"0.167em\"></mspace><msup><mover><mi>ϕ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\frac{d}{dt}(mr^2\\dot{\\theta}) = mr^2\\sin\\theta\\cos\\theta\\,\\dot{\\phi}^2</annotation></semantics></math>;\ndengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mi>π</mi><mi>/</mi><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\theta = \\pi/2</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\dot{\\theta} = 0</annotation></semantics></math>\nruas kanan nol, sehingga konsisten.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>1</mn></msub><mo>+</mo><msub><mi>m</mi><mn>2</mn></msub><mo>+</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><msub><mi>M</mi><mi>k</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>m</mi><mn>2</mn></msub><mo>−</mo><msub><mi>m</mi><mn>1</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>g</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}(m_1 + m_2 + \\tfrac{1}{2}M_k)\\dot{x}^2 + (m_2 - m_1)gx</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\theta = 0</annotation></semantics></math>\nstabil jika\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>ω</mi><mn>2</mn></msup><mo>&lt;</mo><mi>g</mi><mi>/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">\\omega^2 &lt; g/R</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mi>π</mi></mrow><annotation encoding=\"application/x-tex\">\\theta = \\pi</annotation></semantics></math>\nselalu tidak stabil;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>θ</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\theta_0</annotation></semantics></math>\nstabil jika ada.\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>sin</mo><mn>60</mn><mi>°</mi><mo>≈</mo><mn>12</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\omega\\sin 60° \\approx 12{,}1</annotation></semantics></math>\nrad/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mover><mi>r</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><msup><mi>r</mi><mn>2</mn></msup><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>+</mo><mi>m</mi><mi>g</mi><mi>r</mi><mo>cos</mo><mi>θ</mi><mo>−</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo>−</mo><msub><mi>l</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}m(\\dot{r}^2 + r^2\\dot{\\theta}^2) + mgr\\cos\\theta - \\tfrac{1}{2}k(r - l_0)^2</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mi>m</mi><mi>r</mi><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mi>m</mi><mi>g</mi><mo>cos</mo><mi>θ</mi><mo>−</mo><mi>k</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo>−</mo><msub><mi>l</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">m\\ddot{r} = mr\\dot{\\theta}^2 + mg\\cos\\theta - k(r - l_0)</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mi>d</mi><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>−</mo><mi>m</mi><mi>g</mi><mi>r</mi><mo>sin</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\frac{d}{dt}(mr^2\\dot{\\theta}) = -mgr\\sin\\theta</annotation></semantics></math>.</li>\n<li>Untuk sudut kecil: osilator harmonik paksa (Bab 5).</li>\n<li>Percepatan relatif\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>s</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mfrac displaystyle=\"true\"><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><mo>+</mo><mi>m</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>g</mi><mo>sin</mo><mi>α</mi></mrow><mrow><mi>M</mi><mo>+</mo><mi>m</mi><msup><mo>sin</mo><mn>2</mn></msup><mi>α</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\ddot{s} = \\dfrac{(M + m)g\\sin\\alpha}{M + m\\sin^2\\alpha}</annotation></semantics></math>;\nuntuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>→</mo><mi>∞</mi></mrow><annotation encoding=\"application/x-tex\">M \\to \\infty</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>s</mi><mo accent=\"true\">̈</mo></mover><mo>→</mo><mi>g</mi><mo>sin</mo><mi>α</mi></mrow><annotation encoding=\"application/x-tex\">\\ddot{s} \\to g\\sin\\alpha</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>X</mi><mo accent=\"true\">̈</mo></mover><mo>→</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\ddot{X} \\to 0</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><mo>+</mo><mi>I</mi><mi>/</mi><msup><mi>r</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><msup><mover><mi>y</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><mi>m</mi><mi>g</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}(m + I/r^2)\\dot{y}^2 + mgy</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>∂</mi><mi>F</mi><mi>/</mi><mi>∂</mi><mi>y</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\partial F/\\partial y = 0</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mi>′</mi><mi>/</mi><msqrt><mrow><mn>1</mn><mo>+</mo><mi>y</mi><msup><mi>′</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">y&#39;/\\sqrt{1 + y&#39;^2}</annotation></semantics></math>\ntetap, yaitu\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mi>′</mi></mrow><annotation encoding=\"application/x-tex\">y&#39;</annotation></semantics></math>\ntetap.</li>\n<li>Integrand tidak bergantung pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>;\ngunakan identitas Beltrami\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>−</mo><mi>y</mi><mi>′</mi><mspace width=\"0.167em\"></mspace><mi>∂</mi><mi>F</mi><mi>/</mi><mi>∂</mi><mi>y</mi><mi>′</mi><mo>=</mo><mtext mathvariant=\"normal\">konstan</mtext></mrow><annotation encoding=\"application/x-tex\">F - y&#39;\\,\\partial F/\\partial y&#39; = \\text{konstan}</annotation></semantics></math>.</li>\n<li>Linearkan; persamaan matriks\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mn>2</mn><mi>g</mi><mi>/</mi><mi>l</mi></mtd><mtd columnalign=\"center\" style=\"text-align: center\"><mn>0</mn></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mn>0</mn></mtd><mtd columnalign=\"center\" style=\"text-align: center\"><mi>g</mi><mi>/</mi><mi>l</mi></mtd></mtr></mtable><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\begin{pmatrix} 2g/l &amp; 0 \\\\ 0 &amp; g/l\\end{pmatrix}</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mtable><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mn>2</mn></mtd><mtd columnalign=\"center\" style=\"text-align: center\"><mn>1</mn></mtd></mtr><mtr><mtd columnalign=\"center\" style=\"text-align: center\"><mn>1</mn></mtd><mtd columnalign=\"center\" style=\"text-align: center\"><mn>1</mn></mtd></mtr></mtable><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><annotation encoding=\"application/x-tex\">\\begin{pmatrix} 2 &amp; 1 \\\\ 1 &amp; 1\\end{pmatrix}</annotation></semantics></math>;\ndeterminan nol memberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mo>∓</mo><msqrt><mn>2</mn></msqrt><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>g</mi><mi>/</mi><mi>l</mi></mrow><annotation encoding=\"application/x-tex\">\\omega^2 = (2 \\mp \\sqrt{2})\\,g/l</annotation></semantics></math>.</li>\n</ol>\n"}, "14": {"t": "Mekanika Lagrange II", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>θ</mi></msub><mo>=</mo><mi>∂</mi><mi>L</mi><mi>/</mi><mi>∂</mi><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">p_\\theta = \\partial L/\\partial\\dot{\\theta} = mr^2\\dot{\\theta}</annotation></semantics></math>.<br />\n<strong>2. A.</strong> Definisi koordinat siklik.<br />\n<strong>3. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>H</mi><mi>/</mi><mi>d</mi><mi>t</mi><mo>=</mo><mo>−</mo><mi>∂</mi><mi>L</mi><mi>/</mi><mi>∂</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">dH/dt = -\\partial L/\\partial t</annotation></semantics></math>.<br />\n<strong>4. D.</strong> Syarat agar\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>\nkuadrat homogen dalam\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover><annotation encoding=\"application/x-tex\">\\dot{q}</annotation></semantics></math>.<br />\n<strong>5. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mspace width=\"0.167em\"></mspace><mi>∂</mi><mi>f</mi><mi>/</mi><mi>∂</mi><msub><mi>q</mi><mi>k</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\lambda\\,\\partial f/\\partial q_k</annotation></semantics></math>\nadalah gaya kendala umum.<br />\n<strong>6. D.</strong> Rotasi ↔︎ momentum sudut.<br />\n<strong>7. A.</strong> Pegas penggandeng tidak teregang pada mode\nsefase.<br />\n<strong>8. D.</strong> Layangan akibat superposisi dua mode.<br />\n<strong>9. A.</strong> Persamaan Hamilton pertama.<br />\n<strong>10. D.</strong> Kurva tertutup di dalam, kurva terbuka di\nluar.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>+</mo><msup><mover><mi>y</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>m</mi><mi>g</mi><mi>y</mi></mrow><annotation encoding=\"application/x-tex\">L = \\tfrac{1}{2}m(\\dot{x}^2 + \\dot{y}^2) - mgy</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>x</mi><annotation encoding=\"application/x-tex\">x</annotation></semantics></math>\nsiklik,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>x</mi></msub><mo>=</mo><mi>m</mi><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">p_x = m\\dot{x}</annotation></semantics></math>\nkekal.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo>=</mo><msup><mi>p</mi><mn>2</mn></msup><mi>/</mi><mn>2</mn><mi>m</mi><mo>+</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>q</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">H = p^2/2m + \\tfrac{1}{2}kq^2</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mi>p</mi><mi>/</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\dot{q} = p/m</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>p</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mo>−</mo><mi>k</mi><mi>q</mi></mrow><annotation encoding=\"application/x-tex\">\\dot{p} = -kq</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>r</mi></msub><mo>=</mo><mi>m</mi><mover><mi>r</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">p_r = m\\dot{r}</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>p</mi><mi>θ</mi></msub><mo>=</mo><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">p_\\theta = mr^2\\dot{\\theta}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mi>θ</mi></msub><annotation encoding=\"application/x-tex\">p_\\theta</annotation></semantics></math>\nkekal\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>θ</mi><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math>\nsiklik),\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>p</mi><mi>r</mi></msub><annotation encoding=\"application/x-tex\">p_r</annotation></semantics></math>\ntidak.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>1</mn></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_1 = 10</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>2</mn></msub><mo>=</mo><msqrt><mn>150</mn></msqrt><mo>≈</mo><mn>12</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_2 = \\sqrt{150} \\approx 12{,}2</annotation></semantics></math>\nrad/s; periode layangan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>2</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 2{,}8</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>g</mi><mi>R</mi><mi>/</mi><mn>3</mn></mrow></msqrt><mo>≈</mo><mn>2</mn><mo>,</mo><mn>56</mn></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{2gR/3} \\approx 2{,}56</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mi>m</mi><mi>g</mi><mo>cos</mo><mi>θ</mi><mo>+</mo><mi>m</mi><mi>l</mi><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">T = mg\\cos\\theta + ml\\dot{\\theta}^2</annotation></semantics></math>;\ndi titik terendah setelah dilepas dari posisi mendatar,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>3</mn><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">T = 3mg</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>R</mi><mn>2</mn></msup><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>−</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mi>R</mi><mn>2</mn></msup><msup><mi>ω</mi><mn>2</mn></msup><msup><mo>sin</mo><mn>2</mn></msup><mi>θ</mi><mo>−</mo><mi>m</mi><mi>g</mi><mi>R</mi><mo>cos</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">H = \\tfrac{1}{2}mR^2\\dot{\\theta}^2 - \\tfrac{1}{2}mR^2\\omega^2\\sin^2\\theta - mgR\\cos\\theta</annotation></semantics></math>;\nmotor melakukan usaha untuk menjaga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>ω</mi><annotation encoding=\"application/x-tex\">\\omega</annotation></semantics></math>\ntetap.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo>=</mo><msubsup><mi>p</mi><mi>r</mi><mn>2</mn></msubsup><mi>/</mi><mn>2</mn><mi>m</mi><mo>+</mo><msubsup><mi>p</mi><mi>θ</mi><mn>2</mn></msubsup><mi>/</mi><mn>2</mn><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mo>+</ ics><msqrt><mrow><mi>k</mi><mi>/</mi><mi>m</mi></mrow></msqrt><annotation encoding=\"application/x-tex\">\\sqrt{k/m}</annotation></semantics></math>:\natom tengah diam, kedua atom luar bergerak berlawanan; mode tertinggi:\natom luar bergerak searah, atom tengah berlawanan. Perbandingan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msqrt><mrow><mn>1</mn><mo>+</mo><mn>32</mn><mi>/</mi><mn>12</mn></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>91</mn></mrow><annotation encoding=\"application/x-tex\">\\sqrt{1 + 32/12} \\approx 1{,}91</annotation></semantics></math>\n(nilai terukur sekitar 1,7; model ini menyederhanakan gaya\nantaratom).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac><mrow><mi>d</mi><mi>H</mi></mrow><mrow><mi>d</mi><mi>t</mi></mrow></mfrac><mo>=</mo><mo>∑</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mover><mi>p</mi><mo accent=\"true\">̇</mo></mover><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover><mo>+</mo><mi>p</mi><mover><mi>q</mi><mo accent=\"true\">̈</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mo>∑</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mfrac><mrow><mi>∂</mi><mi>L</mi></mrow><mrow><mi>∂</mi><mi>q</mi></mrow></mfrac><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover><mo>+</mo><mfrac><mrow><mi>∂</mi><mi>L</mi></mrow><mrow><mi>∂</mi><mover><mi>q</mi><mo accent=\"true\">̇</mo></mover></mrow></mfrac><mover><mi>q</mi><mo accent=\"true\">̈</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mfrac><mrow><mi>∂</mi><mi>L</mi></mrow><mrow><mi>∂</mi><mi>t</mi></mrow></mfrac></mrow><annotation encoding=\"application/x-tex\">\\frac{dH}{dt} = \\sum(\\dot{p}\\dot{q} + p\\ddot{q}) - \\sum\\left(\\frac{\\partial L}{\\partial q}\\dot{q} + \\frac{\\partial L}{\\partial\\dot{q}}\\ddot{q}\\right) - \\frac{\\partial L}{\\partial t}</annotation></semantics></math>.</li>\n<li>Separatriks:\n<math /* ===================== Kode akses ===================== */
/* Kode tercetak di buku (Cara Menggunakan Buku Ini). Disimpan sebagai hash SHA-256 dari kode tanpa spasi/tanda hubung, huruf besar. */
const ACCESS_HASH = 'b11405f2366b09f9c0d5edd91c4111bf591176840293122b1e7e5fe774fa2bdf';
function sha256(ascii){
  const rr=(v,a)=>(v>>>a)|(v<<(32-a)); const W=Math.pow(2,32); let res='', words=[], bitLen=ascii.length*8;
  const K=[], H=[]; let isC={}, n=2;
  for(let c=0;c<64;n++){ if(!isC[n]){ for(let i=0;i<313;i+=n) isC[i]=n; H[c]=(Math.pow(n,.5)*W)|0; K[c++]=(Math.pow(n,1/3)*W)|0; } }
  const h=H.slice(0,8); ascii+='\x80'; while(ascii.length%64-56) ascii+='\x00';
  for(let i=0;i<ascii.length;i++){ const j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bitLen/W)|0); words[words.length]=bitLen;
  for(let j=0;j<words.length;){ const w=words.slice(j,j+=16), old=h.slice(0);
    for(let i=0;i<64;i++){ const w15=w[i-15], w2=w[i-2], a=h[0], e=h[4];
      const t1=h[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&h[5])^((~e)&h[6]))+K[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));
      h.unshift((t1+t2)|0); h[4]=(h[4]+t1)|0; h.pop(); }
    for(let i=0;i<8;i++) h[i]=(h[i]+old[i])|0; }
  for(let i=0;i<8;i++) for(let j=3;j+1;j--){ const b=(h[i]>>(j*8))&255; res+=((b<16)?0:'')+b.toString(16); }
  return res;
}

  document.getElementById('aksesGo').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter') go(); };
  inp.focus();
}

/* ===================== Router ===================== */
function route(){
  if(stopCurrent){ stopCurrent(); stopCurrent = null; }
  const h = decodeURIComponent(location.hash.slice(1)).toUpperCase().replace(/\s/g,'');
  window.scrollTo(0,0);
  if(!UNLOCKED) return lockScreen();
  if(SIMS[h]){ CLOCK.state='stopped'; CLOCK.code=h; CLOCK.ui=null; return SIMS[h](); }
  let m = h.match(/^KUNCI-?(\d+)$/);
  if(m && KUNCI[+m[1]]) return kunciView(+m[1]);
  if(h==='KUNCI') return kunciList();
  if(h==='INDEKS') return indeksView();
  home(h);
}
window.addEventListener('hashchange', route);

function indeksView(){
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  app.innerHTML = `<div class="crumb"><a href="#">← Beranda</a></div>
  <h1>Indeks Istilah</h1>

  const list = document.getElementById('list'), q = document.getElementById('q');
  function draw(){
    const t = norm(q.value.trim());
    const rows = INDEKS.filter(x => !t || norm(x.e).includes(t) || norm(x.en).includes(t));
    let last = '', out = '';
    for(const x of rows){
      const L = x.e[0].toUpperCase();
      if(L!==last && !t){ out += `<div class="letter">${L}</div>`; last = L; }
      out += `<div class="it"><b>${x.e}</b>${x.en?`<span class="en">(${x.en})</span>`:''}

    }
    list.innerHTML = out || '<p class="muted">Istilah tidak ditemukan. Coba kata lain, atau lihat Glosarium di buku.</p>';
  }
  q.oninput = draw; draw();
}

/* ===================== Utilitas gambar ===================== */
function setupCanvas(cv, aspect){
  const ctx = cv.getContext('2d');
  function resize(){
    const w = cv.parentElement.clientWidth;
    const h = Math.round(Math.min(w*aspect, window.innerHeight*0.68));
    const dpr = window.devicePixelRatio || 1;
    cv.width = w*dpr; cv.height = h*dpr; cv.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    cv._w = w; cv._h = h;
  }
  resize();
  return {ctx, resize};
}
function makeView(cv, unitsAcross){
  // dunia: satuan; layar: piksel. Origin di tengah, y ke atas.
  const v = {};
  v.update = () => { v.s = cv._w/unitsAcross; v.ox = cv._w/2; v.oy = cv._h/2; };
  v.X = x => v.ox + x*v.s; v.Y = y => v.oy - y*v.s;
  v.inv = (px,py) => [(px-v.ox)/v.s, (v.oy-py)/v.s];
  v.update();
  return v;
}
function grid(ctx, v, cv, step=1){
  ctx.fillStyle = css('--panel'); ctx.fillRect(0,0,cv._w,cv._h);
  ctx.strokeStyle = css('--grid'); ctx.lineWidth = 1;
  const [x0,y1] = v.inv(0,0), [x1,y0] = v.inv(cv._w,cv._h);
  ctx.beginPath();
  for(let x=Math.ceil(x0/step)*step; x<=x1; x+=step){ ctx.moveTo(v.X(x),0); ctx.lineTo(v.X(x),cv._h); }
  for(let y=Math.ceil(y0/step)*step; y<=y1; y+=step){ ctx.moveTo(0,v.Y(y)); ctx.lineTo(cv._w,v.Y(y)); }
  ctx.stroke();
  ctx.strokeStyle = css('--axis'); ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(0,v.Y(0)); ctx.lineTo(cv._w,v.Y(0)); ctx.moveTo(v.X(0),0); ctx.lineTo(v.X(0),cv._h); ctx.stroke();
  ctx.fillStyle = css('--muted'); ctx.font = '12px system-ui';
  ctx.fillText('x', cv._w-14, v.Y(0)-6); ctx.fillText('y', v.X(0)+6, 14);
}
function arrow(ctx, x0,y0,x1,y1, color, w=2.6, label, dash){
  const dx=x1-x0, dy=y1-y0, L=Math.hypot(dx,dy); if(L<1) return;
  const ux=dx/L, uy=dy/L, hl=Math.min(13, L*0.4), hw=hl*0.45;
  ctx.save(); ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap='round';
  if(dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1-ux*hl*0.8,y1-uy*hl*0.8); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x1-ux*hl-uy*hw, y1-uy*hl+ux*hw); ctx.lineTo(x1-ux*hl+uy*hw, y1-uy*hl-ux*hw); ctx.closePath(); ctx.fill();
  if(label){ ctx.font='bold 14px system-ui'; ctx.fillText(label, x1+8*(-uy)+4, y1+8*ux-4); }
  ctx.restore();
}
function slider(parent, id, label, min, max, step, val, fmt=v=>v){
  const d = document.createElement('div'); d.className='row';
  d.innerHTML = `<label for="${id}">${label}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"><output id="${id}o"></output>`;
  parent.appendChild(d);
  const inp = d.querySelector('input'), out = d.querySelector('output');
  const upd = () => out.textContent = fmt(+inp.value); upd();
  inp.addEventListener('input', upd);
  return inp;
}
function seg(parent, options, active, onChange){
  const d = document.createElement('div'); d.className='seg';
  options.forEach(([k,lab])=>{
    const b=document.createElement('button'); b.textContent=lab; b.dataset.k=k; if(k===active) b.classList.add('on');
    b.onclick=()=>{ d.querySelectorAll('button').forEach(x=>x.classList.toggle('on', x===b)); onChange(k); };
    d.appendChild(b);
  });
  parent.appendChild(d); return d;
}
function check(parent, label, val){
  const d=document.createElement('div'); d.className='row';
  d.innerHTML=`<label><input type="checkbox" ${val?'checked':''}> ${label}</label>`;
  parent.appendChild(d); return d.querySelector('input');
}
function card(side, title){ const c=document.createElement('div'); c.className='card'; c.innerHTML=`<h4>${title}</h4>`; side.appendChild(c); return c; }
const f2 = x => (Math.abs(x)<0.005?0:x).toFixed(2);
const deg = r => r*180/Math.PI;

/* draggable points */
function dragger(cv, v, pts, onMove){
  let active = null;
  const pos = e => { const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e => {
    const [px,py]=pos(e); let best=null, bd=24;
    pts().forEach(p=>{ const d=Math.hypot(v.X(p.x)-px, v.Y(p.y)-py); if(d<bd){bd=d;best=p;} });
    if(best){ active=best; cv.setPointerCapture(e.pointerId); }
  });
  cv.addEventListener('pointermove', e => {
    const [px,py]=pos(e);
    if(!active){ cv.style.cursor = pts().some(p=>Math.hypot(v.X(p.x)-px,v.Y(p.y)-py)<24)?'grab':'default'; return; }
    let [x,y]=v.inv(px,py); x=Math.round(x*2)/2; y=Math.round(y*2)/2;   // snap 0,5 satuan
    active.x=x; active.y=y; onMove();
  });
  const up = ()=>{ active=null; };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
}

/* ===================== SIM-1.1 Penjumlahan & komponen vektor ===================== */
SIMS['SIM-1.1'] = function(){
  const {cv, side, hint} = shell('SIM-1.1','Penjumlahan & Komponen Vektor',1,[
    'Buat <b>A</b> = (3, 0) dan <b>B</b> = (0, 4). Berapa |<b>A</b> + <b>B</b>|? Apakah sama dengan |<b>A</b>| + |<b>B</b>|?',
    'Cari dua vektor yang panjangnya masing-masing 3 dan 4 tetapi jumlahnya hanya 1. Kapan |<b>A</b>+<b>B</b>| paling besar dan paling kecil?',
    'Pilih mode <b>A − B</b>. Tunjukkan bahwa <b>A − B</b> adalah vektor dari ujung <b>B</b> ke ujung <b>A</b>.',
    'Tampilkan komponen. Periksa bahwa komponen <b>R</b> selalu = jumlah komponen <b>A</b> dan <b>B</b>, walaupun panjangnya tidak dijumlah begitu saja.'
  ]);
  hint.textContent = 'Seret ujung panah A atau B';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 16);
  const A = {x:3, y:1}, B = {x:1, y:3};
  let mode = 'sum';
  const c1 = card(side,'Operasi');
  seg(c1, [['sum','A + B'],['diff','A − B'],['tail','Ekor-ke-ujung']], mode, k=>{mode=k; draw();});
  const showComp = check(c1,'Tampilkan komponen x, y', false);
  const showPar = check(c1,'Tampilkan jajaran genjang', true);
  showComp.onchange = showPar.onchange = draw;
  const c2 = card(side,'Nilai'); const ro = document.createElement('table'); ro.className='ro'; c2.appendChild(ro);
  const c3 = card(side,'Atur cepat');
  const pres = [['A=(3,0), B=(0,4)',[3,0,0,4]],['Searah',[3,0,4,0]],['Berlawanan',[3,0,-4,0]],['Acak',null]];
  const pd = document.createElement('div'); pd.className='seg'; c3.appendChild(pd);
  pres.forEach(([lab,val])=>{ const b=document.createElement('button'); b.textContent=lab; pd.appendChild(b);
    b.onclick=()=>{ const r=val||[0,0,0,0].map(()=>Math.round((Math.random()*10-5)*2)/2); [A.x,A.y,B.x,B.y]=r; draw(); }; });

  dragger(cv, v, ()=>[A,B], draw);
  function draw(){
    v.update(); grid(ctx, v, cv);
    const cA=css('--vA'), cB=css('--vB'), cR=css('--vR'), cD=css('--vD');
    const R = mode==='diff' ? {x:A.x-B.x, y:A.y-B.y} : {x:A.x+B.x, y:A.y+B.y};
    const O = [v.X(0), v.Y(0)];
    if(mode==='sum'){
      if(showPar.checked){
        ctx.save(); ctx.fillStyle=cR+'22'; ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(A.x),v.Y(A.y)); ctx.lineTo(v.X(R.x),v.Y(R.y)); ctx.lineTo(v.X(B.x),v.Y(B.y)); ctx.closePath(); ctx.fill(); ctx.restore();
        arrow(ctx, v.X(A.x),v.Y(A.y), v.X(R.x),v.Y(R.y), cB, 1.6, null, [5,5]);
        arrow(ctx, v.X(B.x),v.Y(B.y), v.X(R.x),v.Y(R.y), cA, 1.6, null, [5,5]);
      }
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cR, 3.2, 'R = A + B');
    } else if(mode==='diff'){
      arrow(ctx, v.X(B.x),v.Y(B.y), v.X(A.x),v.Y(A.y), cD, 1.8, null, [6,5]);
      arrow(ctx, ...O, v.X(-B.x), v.Y(-B.y), cB, 1.6, '−B', [4,4]);
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cD, 3.2, 'A − B');
    } else {
      arrow(ctx, v.X(A.x),v.Y(A.y), v.X(R.x),v.Y(R.y), cB, 2.6, 'B');
      arrow(ctx, ...O, v.X(R.x), v.Y(R.y), cR, 3.2, 'R');
    }
    if(showComp.checked){
      [[A,cA],[B,cB],[R, mode==='diff'?cD:cR]].forEach(([p,c])=>{
        ctx.save(); ctx.strokeStyle=c; ctx.globalAlpha=.75; ctx.setLineDash([3,4]); ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(v.X(p.x),v.Y(0)); ctx.lineTo(v.X(p.x),v.Y(p.y)); ctx.moveTo(v.X(0),v.Y(p.y)); ctx.lineTo(v.X(p.x),v.Y(p.y)); ctx.stroke(); ctx.restore();
      });
    }
    arrow(ctx, ...O, v.X(A.x), v.Y(A.y), cA, 2.8, 'A');
    if(mode!=='tail') arrow(ctx, ...O, v.X(B.x), v.Y(B.y), cB, 2.8, 'B');
    [A, mode==='tail'?null:B].forEach(p=>{ if(!p) return; ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.arc(v.X(p.x),v.Y(p.y),6,0,7); ctx.fill(); ctx.stroke(); });
    if(mode==='tail'){ ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.arc(v.X(B.x),v.Y(B.y),5,0,7); ctx.fill(); ctx.stroke(); }
    const mag = p => Math.hypot(p.x,p.y), ang = p => (deg(Math.atan2(p.y,p.x))+360)%360;
    const lab = mode==='diff'?'A − B':'R';
    const sw = c => `<span class="sw" style="background:${c}"></span>`;
    ro.innerHTML = `
      <tr><td>${sw(cA)}A</td><td>(${f2(A.x)}, ${f2(A.y)})</td></tr>
      <tr><td>|A|, θ<sub>A</sub></td><td>${f2(mag(A))}, ${ang(A).toFixed(1)}°</td></tr>
      <tr><td>${sw(cB)}B</td><td>(${f2(B.x)}, ${f2(B.y)})</td></tr>
      <tr><td>|B|, θ<sub>B</sub></td><td>${f2(mag(B))}, ${ang(B).toFixed(1)}°</td></tr>
      <tr><td>${sw(mode==='diff'?cD:cR)}${lab}</td><td>(${f2(R.x)}, ${f2(R.y)})</td></tr>
      <tr><td>|${lab}|</td><td><b>${f2(mag(R))}</b></td></tr>
      <tr><td>|A| ${mode==='diff'?'−':'+'} |B|</td><td>${f2(mode==='diff'?mag(A)-mag(B):mag(A)+mag(B))}</td></tr>`;
  }
  const onR = ()=>{ resize(); draw(); }; window.addEventListener('resize', onR);
  stopCurrent = ()=> window.removeEventListener('resize', onR);
  draw();
};

/* ===================== SIM-1.2 Perkalian titik & silang ===================== */
SIMS['SIM-1.2'] = function(){
  const {cv, side, hint} = shell('SIM-1.2','Perkalian Titik & Silang',1,[
    'Putar <b>B</b> sampai tegak lurus <b>A</b>. Berapa <b>A</b>·<b>B</b>? Berapa luas jajaran genjang?',
    'Buat <b>A</b> dan <b>B</b> searah. Mengapa |<b>A</b>×<b>B</b>| = 0 walaupun kedua vektor tidak nol?',
    'Tukar urutan: bandingkan arah <b>A</b>×<b>B</b> dan <b>B</b>×<b>A</b> (keluar ⊙ atau masuk ⊗ bidang layar).',
    'Buat sudut antara 90° dan 180°. Apa tanda <b>A</b>·<b>B</b>? Lihat proyeksi <b>B</b> pada <b>A</b> jatuh di mana.'
  ]);
  hint.textContent = 'Seret ujung panah A atau B';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 14);
  const A = {x:4, y:0}, B = {x:2, y:3};
  let show = 'dot';
  const c1 = card(side,'Tampilkan');
  seg(c1, [['dot','A · B (proyeksi)'],['cross','A × B (luas)'],['both','Keduanya']], show, k=>{show=k; draw();});
  const c2 = card(side,'Nilai'); const ro=document.createElement('table'); ro.className='ro'; c2.appendChild(ro);
  const c3 = card(side,'Grafik terhadap sudut θ');
  const g = document.createElement('canvas'); g.style.width='100%'; c3.appendChild(g);
  dragger(cv, v, ()=>[A,B], draw);

  function plot(theta, a, b){
    const W = c3.clientWidth-28, H = 150, dpr=window.devicePixelRatio||1;
    g.width=W*dpr; g.height=H*dpr; g.style.height=H+'px'; const c=g.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
    c.fillStyle=css('--panel'); c.fillRect(0,0,W,H);
    const m=a*b||1, X=t=>8+t/Math.PI*(W-16), Y=y=>H/2 - y/m*(H/2-12);
    c.strokeStyle=css('--axis'); c.beginPath(); c.moveTo(8,H/2); c.lineTo(W-8,H/2); c.stroke();
    [[Math.cos,css('--vR'),'AB cos θ'],[Math.sin,css('--vD'),'AB sin θ']].forEach(([fn,col,lb],i)=>{
      c.strokeStyle=col; c.lineWidth=2; c.beginPath();
      for(let k=0;k<=100;k++){ const t=k/100*Math.PI; k?c.lineTo(X(t),Y(m*fn(t))):c.moveTo(X(t),Y(m*fn(t))); }
      c.stroke(); c.fillStyle=col; c.font='11px system-ui'; c.fillText(lb, W-70, 14+i*14);
      c.beginPath(); c.arc(X(theta),Y(m*fn(theta)),4,0,7); c.fill();
    });
    c.fillStyle=css('--muted'); c.fillText('0°',6,H-4); c.fillText('90°',W/2-10,H-4); c.fillText('180°',W-30,H-4);
  }
  function draw(){
    v.update(); grid(ctx, v, cv);
    const cA=css('--vA'), cB=css('--vB'), cR=css('--vR'), cD=css('--vD');
    const a=Math.hypot(A.x,A.y), b=Math.hypot(B.x,B.y);
    const dot=A.x*B.x+A.y*B.y, crz=A.x*B.y-A.y*B.x;
    const th = Math.acos(Math.max(-1,Math.min(1, a&&b? dot/(a*b):1)));
    const O=[v.X(0),v.Y(0)];
    if(show!=='dot'){
      ctx.save(); ctx.fillStyle=cD+'30'; ctx.strokeStyle=cD; ctx.setLineDash([4,4]);
      ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(A.x),v.Y(A.y)); ctx.lineTo(v.X(A.x+B.x),v.Y(A.y+B.y)); ctx.lineTo(v.X(B.x),v.Y(B.y)); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      // simbol arah A×B
      const cx=v.X((A.x+B.x)/2), cy=v.Y((A.y+B.y)/2);
      if(Math.abs(crz)>0.01){
        ctx.save(); ctx.strokeStyle=cD; ctx.fillStyle=cD; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,11,0,7); ctx.stroke();
        if(crz>0){ ctx.beginPath(); ctx.arc(cx,cy,3.5,0,7); ctx.fill(); }
        else { ctx.beginPath(); ctx.moveTo(cx-7,cy-7); ctx.lineTo(cx+7,cy+7); ctx.moveTo(cx+7,cy-7); ctx.lineTo(cx-7,cy+7); ctx.stroke(); }
        ctx.restore();
      }
    }
    if(show!=='cross' && a>0){
      const k=dot/(a*a), P={x:k*A.x, y:k*A.y};
      ctx.save(); ctx.strokeStyle=css('--muted'); ctx.setLineDash([3,4]); ctx.lineWidth=1.3;
      ctx.beginPath(); ctx.moveTo(v.X(B.x),v.Y(B.y)); ctx.lineTo(v.X(P.x),v.Y(P.y)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(v.X(-A.x*3),v.Y(-A.y*3)); ctx.lineTo(v.X(A.x*3),v.Y(A.y*3)); ctx.globalAlpha=.35; ctx.stroke(); ctx.restore();
      ctx.save(); ctx.strokeStyle=cR; ctx.lineWidth=7; ctx.globalAlpha=.55; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(...O); ctx.lineTo(v.X(P.x),v.Y(P.y)); ctx.stroke(); ctx.restore();
    }
    // busur sudut
    const aA=Math.atan2(A.y,A.x), aB=Math.atan2(B.y,B.x);
    ctx.save(); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.2; ctx.beginPath();
    let d=aB-aA; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
    ctx.arc(O[0],O[1],26,-aA,-(aA+d), d>0); ctx.stroke(); ctx.restore();
    arrow(ctx,...O,v.X(A.x),v.Y(A.y),cA,2.8,'A'); arrow(ctx,...O,v.X(B.x),v.Y(B.y),cB,2.8,'B');
    [A,B].forEach(p=>{ ctx.beginPath(); ctx.fillStyle=css('--panel'); ctx.strokeStyle=css('--ink'); ctx.lineWidth=1.5; ctx.arc(v.X(p.x),v.Y(p.y),6,0,7); ctx.fill(); ctx.stroke(); });
    const sw=c=>`<span class="sw" style="background:${c}"></span>`;
    ro.innerHTML=`
      <tr><td>|A|, |B|</td><td>${f2(a)}, ${f2(b)}</td></tr>
      <tr><td>sudut θ</td><td>${deg(th).toFixed(1)}°</td></tr>
      <tr><td>${sw(cR)}A·B = A<sub>x</sub>B<sub>x</sub>+A<sub>y</sub>B<sub>y</sub></td><td><b>${f2(dot)}</b></td></tr>
      <tr><td>|A||B| cos θ</td><td>${f2(a*b*Math.cos(th))}</td></tr>
      <tr><td>${sw(cD)}(A×B)<sub>z</sub> = A<sub>x</sub>B<sub>y</sub>−A<sub>y</sub>B<sub>x</sub></td><td><b>${f2(crz)}</b></td></tr>
      <tr><td>|A||B| sin θ = luas</td><td>${f2(a*b*Math.sin(th))}</td></tr>
      <tr><td>arah A×B</td><td>${Math.abs(crz)<0.01?'— (nol)':crz>0?'⊙ keluar layar (+z)':'⊗ masuk layar (−z)'}</td></tr>`;
    plot(th, a, b);
  }
  const onR=()=>{resize();draw();}; window.addEventListener('resize',onR);
  stopCurrent=()=>window.removeEventListener('resize',onR);
  draw();
};

/* ===================== SIM-1.3 Kinematika koordinat polar ===================== */
SIMS['SIM-1.3'] = function(){
  const {cv, side, hint} = shell('SIM-1.3','Kinematika Koordinat Polar',1,[
    'Pilih <b>Melingkar beraturan</b>. Laju tetap, tetapi apakah percepatannya nol? Ke mana arahnya?',
    'Pilih <b>Garis lurus</b>. θ terus berubah, tetapi lihat a<sub>r</sub> dan a<sub>θ</sub>: suku-sukunya saling meniadakan sehingga percepatan nol.',
    'Pilih <b>Spiral</b>. Perhatikan suku 2ṙθ̇ (percepatan Coriolis): ia muncul walaupun ω tetap.',
    'Amati ê<sub>r</sub> dan ê<sub>θ</sub>: panjangnya selalu 1, tetapi arahnya ikut berubah bersama partikel.'
  ]);
  hint.textContent = 'Lintasan partikel; panah biru = êᵣ, ungu = êθ';
  const {ctx, resize} = setupCanvas(cv, 0.72);
  const v = makeView(cv, 14);
  let preset='circ', t=0, trail=[], last=performance.now(), raf;
  const c1=card(side,'Jenis gerak');
  seg(c1,[['circ','Melingkar beraturan'],['acc','Melingkar dipercepat'],['spiral','Spiral'],['line','Garis lurus']],preset,k=>{preset=k;t=0;trail=[];});
  const c2=card(side,'Parameter');
  const sR=slider(c2,'pR','R atau r₀ (m)',1,5,0.5,3,x=>x.toFixed(1));
  const sW=slider(c2,'pW','ω, α, atau v',0.2,2,0.1,0.8,x=>x.toFixed(1));
  const sU=slider(c2,'pU','ṙ spiral (m/s)',0.1,1,0.05,0.35,x=>x.toFixed(2));
  transport();
  const c3=card(side,'Tampilkan');
  const shU=check(c3,'Vektor satuan ê<sub>r</sub>, ê<sub>θ</sub>',true);
  const shV=check(c3,'Kecepatan v',true);
  const shA=check(c3,'Percepatan a',true);
  const shC=check(c3,'Komponen a<sub>r</sub>, a<sub>θ</sub>',false);
  const c4=card(side,'Nilai saat t'); const ro=document.createElement('table'); ro.className='ro'; c4.appendChild(ro);
  [sR,sW,sU].forEach(s=>s.addEventListener('input',()=>{t=0;trail=[];}));

  function state(t){
    const R=+sR.value, w=+sW.value, u=+sU.value;
    if(preset==='circ') return {r:R, rd:0, rdd:0, th:w*t, thd:w, thdd:0};
    if(preset==='acc'){ const a=w*0.25; return {r:R, rd:0, rdd:0, th:0.5*a*t*t, thd:a*t, thdd:a}; }
    if(preset==='spiral') return {r:0.6+u*t, rd:u, rdd:0, th:w*t, thd:w, thdd:0};
    // garis lurus: x = -6 + v t, y = R
    const vx=w*1.5, x=-6+vx*t, y=R, r=Math.hypot(x,y), rd=x*vx/r, thd=-y*vx/(r*r);
    return {r, rd, rdd:(vx*vx-rd*rd)/r, th:Math.atan2(y,x), thd, thdd:2*y*vx*rd/(r*r*r)};
  }
  function limit(){ if(preset==='spiral') return (6.2-0.6)/(+sU.value); if(preset==='line') return 12/(+sW.value*1.5); if(preset==='acc') return Math.sqrt(2*6*Math.PI/(+sW.value*0.25)); return 1e9; }

  function frame(now){
    const dt=Math.max(0,Math.min(0.05,(now-last)/1000)); last=now;
    const playing = CLOCK.state==='running';
    if(playing){ t+=dt*CLOCK.speed; if(t>limit()){t=0;trail=[];} }
    draw(); raf=requestAnimationFrame(frame);
  }
  function draw(){
    v.update(); grid(ctx,v,cv);
    const s=state(t), c=Math.cos(s.th), sn=Math.sin(s.th);
    const x=s.r*c, y=s.r*sn, P=[v.X(x),v.Y(y)];
    if(CLOCK.state==='running'){ trail.push([x,y]); if(trail.length>900) trail.shift(); }
    ctx.save(); ctx.strokeStyle=css('--muted'); ctx.globalAlpha=.6; ctx.lineWidth=1.6; ctx.beginPath();

const CLOCK = { state:'stopped', speed:1, dirty:true, code:null };
function transport(){
  if(document.getElementById('tp')) return;
  const stage = document.querySelector('.stage'); if(!stage) return;
  const d = document.createElement('div'); d.className='transport'; d.id='tp';
  d.innerHTML = `<button class="btn" id="tpPlay">▶ Mulai</button><button class="btn ghost" id="tpPause">⏸ Jeda</button>
    <button class="btn stop" id="tpStop">■ Berhenti</button><span class="st" id="tpSt"></span>
    <span class="spd">Kecepatan ${[0.25,0.5,1,2].map(x=>`<button data-s="${x}" class="${x===CLOCK.speed?'on':''}">${x}×</button>`).join('')}</span>`;
  stage.insertAdjacentElement('afterend', d);
  const play=d.querySelector('#tpPlay'), pause=d.querySelector('#tpPause'), stop=d.querySelector('#tpStop'), st=d.querySelector('#tpSt');
  const ui = () => {
    play.textContent = CLOCK.state==='paused' ? '▶ Lanjutkan' : '▶ Mulai';
    play.disabled = CLOCK.state==='running'; pause.disabled = CLOCK.state!=='running'; stop.disabled = CLOCK.state==='stopped';
    st.textContent = {running:'berjalan…', paused:'dijeda', stopped:'siap'}[CLOCK.state];
  };
  play.onclick = () => { CLOCK.state='running'; ui(); };
  pause.onclick = () => { CLOCK.state='paused'; CLOCK.dirty=true; ui(); };
  stop.onclick = () => restartSim();
  d.querySelectorAll('.spd button').forEach(b => b.onclick = () => {
    CLOCK.speed = +b.dataset.s; d.querySelectorAll('.spd button').forEach(x=>x.classList.toggle('on', x===b));
  });
  CLOCK.ui = ui; ui();
}
/* Berhenti: kembali ke keadaan awal dengan pengaturan (slider, pilihan, centang) tetap */
function restartSim(){
  const side = document.getElementById('side'); const keep = { inputs:[], segs:[] };
  if(side){
    side.querySelectorAll('input').forEach(i => keep.inputs.push(i.type==='checkbox' ? i.checked : i.value));
    side.querySelectorAll('.seg').forEach(g => { const bs=[...g.querySelectorAll('button')]; keep.segs.push(bs.findIndex(b=>b.classList.contains('on'))); });
  }
  const code = CLOCK.code; if(stopCurrent){ stopCurrent(); stopCurrent=null; }
  CLOCK.state='stopped'; SIMS[code]();
  const side2 = document.getElementById('side'); if(!side2) return;
  side2.querySelectorAll('.seg').forEach((g,k) => { const bs=g.querySelectorAll('button'); const j=keep.segs[k];
    if(j!==undefined && j>=0 && bs[j] && !bs[j].classList.contains('on')) bs[j].click(); });
  side2.querySelectorAll('input').forEach((inp,k) => { const v=keep.inputs[k]; if(v===undefined) return;
    if(inp.type==='checkbox'){ if(inp.checked!==v){ inp.checked=v; inp.dispatchEvent(new Event('change')); inp.dispatchEvent(new Event('input')); } }
    else if(inp.value!==v){ inp.value=v; inp.dispatchEvent(new Event('input')); inp.dispatchEvent(new Event('change')); } });

}
/* Animasi: waktu simulasi hanya maju saat "Mulai". Saat dijeda/berhenti, layar digambar ulang hanya bila ada interaksi. */
function anim(step){
  transport();
  let raf, last = performance.now(), alive = true;
  const mark = () => { CLOCK.dirty = true; };
  const app_ = document.getElementById('app');
  ['input','click','pointermove','pointerdown','change'].forEach(e => app_.addEventListener(e, mark, true));
  window.addEventListener('resize', mark);
  CLOCK.dirty = true;
  function f(now){
    if(!alive) return;
    const dt = Math.max(0, Math.min(0.05,(now-last)/1000)); last = now;
    if(CLOCK.state==='running'){
      if(CLOCK.speed>=1){ for(let i=0;i<CLOCK.speed;i++) step(dt); } else step(dt*CLOCK.speed);
    } else if(CLOCK.dirty){ CLOCK.dirty=false; step(0); }
    raf = requestAnimationFrame(f);
  }
  raf = requestAnimationFrame(f);
  return () => { alive = false; cancelAnimationFrame(raf);
    ['input','click','pointermove','pointerdown','change'].forEach(e => app_.removeEventListener(e, mark, true));
    window.removeEventListener('resize', mark); };
}
document.addEventListener('keydown', e => {
  if(e.code!=='Space' || !document.getElementById('tp') || /INPUT|BUTTON|TEXTAREA/.test(document.activeElement.tagName)) return;
  e.preventDefault(); CLOCK.state = CLOCK.state==='running' ? 'paused' : 'running'; CLOCK.dirty=true; if(CLOCK.ui) CLOCK.ui();
