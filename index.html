function makePlot(parent, title, h){
  h = h || 160;
  const c = card(parent, title);
  const cv = document.createElement('canvas'); cv.style.width = '100%'; cv.style.display = 'block'; c.appendChild(cv);
  const draw = function(series, o){
    o = o || {};
    const W = Math.max(200, c.clientWidth - 28), H = o.h || h, dpr = window.devicePixelRatio || 1;
    if(cv.width !== Math.round(W*dpr) || cv.height !== Math.round(H*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H+'px'; }
    const g = cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
    g.fillStyle = css('--panel'); g.fillRect(0,0,W,H);
    let x0 = o.xmin, x1 = o.xmax, y0 = o.ymin, y1 = o.ymax;
    if(x0 === undefined || x1 === undefined || y0 === undefined || y1 === undefined){
      let a=Infinity,b=-Infinity,cc=Infinity,d=-Infinity;
      series.forEach(s => s.pts.forEach(p => { if(isFinite(p[0])&&isFinite(p[1])){ if(p[0]<a)a=p[0]; if(p[0]>b)b=p[0]; if(p[1]<cc)cc=p[1]; if(p[1]>d)d=p[1]; } }));
      if(x0===undefined) x0=a; if(x1===undefined) x1=b; if(y0===undefined) y0=cc; if(y1===undefined) y1=d;
    }
    if(!isFinite(x0)||!isFinite(x1)){x0=0;x1=1;} if(x1-x0<1e-12) x1=x0+1;
    if(!isFinite(y0)||!isFinite(y1)){y0=0;y1=1;} if(y1-y0<1e-12){ y0-=1; y1+=1; }
    if(!o.ymin && o.ymin!==0){ const m=(y1-y0)*0.06; y0-=m; y1+=m; }
    const L = 40, R = 8, T = 8, B = 20;
    const X = x => L + (x-x0)/(x1-x0)*(W-L-R), Y = y => H-B - (y-y0)/(y1-y0)*(H-B-T);
    g.strokeStyle = css('--grid'); g.lineWidth = 1; g.beginPath();
    for(let i=0;i<=4;i++){ const yy=T+i*(H-B-T)/4; g.moveTo(L,yy); g.lineTo(W-R,yy); } g.stroke();
    g.strokeStyle = css('--axis');
    if(y0<0 && y1>0){ g.beginPath(); g.moveTo(L,Y(0)); g.lineTo(W-R,Y(0)); g.stroke(); }
    g.beginPath(); g.moveTo(L,T); g.lineTo(L,H-B); g.lineTo(W-R,H-B); g.stroke();
    g.fillStyle = css('--muted'); g.font = '10px system-ui';
    const fmt = v => Math.abs(v)>=1000||(Math.abs(v)<0.01&&v!==0) ? v.toExponential(1) : (+v.toFixed(2)).toString();
    g.textAlign='right'; g.fillText(fmt(y1), L-3, T+8); g.fillText(fmt(y0), L-3, H-B);
    g.textAlign='left'; g.fillText(fmt(x0), L, H-6); g.textAlign='right'; g.fillText(fmt(x1)+(o.xl?' '+o.xl:''), W-R, H-6); g.textAlign='left';
    let ly = 12;
    series.forEach(s => {
      g.save(); g.strokeStyle = s.color; g.lineWidth = s.w || 2; if(s.dash) g.setLineDash(s.dash);
      g.beginPath(); let started=false;
      s.pts.forEach(p => { if(!isFinite(p[1])) { started=false; return; } const px=X(p[0]), py=Y(Math.max(y0-(y1-y0),Math.min(y1+(y1-y0),p[1]))); if(!started){ g.moveTo(px,py); started=true; } else g.lineTo(px,py); });
      g.stroke(); g.restore();
      if(s.dot){ g.fillStyle = s.color; g.beginPath(); g.arc(X(s.dot[0]), Y(s.dot[1]), 4, 0, 7); g.fill(); }
      if(s.label){ g.fillStyle = s.color; g.font='11px system-ui'; g.textAlign='right'; g.fillText(s.label, W-R-2, T+ly); g.textAlign='left'; ly += 13; }
    });
    if(o.vline!==undefined){ g.strokeStyle=css('--muted'); g.setLineDash([3,3]); g.beginPath(); g.moveTo(X(o.vline),T); g.lineTo(X(o.vline),H-B); g.stroke(); g.setLineDash([]); }
    return {X, Y, g, W, H};
  };

  return draw;
}
function readout(side, title){ const c = card(side, title||'Nilai'); const t = document.createElement('table'); t.className='ro'; c.appendChild(t); return rows => { t.innerHTML = rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join(''); }; }
function buttons(parent, list){ const d=document.createElement('div'); d.className='row'; list.forEach(([lab,fn,ghost])=>{ const b=document.createElement('button'); b.className='btn'+(ghost?' ghost':''); b.textContent=lab; b.onclick=()=>fn(b); d.appendChild(b); }); parent.appendChild(d); return d; }
function rk4(f, y, t, h){
  const k1=f(t,y), y2=y.map((v,i)=>v+h/2*k1[i]), k2=f(t+h/2,y2), y3=y.map((v,i)=>v+h/2*k2[i]), k3=f(t+h/2,y3), y4=y.map((v,i)=>v+h*k3[i]), k4=f(t+h,y4);

function sim(code, title, chap, tasks, aspect, units){
  const s = shell(code, title, chap, tasks);

  s.ctx = cs.ctx; s.resize = cs.resize;
  s.v = makeView(s.cv, units||10);
  const onR = () => { cs.resize(); s.v.update(); };
  window.addEventListener('resize', onR);

function txt(ctx, s, x, y, col, font, align){ ctx.save(); ctx.fillStyle = col||css('--ink'); ctx.font = font||'13px system-ui'; ctx.textAlign = align||'left'; ctx.fillText(s, x, y); ctx.restore(); }
function box(ctx, x, y, w, h, fill, stroke){ ctx.save(); ctx.fillStyle=fill; ctx.fillRect(x,y,w,h); if(stroke){ ctx.strokeStyle=stroke; ctx.lineWidth=1.5; ctx.strokeRect(x,y,w,h);} ctx.restore(); }
const G0 = 9.8;

/* ===================== SIM-2.1 Bidang miring ===================== */
SIMS['SIM-2.1'] = function(){
  const S = sim('SIM-2.1','Bidang Miring dan Gaya Gesek',2,[
    'Atur sudut 30°, μ<sub>s</sub> = 0,40, μ<sub>k</sub> = 0,30, tanpa dorongan (Contoh 2.1). Bandingkan percepatan dengan 2,35 m/s².',
    'Kecilkan sudut sampai balok tepat diam. Bandingkan tan θ dengan μ<sub>s</sub>.',
    'Saat balok diam, ubah gaya dorong ke atas bidang. Amati gesekan statis menyesuaikan diri sampai batas μ<sub>s</sub>N.'
  ], 0.62);
  const c1 = card(S.side,'Parameter');
  const sT = slider(c1,'th','Sudut θ (°)',0,60,1,30,x=>x+'°');
  const sM = slider(c1,'m','Massa m (kg)',1,10,0.5,5,x=>x.toFixed(1));
  const sMs = slider(c1,'ms','μ<sub>s</sub>',0,1,0.01,0.40,x=>x.toFixed(2));
  const sMk = slider(c1,'mk','μ<sub>k</sub>',0,1,0.01,0.30,x=>x.toFixed(2));
  const sF = slider(c1,'F','Dorongan ke atas bidang (N)',0,80,1,0,x=>x+' N');
  let s=0, v=0, t=0, hist=[];
  const reset = () => { s=0; v=0; t=0; hist=[]; };
  [sT,sM,sMs,sMk].forEach(x=>x.addEventListener('input',reset));
  const ro = readout(S.side);
  const pl = makePlot(S.side,'Kecepatan sepanjang bidang v(t)');
  let st = {};
  S.cleanup.push(anim(dt => {
    const th = (+sT.value)*Math.PI/180, m=+sM.value, ms=+sMs.value, mk=+sMk.value, F=+sF.value;
    const N = m*G0*Math.cos(th), Fd = m*G0*Math.sin(th) - F;   // positif = menuruni bidang
    let f, a;
    if(Math.abs(v) < 1e-6){
      if(Math.abs(Fd) <= ms*N + 1e-9){ f = -Fd; a = 0; v = 0; }
      else { f = -Math.sign(Fd)*mk*N; a = (Fd+f)/m; }
    } else { f = -Math.sign(v)*mk*N; a = (Fd+f)/m; }
    const vn = v + a*dt;
    if(Math.abs(v)>1e-6 && Math.sign(vn)!==Math.sign(v)){ v = 0; } else v = vn;
    s += v*dt; t += dt;
    if(s>5.5 || s<-0.2 || t>12){ reset(); }
    if(hist.length===0 || t-hist[hist.length-1][0]>0.03) hist.push([t,v]);
    st = {th,m,N,f,a,F,Fd,ms,mk};
    draw();
  }));
  function draw(){
    const {ctx,cv} = S; S.clear();
    const th=st.th||0, W=cv._w, H=cv._h;
    const Lpx = Math.min(W*0.8, (H*0.75)/Math.max(0.2,Math.sin(th)+0.01)), base=Lpx*Math.cos(th), hgt=Lpx*Math.sin(th);
    const x0 = (W-base)/2, y0 = H*0.88;
    ctx.fillStyle = css('--chip'); ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x0+base,y0); ctx.lineTo(x0,y0-hgt); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = css('--axis'); ctx.stroke();
    const scale = Lpx/6, u = [Math.cos(th), Math.sin(th)];          // arah menuruni bidang (layar: x kanan, y bawah)
    const pos = 0.3 + s; const cx = x0 + u[0]*pos*scale, cy = y0 - hgt + u[1]*pos*scale;
    const bw=46, bh=30;
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(th); ctx.fillStyle=css('--accent'); ctx.globalAlpha=0.85; ctx.fillRect(-bw/2,-bh,bw,bh); ctx.restore();
    const n=[Math.sin(th),-Math.cos(th)]; const C=[cx+n[0]*bh/2, cy+n[1]*bh/2];
    const k = 60/(Math.max(0.1,st.m||1)*G0);
    const ar=(vec,col,lab)=>arrow(ctx,C[0],C[1],C[0]+vec[0]*k,C[1]+vec[1]*k,col,2.4,lab);
    ar([0,(st.m||1)*G0], css('--vA'),'mg');
    ar([n[0]*(st.N||0), n[1]*(st.N||0)], css('--vB'),'N');
    if(Math.abs(st.f||0)>0.01) ar([u[0]*(st.f), u[1]*(st.f)], css('--vAcc'),'f');
    if((st.F||0)>0) ar([-u[0]*st.F, -u[1]*st.F], css('--vR'),'F');
    const moving = Math.abs(v)>1e-6;
    ro([
      ['tan θ', Math.tan(st.th||0).toFixed(3)],
      ['N = mg cos θ', f2(st.N||0)+' N'],
      ['komponen berat sejajar bidang', f2((st.m||0)*G0*Math.sin(st.th||0))+' N'],
      ['μ<sub>s</sub>N (batas statis)', f2((st.ms||0)*(st.N||0))+' N'],
      ['gesekan f', f2(Math.abs(st.f||0))+' N ('+(moving?'kinetis':'statis')+')'],
      ['percepatan a', f2(st.a||0)+' m/s²'],
      ['kecepatan v', f2(v)+' m/s'],
      ['keadaan', moving||Math.abs(st.a||0)>1e-6 ? '<b>bergerak</b>' : '<b>diam</b>']
    ]);
    pl([{pts:hist, color:css('--vR'), label:'v (m/s)'}], {xmin:0, xmax:Math.max(4,t), xl:'s'});
  }
};

/* ===================== SIM-3.1 Diagram energi potensial ===================== */

    ctx.strokeStyle=css('--vB'); ctx.lineWidth=2.5; ctx.beginPath();
    for(let px=L; px<W-10; px++){ const xx=p.xr[0]+(px-L)/(W-L-10)*(p.xr[1]-p.xr[0]); const yy=Y(Math.min(p.vr[1]+1,p.V(xx))); px===L?ctx.moveTo(px,yy):ctx.lineTo(px,yy); } ctx.stroke();
    ctx.strokeStyle=css('--vA'); ctx.setLineDash([6,4]); ctx.lineWidth=1.8; ctx.beginPath(); ctx.moveTo(L,Y(E)); ctx.lineTo(W-10,Y(E)); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx,'E',W-24,Y(E)-6,css('--vA'),'bold 13px system-ui'); txt(ctx,'V(x)',L+6,22,css('--vB'),'bold 13px system-ui'); txt(ctx,'x',W-20,H-10,css('--muted'));
    txt(ctx,'daerah terarsir: terlarang (V > E)',L+6,H-8,css('--muted'),'11px system-ui');

    ctx.fillStyle=css('--vB'); ctx.beginPath(); ctx.arc(X(x),Y(Vx),4,0,7); ctx.fill();

/* ===================== SIM-3.2 Jatuh dengan hambatan udara ===================== */
SIMS['SIM-3.2'] = function(){
  const S = sim('SIM-3.2','Jatuh dengan Hambatan Udara',3,[
    'Pilih air (tetes hujan) dan diameter 2 mm (Contoh 3.4). Bandingkan kecepatan terminal model kuadratik dengan 6,4 m/s.',
    'Kecilkan diameter sampai model linear dan kuadratik berbeda jauh. Lihat rasio f<sub>kuad</sub>/f<sub>lin</sub>: model mana yang benar?',
    'Bandingkan bola besi dan bola gabus berdiameter sama.'
  ], 0.5);
  const c1=card(S.side,'Bola');
  const mats=[['7800','Besi'],['2500','Kaca'],['1000','Air'],['200','Gabus']];
  let rho=1000;
  seg(c1,mats,'1000',k=>{rho=+k; compute();});
  const sD = slider(c1,'D','log₁₀ diameter (m)',-5,-0.5,0.05,Math.log10(0.002),x=>{const d=10**x; return d<1e-3?(d*1e6).toFixed(0)+' μm':d<1?(d*1e3).toFixed(1)+' mm':d.toFixed(2)+' m';});
  sD.addEventListener('input',()=>compute());
  const ro=readout(S.side);
  const pl=makePlot(S.side,'Laju v(t) untuk tiga model',190);
  let data=null, tCur=0;
  function compute(){
    const D=10**(+sD.value), m=rho*Math.PI/6*D**3, c1=1.6e-4*D, c2=0.25*D*D;
    const vtl=m*G0/c1, vtq=Math.sqrt(m*G0/c2);
    // nyata: c1 v + c2 v^2 = mg
    const vtr=(-c1+Math.sqrt(c1*c1+4*c2*m*G0))/(2*c2);
    const tEnd=Math.min(60,Math.max(0.01, 4*Math.min(vtr,vtq*2)/G0));
    const N=300, lin=[], kua=[], vak=[], nyata=[];
    let vv=0;
    for(let i=0;i<=N;i++){ const t=tEnd*i/N;
      vak.push([t,G0*t]); lin.push([t,vtl*(1-Math.exp(-G0*t/vtl))]); kua.push([t,vtq*Math.tanh(G0*t/vtq)]);
      nyata.push([t,vv]); const h=tEnd/N; for(let k=0;k<20;k++){ vv+=(G0-(c1*vv+c2*vv*vv)/m)*h/20; }
    }
    data={D,m,c1,c2,vtl,vtq,vtr,tEnd,lin,kua,vak,nyata};
    ro([['massa', m.toExponential(2)+' kg'],['v<sub>t</sub> linear = mg/c₁', vtl.toPrecision(3)+' m/s'],['v<sub>t</sub> kuadratik = √(mg/c₂)', vtq.toPrecision(3)+' m/s'],['v<sub>t</sub> gabungan (nyata)', vtr.toPrecision(3)+' m/s'],['rasio f<sub>kuad</sub>/f<sub>lin</sub> di v<sub>t</sub>', (1600*D*vtr).toPrecision(3)],['model yang tepat', 1600*D*vtr>10?'kuadratik':1600*D*vtr<0.1?'linear':'keduanya penting']]);
    tCur=0;
  }
  compute();
  S.cleanup.push(anim(dt=>{
    if(!data) return; tCur+=dt*data.tEnd/5; if(tCur>data.tEnd*1.15) tCur=0;
    const t=Math.min(tCur,data.tEnd), idx=Math.round(t/data.tEnd*300);
    const top=Math.min(data.vak[300][1], Math.max(data.vtq,data.vtl,data.vtr)*1.3);
    pl([{pts:data.vak,color:css('--muted'),dash:[4,4],label:'tanpa hambatan'},{pts:data.lin,color:css('--vB'),label:'linear'},{pts:data.kua,color:css('--vA'),label:'kuadratik'},{pts:data.nyata,color:css('--vR'),w:3,label:'gabungan',dot:data.nyata[idx]}],{xmin:0,xmax:data.tEnd,ymin:0,ymax:top,xl:'s',vline:t});
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h;
    const lanes=[['tanpa hambatan',data.vak,css('--muted')],['linear',data.lin,css('--vB')],['kuadratik',data.kua,css('--vA')],['gabungan',data.nyata,css('--vR')]];
    const dist = arr => { let s=0; for(let i=1;i<=idx;i++) s+=(arr[i][1]+arr[i-1][1])/2*(data.tEnd/300); return s; };
    const maxd = dist(data.nyata)>0 ? Math.max(...lanes.map(l=>{let s=0; for(let i=1;i<=300;i++) s+=(l[1][i][1]+l[1][i-1][1])/2*(data.tEnd/300); return s;})) : 1;
    lanes.forEach((l,i)=>{ const x=W*(0.15+0.23*i), d=dist(l[1]); const y=20+(H-50)*Math.min(1,d/maxd);
      ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.moveTo(x,20); ctx.lineTo(x,H-30); ctx.stroke();
      ctx.fillStyle=l[2]; ctx.beginPath(); ctx.arc(x,y,9,0,7); ctx.fill(); txt(ctx,l[0],x,H-12,l[2],'11px system-ui','center'); });
    txt(ctx,'t = '+t.toPrecision(3)+' s',10,16,css('--muted'),'12px system-ui');
  }));
};

      for(let i=1;i<=n;i++){ const xx=xw+(xb-25-xw)*i/n; ctx.lineTo(xx, cy+(i%2?-10:10)*(i<n?1:0)); } ctx.lineTo(xb-25,cy); ctx.stroke();
      box(ctx,xb-25,cy-25,50,50,css('--accent'),null);

      arrow(ctx,xb,cy-40,xb+y[1]*sc*0.4,cy-40,css('--vR'),2.4,'v'); arrow(ctx,xb,cy+40,xb+a*sc*0.05,cy+40,css('--vA'),2.4,'a');
      T0=2*Math.PI*Math.sqrt(m/k); E=0.5*m*y[1]**2+0.5*k*y[0]**2; Kx=0.5*m*y[1]**2;
    } else {
      const px=W/2, py=H*0.08, len=H*0.8;

      ctx.fillStyle=css('--accent'); ctx.beginPath(); ctx.arc(bx,by,14,0,7); ctx.fill();
      ctx.strokeStyle=css('--muted'); ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,py+len); ctx.stroke(); ctx.setLineDash([]);
      T0=2*Math.PI*Math.sqrt(L/G0); E=0.5*L*L*y[1]**2+G0*L*(1-Math.cos(y[0])); Kx=0.5*L*L*y[1]**2;
    }

    txt(ctx,'K',bx0+2,H*0.2+bh+14,css('--vR'),'11px system-ui'); txt(ctx,'V',bx0+bw+6,H*0.2+bh+14,css('--vB'),'11px system-ui');

/* ===================== SIM-4.2 Osilasi teredam ===================== */
SIMS['SIM-4.2'] = function(){
  const S = sim('SIM-4.2','Osilasi Teredam',4,[
    'Cari nilai γ/ω₀ yang membuat benda paling cepat kembali ke kesetimbangan (sampai |x| < 2% selamanya).',
    'Bandingkan waktu kembali untuk γ/ω₀ = 1 dan 3.',
    'Untuk redaman lemah, ukur dua puncak berurutan, hitung Q ≈ π/δ, dan bandingkan dengan nilai tampilan.'
  ], 0.45);
  const c1=card(S.side,'Redaman');
  const sZ=slider(c1,'z','γ/ω₀',0,3,0.01,0.1,x=>x.toFixed(2));
  const ro=readout(S.side);
  const ph=makePlot(S.side,'Ruang fase (x, v/ω₀)',180);
  const w0=2*Math.PI;
  let tCur=0;
  S.cleanup.push(anim(dt=>{
    const z=+sZ.value, g=z*w0, Tend=6, N=600;
    let y=[1,0]; const xs=[], ps=[]; let tset=null;
    for(let i=0;i<=N;i++){ const t=Tend*i/N; xs.push([t,y[0]]); ps.push([y[0],y[1]/w0]);
      for(let k=0;k<4;k++) y=rk4((t,y)=>[y[1],-2*g*y[1]-w0*w0*y[0]],y,t,Tend/N/4); }
    for(let i=N;i>=0;i--){ if(Math.abs(xs[i][1])>0.02){ tset=xs[Math.min(N,i+1)][0]; break; } }
    tCur=(tCur+dt)%Tend; const idx=Math.round(tCur/Tend*N);
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h,L=40,B=24;
    const X=t=>L+t/Tend*(W-L-10), Y=x=>H/2-x*(H/2-B);
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(L,H/2); ctx.lineTo(W-10,H/2); ctx.moveTo(L,10); ctx.lineTo(L,H-10); ctx.stroke();
    if(z<1){ ctx.strokeStyle=css('--muted'); ctx.setLineDash([4,4]); ctx.beginPath(); for(let i=0;i<=N;i++){ const t=Tend*i/N; ctx.lineTo(X(t),Y(Math.exp(-g*t))); } ctx.stroke(); ctx.beginPath(); for(let i=0;i<=N;i++){ const t=Tend*i/N; ctx.lineTo(X(t),Y(-Math.exp(-g*t))); } ctx.stroke(); ctx.setLineDash([]); }
    ctx.strokeStyle=css('--vB'); ctx.lineWidth=2.5; ctx.beginPath(); xs.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]))); ctx.stroke();
    ctx.fillStyle=css('--vA'); ctx.beginPath(); ctx.arc(X(xs[idx][0]),Y(xs[idx][1]),6,0,7); ctx.fill();
    ctx.globalAlpha=0.35; ctx.strokeStyle=css('--vR'); ctx.setLineDash([2,6]); ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,Y(0.02)); ctx.lineTo(W-10,Y(0.02)); ctx.moveTo(L,Y(-0.02)); ctx.lineTo(W-10,Y(-0.02)); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha=1;
    txt(ctx,'x(t)  (ω₀ = 2π rad/s, x₀ = 1)',L+6,18,css('--muted'),'12px system-ui'); txt(ctx,'t (s)',W-40,H-6,css('--muted'),'11px system-ui');
    const reg = z<0.995?'kurang teredam':z<=1.005?'teredam kritis':'terlalu teredam';
    ph([{pts:ps,color:css('--vD'),dot:ps[idx]}]);
    ro([['jenis', '<b>'+reg+'</b>'],['Q = ω₀/2γ', z>0?(1/(2*z)).toFixed(2):'∞'],['ω<sub>d</sub>/ω₀', z<1?Math.sqrt(1-z*z).toFixed(4):'tidak berosilasi'],['waktu masuk pita ±2%', tset!==null && tset<Tend?tset.toFixed(2)+' s':'> 6 s']]);
  }));
};

/* ===================== SIM-5.1 Kurva resonansi ===================== */
SIMS['SIM-5.1'] = function(){
  const S = sim('SIM-5.1','Kurva Resonansi',5,[
    'Ulangi Contoh 5.1 (Q = 10): bandingkan amplitudo pada ω/ω₀ = 0,1; 1; dan 2.',

  ], 0.4);
  const c1=card(S.side,'Parameter');

  const sQ=slider(c1,'q','Q',1,50,0.5,10,x=>x.toFixed(1));
  const ro=readout(S.side);
  const pa=makePlot(S.side,'Amplitudo A/(F₀/k)',170), pf=makePlot(S.side,'Beda fase δ (°)',140);
  let t=0;
  S.cleanup.push(anim(dt=>{
    t+=dt; const r=+sW.value, Q=+sQ.value, z=1/(2*Q);

/* ===================== SIM-8.2 Meriam Newton ===================== */

/* ===================== SIM-9.1 Orbit Kepler ===================== */

    'Ubah laju awal; catat T dan a, lalu periksa T²/a³ (satuan tahun dan AU) selalu 1.'

  const ro=readout(S.side);
  let y,t,secs,T,a,e,rmin,rmax,vmax,vmin;
  function reset(){ const v0=+sV.value; y=[1,0,0,v0]; t=0; const E=v0*v0/2-GM/1; a=-GM/(2*E); T=Math.sqrt(a**3); const L=v0; e=Math.sqrt(Math.max(0,1+2*E*L*L/(GM*GM))); rmin=a*(1-e); rmax=a*(1+e); vmax=L/rmin; vmin=L/rmax; secs=[[[1,0]]]; }
  reset();
  const f=(t,y)=>{ const r=Math.hypot(y[0],y[1]), k=-GM/(r*r*r); return [y[2],y[3],k*y[0],k*y[1]]; };
  S.cleanup.push(anim(dt=>{
    const step=T/600; const nn=Math.round(dt*360); for(let i=0;i<nn;i++){ y=rk4(f,y,t,step); t+=step; const k=Math.floor(t/(T/12)); if(k>=12){ reset(); return; } while(secs.length<=k) secs.push([secs[secs.length-1].slice(-1)[0]]); secs[k].push([y[0],y[1]]); }
    const {ctx,cv,v}=S; v.update(); S.clear(); const sc=Math.min(2.5, 3/Math.max(rmax,0.3)), cx=0;
    const P=p=>[v.X(p[0]*sc*1.0+cx),v.Y(p[1]*sc)]; const sg=(+sV.value)<2*Math.PI?-1:1;
    secs.forEach((sg,i)=>{ ctx.fillStyle=i%2?css('--vB'):css('--vAcc'); ctx.globalAlpha=0.25; ctx.beginPath(); ctx.moveTo(...P([0,0])); sg.forEach(p=>ctx.lineTo(...P(p))); ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; });

/* ===================== SIM-10.2 Roket ===================== */

  const ro=readout(S.side);
  const pv=makePlot(S.side,'Laju v(t) (km/s)',180);
  let data, tA=0;
  function run(){
    const u=+sU.value, R=+sR.value, tb=+sB.value, m0=100, mf=m0/R, fuel=m0-mf, rate=fuel/tb;
    const dry=mf, tank1=c2.checked?0.5*dry:0;

    while(t<tb){ if(c2.checked && !dropped && t>=tb/2){ m-=tank1; dropped=true; } const a=u*rate/m-(cg.checked?G0:0); v+=a*dt; m-=rate*dt; t+=dt; pts.push([t,v/1000]); }
    data={pts, ts:u*Math.log(R), v, tb};

  }

    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, frac=idx/(data.pts.length-1);

/* ===================== SIM-2.3 Mobil di tikungan ===================== */
SIMS['SIM-2.3'] = function(){
  const S = sim('SIM-2.3','Mobil di Tikungan',2,[
    'Buat tikungan datar (θ = 0°), r = 40 m, μ<sub>s</sub> = 0,6 (Contoh 2.5). Naikkan laju sampai mobil tergelincir; bandingkan dengan v<sub>maks</sub>.',
    'Atur μ<sub>s</sub> = 0 dan beri kemiringan. Pada laju berapa mobil tetap aman tanpa gesekan? Bandingkan dengan √(rg tan θ).',
    'Pada tikungan miring yang licin, turunkan laju di bawah v<sub>ideal</sub>. Ke mana arah gesekan yang diperlukan?'
  ], 0.55);
  const c1 = card(S.side,'Tikungan');
  const sR = slider(c1,'r','jari-jari r (m)',20,150,1,40,x=>x.toFixed(0));
  const sT = slider(c1,'th','kemiringan θ (°)',0,40,1,0,x=>x.toFixed(0)+'°');
  const sM = slider(c1,'mu','koefisien gesek μ<sub>s</sub>',0,1,0.05,0.6,x=>x.toFixed(2));
  const sV = slider(c1,'v','laju v (km/jam)',0,160,1,50,x=>x.toFixed(0));
  const ro = readout(S.side);
  let phi=0, dr=0, status='aman';
  const reset=()=>{ phi=0; dr=0; status='aman'; };
  [sR,sT,sM,sV].forEach(s=>s.addEventListener('input',reset));
  const m=1000;
  S.cleanup.push(anim(dt=>{
    const r=+sR.value, th=(+sT.value)*Math.PI/180, mu=+sM.value, v=(+sV.value)/3.6;
    const c=Math.cos(th), s=Math.sin(th), ac=v*v/r;
    const fNeed = m*(ac*c - G0*s);           // gesekan sepanjang lereng, positif = ke arah pusat
    const N = m*(G0*c + ac*s);
    const den = c - mu*s, vmax = den<=0 ? Infinity : Math.sqrt(r*G0*(s+mu*c)/den);
    const vminSq = r*G0*(s-mu*c)/(c+mu*s), vmin = vminSq>0 ? Math.sqrt(vminSq) : 0;
    const vid = Math.sqrt(r*G0*Math.tan(th));
    const ok = Math.abs(fNeed) <= mu*N + 1e-9;
    if(dt>0 && status==='aman' && !ok) status = fNeed>0 ? 'tergelincir ke luar' : 'tergelincir ke dalam';
    if(status!=='aman') dr += (status==='tergelincir ke luar'?1:-1)*dt*Math.max(2, Math.abs(Math.abs(fNeed)-mu*N)/m*1.5);
    phi += v/Math.max(5,r+dr)*dt;
    const {ctx,cv}=S; S.clear(); const W=cv._w, H=cv._h;
    // --- tampak atas
    const cx=W*0.27, cy=H*0.52, Rp=Math.min(W*0.2,H*0.36), sc=Rp/r;
    ctx.strokeStyle=css('--chip'); ctx.lineWidth=Math.max(18,10*sc*1.2); ctx.beginPath(); ctx.arc(cx,cy,Rp,0,7); ctx.stroke();
    ctx.strokeStyle=css('--axis'); ctx.setLineDash([6,6]); ctx.lineWidth=1.2; ctx.beginPath(); ctx.arc(cx,cy,Rp,0,7); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle=css('--muted'); ctx.beginPath(); ctx.arc(cx,cy,3,0,7); ctx.fill();
    const rr=Math.max(0.2*Rp, Rp+dr*sc), px=cx+rr*Math.cos(phi), py=cy-rr*Math.sin(phi);
    ctx.save(); ctx.translate(px,py); ctx.rotate(-phi-Math.PI/2); ctx.fillStyle=status==='aman'?css('--vB'):css('--vA'); ctx.fillRect(-9,-15,18,30); ctx.restore();
    const ux=-Math.cos(phi), uy=Math.sin(phi);
    if(status==='aman' && v>0) arrow(ctx,px,py,px+ux*Math.min(60,ac*4),py+uy*Math.min(60,ac*4),css('--vR'),2.4,'a');
    txt(ctx,'tampak atas',cx,H-10,css('--muted'),'12px system-ui','center');
    // --- penampang miring dengan diagram gaya
    const bx=W*0.73, by=H*0.62, Lr=W*0.2;
    // jalan: garis miring naik ke arah luar (kanan = luar)
    const x0=bx-Lr*c, y0=by+Lr*s, x1=bx+Lr*c, y1=by-Lr*s;
    ctx.fillStyle=css('--chip'); ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.lineTo(x1,by+Lr*s+18); ctx.lineTo(x0,by+Lr*s+18); ctx.closePath(); ctx.fill();
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y0); ctx.lineTo(x1,y1); ctx.stroke();
    ctx.save(); ctx.translate(bx,by); ctx.rotate(-th); ctx.fillStyle=status==='aman'?css('--vB'):css('--vA'); ctx.fillRect(-26,-22,52,22); ctx.restore();
    const k=H*0.2/(m*G0), ox=bx-11*s, oy=by-11*c;   // piksel per newton
    arrow(ctx,ox,oy,ox,oy+m*G0*k,css('--vAcc'),2.4,'mg');
    arrow(ctx,ox,oy,ox-N*s*k,oy-N*c*k,css('--vR'),2.4,'N');           // tegak lurus jalan
    const fShow = ok ? fNeed : Math.sign(fNeed)*mu*N;               // sepanjang jalan, positif ke pusat (kiri bawah)
    if(Math.abs(fShow)>1) arrow(ctx,ox,oy,ox-fShow*c*k,oy+fShow*s*k,css('--vD'),2.4,'f');
    txt(ctx,'← pusat tikungan',x0-6,by+Lr*s+36,css('--muted'),'12px system-ui','left');
    txt(ctx,'penampang jalan',bx,H-10,css('--muted'),'12px system-ui','center');
    txt(ctx,status==='aman'?'aman':status,10,20,status==='aman'?css('--vR'):css('--vA'),'bold 14px system-ui');
    const kmh=x=>isFinite(x)?(x*3.6).toFixed(0)+' km/jam':'tak terbatas';
    ro([['percepatan sentripetal v²/r', f2(ac)+' m/s²'],['gesekan diperlukan (m = 1000 kg)', (fNeed/1000).toFixed(2)+' kN '+(fNeed>=0?'(ke pusat)':'(ke luar)')],['batas μ<sub>s</sub>N', (mu*N/1000).toFixed(2)+' kN'],['v<sub>ideal</sub> = √(rg tan θ)', kmh(vid)],['v<sub>min</sub> … v<sub>maks</sub>', kmh(vmin)+' … '+kmh(vmax)]]);
  }));
};

/* ===================== SIM-3.3 Metode numerik ===================== */
SIMS['SIM-3.3'] = function(){
  const S = sim('SIM-3.3','Metode Numerik: Euler, Euler–Cromer, RK4',3,[
    'Dengan Δt = 0,1 s, jalankan ketiga metode untuk osilator pegas. Metode mana yang energinya terus naik?',
    'Perkecil Δt menjadi 0,02 s. Seberapa banyak galat Euler berkurang? Bandingkan dengan Euler–Cromer.',
    'Pilih model dengan hambatan kuadratik (tidak ada rumus eksak). Apakah ketiga metode tetap sepakat bila Δt kecil?'
  ], 0.5);
  const c1=card(S.side,'Model dan langkah waktu');
  let model='pegas';
  seg(c1,[['pegas','Pegas: F = −kx'],['hambat','Pegas + hambatan −cv|v|']],model,k=>{model=k; reset();});
  const sD=slider(c1,'dt','langkah Δt (s)',0.01,0.5,0.01,0.1,x=>x.toFixed(2));
  sD.addEventListener('input',()=>reset());
  const c2=card(S.side,'Tampilkan');
  const cE=check(c2,'<span class="sw" style="background:var(--vA)"></span>Euler',true);
  const cC=check(c2,'<span class="sw" style="background:var(--vB)"></span>Euler–Cromer',true);
  const cR=check(c2,'<span class="sw" style="background:var(--vR)"></span>Runge–Kutta 4',true);
  const ro=readout(S.side,'Energi relatif E/E₀ saat t');
  const k=1, mm=1, cdrag=0.3, Tend=40;
  const F=(x,v)=>-k*x-(model==='hambat'?cdrag*v*Math.abs(v):0);
  const En=(x,v)=>0.5*mm*v*v+0.5*k*x*x;
  let sols, tCur=0;
  function reset(){
    const h=+sD.value, N=Math.ceil(Tend/h);
    const eu=[[0,1,0]], ec=[[0,1,0]], rk=[[0,1,0]];
    let a=[1,0], b=[1,0], c=[1,0];
    for(let i=1;i<=N;i++){
      const t=i*h;
      a=[a[0]+a[1]*h, a[1]+F(a[0],a[1])/mm*h];
      const vb=b[1]+F(b[0],b[1])/mm*h; b=[b[0]+vb*h, vb];
      c=rk4((t,y)=>[y[1],F(y[0],y[1])/mm],c,t,h);
      eu.push([t,a[0],a[1]]); ec.push([t,b[0],b[1]]); rk.push([t,c[0],c[1]]);
    }
    // acuan: eksak (pegas) atau RK4 langkah sangat kecil (hambatan)
    const ref=[]; let y=[1,0]; const hh=0.002;
    for(let i=0;i<=Tend/hh;i++){ const t=i*hh; if(i%25===0) ref.push([t, model==='pegas'?Math.cos(t):y[0], model==='pegas'?-Math.sin(t):y[1]]); if(model!=='pegas') y=rk4((t,y)=>[y[1],F(y[0],y[1])/mm],y,t,hh); }
    sols={eu,ec,rk,ref,h}; tCur=0;
  }
  reset();
  S.cleanup.push(anim(dt=>{
    tCur=Math.min(Tend, tCur+dt*4);
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, L=44, R=12, T=16, B=26;
    const X=t=>L+t/Tend*(W-L-R), Y=x=>T+(1.6-x)/3.2*(H-T-B);
    ctx.strokeStyle=css('--grid'); ctx.lineWidth=1; ctx.beginPath();
    for(let t=0;t<=Tend;t+=5){ ctx.moveTo(X(t),T); ctx.lineTo(X(t),H-B); } for(let x=-1.5;x<=1.5;x+=0.5){ ctx.moveTo(L,Y(x)); ctx.lineTo(W-R,Y(x)); } ctx.stroke();
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(L,Y(0)); ctx.lineTo(W-R,Y(0)); ctx.moveTo(L,T); ctx.lineTo(L,H-B); ctx.stroke();
    ctx.fillStyle=css('--muted'); ctx.font='11px system-ui';
    for(let t=0;t<=Tend;t+=10) ctx.fillText(t+' s',X(t)-8,H-8); [-1,0,1].forEach(x=>ctx.fillText(x,L-18,Y(x)+4)); ctx.fillText('x (m)',4,T+4);
    const line=(arr,col,w,dash)=>{ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=w; if(dash) ctx.setLineDash(dash); ctx.beginPath(); let st=false;
      for(const p of arr){ if(p[0]>tCur) break; const yy=Math.max(-1.6,Math.min(1.6,p[1])); st?ctx.lineTo(X(p[0]),Y(yy)):ctx.moveTo(X(p[0]),Y(yy)); st=true; } ctx.stroke(); ctx.restore(); };
    line(sols.ref,css('--muted'),3,[2,4]);
    if(cE.checked) line(sols.eu,css('--vA'),2); if(cC.checked) line(sols.ec,css('--vB'),2); if(cR.checked) line(sols.rk,css('--vR'),2);
    txt(ctx,model==='pegas'?'titik-titik abu-abu: penyelesaian eksak x = cos t':'titik-titik abu-abu: acuan (Δt sangat kecil)',L+6,T+12,css('--muted'),'12px system-ui');
    const i=Math.min(sols.eu.length-1,Math.floor(tCur/sols.h)), E0=En(1,0);
    const r=(a)=>(En(a[i][1],a[i][2])/E0).toFixed(3);
    const eref=sols.ref[Math.min(sols.ref.length-1,Math.round(tCur/0.05))];
    ro([['t', tCur.toFixed(1)+' s'],['Euler', r(sols.eu)],['Euler–Cromer', r(sols.ec)],['Runge–Kutta 4', r(sols.rk)],['acuan', (En(eref[1],eref[2])/E0).toFixed(3)]]);
  }));
};

    ctx.strokeStyle=sgn>0?css('--vA'):css('--vD'); ctx.lineWidth=2.2; ctx.beginPath(); tr.forEach((p,i)=>{ const q=P(p[0],p[1],p[2]); i?ctx.lineTo(...q):ctx.moveTo(...q); }); ctx.stroke();

    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, cx=W*0.42, cy=H/2, Re=Math.min(W,H)*0.2;
    if(cT.checked){ ctx.fillStyle=css('--vB'); ctx.globalAlpha=0.22; ctx.beginPath(); for(let i=0;i<=180;i++){ const a=i/180*2*Math.PI, r=Re*(1+0.18*hgt(a)/1.3); const px=cx+r*Math.cos(a), py=cy-r*Math.sin(a); i?ctx.lineTo(px,py):ctx.moveTo(px,py); } ctx.closePath(); ctx.fill(); ctx.globalAlpha=1; }

    pl([{pts:hist.map(p=>[p[0],p[1]]),color:css('--vB')}],{xmin:Math.max(0,t-50),xmax:Math.max(50,t),ymin:-1.2,ymax:2.6,xl:'jam'});
    ro([['waktu', t.toFixed(1)+' jam'],['pengaruh Bulan ∝ 1/d³', kM.toFixed(2)+' × (d = 60 R)'],['rotasi Bumi relatif Bulan', '24 jam 50 menit'],['selang dua pasang naik', '≈ 12 jam 25 menit']]);

/* ===================== SIM-9.3 Transfer Hohmann ===================== */
SIMS['SIM-9.3'] = function(){
  const S = sim('SIM-9.3','Transfer Hohmann',9,[
    'Pilih "LEO → GEO". Catat Δv<sub>1</sub>, Δv<sub>2</sub>, dan waktu transfer. Mengapa satelit harus dipercepat dua kali padahal laju akhirnya lebih kecil?',
    'Bandingkan laju di orbit awal dan orbit akhir. Orbit mana yang lebih cepat?',
    'Naikkan r<sub>2</sub> sangat besar. Bandingkan Δv total dengan Δv untuk lepas dari Bumi, (√2 − 1)v<sub>1</sub>.'
  ], 0.75);
  const GM=3.986e5; // km³/s²
  const c1=card(S.side,'Orbit (jari-jari dari pusat Bumi)');
  const s1=slider(c1,'r1','r₁ (km)',6600,20000,50,6700,x=>x.toFixed(0));
  const s2=slider(c1,'r2','r₂ (km)',7000,60000,100,42200,x=>x.toFixed(0));
  buttons(c1,[['LEO → GEO',()=>{ s1.value=6700; s2.value=42200; [s1,s2].forEach(s=>s.dispatchEvent(new Event('input'))); }],['Bumi → Mars (skala 1 AU = 10 000 km)',()=>{ s1.value=10000; s2.value=15240; [s1,s2].forEach(s=>s.dispatchEvent(new Event('input'))); },true]]);
  const ro=readout(S.side);
  let ph, tt, flash;
  const reset=()=>{ ph=0; tt=0; flash=0; }; reset();
  [s1,s2].forEach(s=>s.addEventListener('input',()=>{ if(+s2.value<=+s1.value+200) s2.value=+s1.value+200; reset(); }));
  S.cleanup.push(anim(dt=>{
    const r1=+s1.value, r2=+s2.value, a=(r1+r2)/2;
    const v1=Math.sqrt(GM/r1), v2=Math.sqrt(GM/r2), vp=Math.sqrt(GM*(2/r1-1/a)), va=Math.sqrt(GM*(2/r2-1/a));
    const T1=2*Math.PI*Math.sqrt(r1**3/GM), Tt=Math.PI*Math.sqrt(a**3/GM), T2=2*Math.PI*Math.sqrt(r2**3/GM);
    const k=T1/4;  // satu putaran orbit awal ~ 4 detik layar
    tt+=dt*k; flash=Math.max(0,flash-dt);
    let x,y,stage;
    if(ph===0){ const th=2*Math.PI*tt/T1-Math.PI/2*0; x=r1*Math.cos(th+Math.PI); y=r1*Math.sin(th+Math.PI); stage='orbit awal'; if(tt>=T1){ ph=1; tt=0; flash=0.8; } }
    if(ph===1){ // elips transfer: perigee di (-r1,0)? gunakan anomali sejati dari persamaan Kepler
      const e=(r2-r1)/(r2+r1), n=Math.PI/Tt, M=n*tt; let E=M; for(let i=0;i<8;i++) E=E-(E-e*Math.sin(E)-M)/(1-e*Math.cos(E));
      const xs=a*(Math.cos(E)-e), ys=a*Math.sqrt(1-e*e)*Math.sin(E); x=-xs; y=-ys; stage='elips transfer';
      if(tt>=Tt){ ph=2; tt=0; flash=0.8; } }
    if(ph===2){ const th=2*Math.PI*tt/T2; x=r2*Math.cos(th); y=r2*Math.sin(th); stage='orbit akhir'; if(tt>=T2) reset(); }
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, cx=W/2, cy=H/2, sc=Math.min(W,H)*0.45/r2;
    ctx.fillStyle=css('--vB'); ctx.beginPath(); ctx.arc(cx,cy,Math.max(4,6371*sc),0,7); ctx.fill();
    ctx.lineWidth=1.5; ctx.strokeStyle=css('--vR'); ctx.beginPath(); ctx.arc(cx,cy,r1*sc,0,7); ctx.stroke();
    ctx.strokeStyle=css('--vD'); ctx.beginPath(); ctx.arc(cx,cy,r2*sc,0,7); ctx.stroke();
    ctx.strokeStyle=css('--vAcc'); ctx.setLineDash([5,5]); ctx.beginPath(); ctx.ellipse(cx+(r2-a)*sc*1,cy,a*sc,Math.sqrt(r1*r2)*sc,0,Math.PI,2*Math.PI,true); ctx.stroke(); ctx.setLineDash([]);
    // posisi dorongan
    txt(ctx,'dorongan 1',cx-r1*sc-4,cy+16,css('--vA'),'12px system-ui','right'); txt(ctx,'dorongan 2',cx+r2*sc+4,cy-8,css('--vA'),'12px system-ui','left');
    const px=cx+x*sc, py=cy-y*sc;
    if(flash>0){ ctx.fillStyle=css('--vA'); ctx.globalAlpha=flash; ctx.beginPath(); ctx.arc(px,py,16,0,7); ctx.fill(); ctx.globalAlpha=1; }
    ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill();
    txt(ctx,stage,10,20,css('--muted'),'bold 13px system-ui');
    ro([['v₁ (orbit awal)', v1.toFixed(2)+' km/s'],['v perigee transfer', vp.toFixed(2)+' km/s'],['<b>Δv₁</b>', (vp-v1).toFixed(2)+' km/s'],['v apogee transfer', va.toFixed(2)+' km/s'],['v₂ (orbit akhir)', v2.toFixed(2)+' km/s'],['<b>Δv₂</b>', (v2-va).toFixed(2)+' km/s'],['Δv total', (vp-v1+v2-va).toFixed(2)+' km/s'],['waktu transfer', (Tt/3600).toFixed(2)+' jam']]);
  }));
};

    phi+=Om*dt; spin+=Math.min(w,40)*dt;
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, sc=Math.min(W,H)*1.25, el=0.32;
    const P=(x,y,z)=>[W/2+sc*x, H*0.62-sc*(z+y*el)];  // proyeksi miring: y ke dalam layar
    // lantai dan tiang
    ctx.strokeStyle=css('--axis'); ctx.lineWidth=1; ctx.beginPath(); for(let i=0;i<=40;i++){ const a=i/40*2*Math.PI; const q=P(0.3*Math.cos(a),0.3*Math.sin(a),-0.15); i?ctx.lineTo(...q):ctx.moveTo(...q); } ctx.stroke();
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(...P(0,0,-0.15)); ctx.lineTo(...P(0,0,0)); ctx.stroke();
    const ax=Math.cos(phi), ay=Math.sin(phi);           // arah poros (mendatar)
    const end=[d*ax,d*ay,0];
    // jejak presesi
    ctx.strokeStyle=css('--grid'); ctx.lineWidth=1.5; ctx.setLineDash([4,4]); ctx.beginPath(); for(let i=0;i<=60;i++){ const a=i/60*2*Math.PI; const q=P(d*Math.cos(a),d*Math.sin(a),0); i?ctx.lineTo(...q):ctx.moveTo(...q); } ctx.stroke(); ctx.setLineDash([]);
    // poros
    ctx.strokeStyle=css('--ink'); ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(...P(0,0,0)); ctx.lineTo(...P(end[0]*1.15,end[1]*1.15,0)); ctx.stroke();
    // roda: lingkaran tegak lurus poros, sumbu u = (-ay, ax, 0), w = (0,0,1)
    const ux=-ay, uy=ax; const rim=[]; for(let i=0;i<=48;i++){ const a=i/48*2*Math.PI; rim.push(P(end[0]+R*Math.cos(a)*ux, end[1]+R*Math.cos(a)*uy, R*Math.sin(a))); }
    ctx.fillStyle=css('--vB'); ctx.globalAlpha=0.25; ctx.beginPath(); rim.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q)); ctx.fill(); ctx.globalAlpha=1;
    ctx.strokeStyle=css('--vB'); ctx.lineWidth=3; ctx.beginPath(); rim.forEach((q,i)=>i?ctx.lineTo(...q):ctx.moveTo(...q)); ctx.stroke();
    for(let j=0;j<3;j++){ const a=spin+j*2*Math.PI/3; ctx.strokeStyle=css('--vB'); ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(...P(...end)); ctx.lineTo(...P(end[0]+R*Math.cos(a)*ux,end[1]+R*Math.cos(a)*uy,R*Math.sin(a))); ctx.stroke(); }
    if(cV.checked){
      const Lv=Math.min(0.28, 0.06+L*0.05), o=P(...end), Lp=P(end[0]+ax*Lv,end[1]+ay*Lv,0);
      arrow(ctx,...o,...Lp,css('--vR'),2.6,'L');
      const tauDir=[-ay, ax];   // τ = r × Mg = (ax, ay, 0) × (0, 0, −Mg) ∝ (−ay, ax, 0)
      arrow(ctx,...P(0,0,0),...P(tauDir[0]*0.16,tauDir[1]*0.16,0),css('--vAcc'),2.4,'τ');
      arrow(ctx,...Lp,...P(end[0]+ax*Lv+tauDir[0]*0.07,end[1]+ay*Lv+tauDir[1]*0.07,0),css('--vD'),2,'dL');
      arrow(ctx,...P(...end),...P(end[0],end[1],-0.12),css('--vA'),2,'Mg'); }
    const ratio=Om/w;
    ro([['I = ½MR²', I.toFixed(4)+' kg·m²'],['L = Iω', L.toFixed(3)+' kg·m²/s'],['τ = Mgd', tau.toFixed(3)+' N·m'],['<b>Ω = τ/L</b>', Om.toFixed(3)+' rad/s'],['periode presesi', (2*Math.PI/Om).toFixed(2)+' s'],['Ω/ω', ratio.toFixed(4)+(ratio>0.1?' (terlalu besar: pendekatan tidak berlaku)':' (pendekatan berlaku)')]]);
  }));
};

/* ===================== SIM-13.3 Prinsip Hamilton ===================== */
SIMS['SIM-13.3'] = function(){
  const S = sim('SIM-13.3','Prinsip Hamilton: Mencari Aksi Stasioner',13,[
    'Pada "lempar vertikal", geser a₁ dan a₂ menjauhi nol. Apakah aksi S pernah lebih kecil daripada untuk lintasan sebenarnya (a₁ = a₂ = 0)?',
    'Jalankan waktu: kedua bola berangkat dan tiba bersamaan. Mana yang "benar" menurut hukum Newton?',
    'Pilih osilator harmonik dan perbesar T melewati π s. Apa yang terjadi pada kurva S(a₁)? Mengapa disebut aksi <i>stasioner</i>, bukan selalu minimum?'
  ], 0.55);
  const c1=card(S.side,'Sistem (m = 1 kg)');
  let mode='lempar';
  seg(c1,[['lempar','Lempar vertikal (g = 9,8)'],['osc','Osilator harmonik (ω = 1)']],mode,k=>{mode=k; tA=0;});
  const sT=slider(c1,'T','selang waktu T (s)',1,5,0.05,2,x=>x.toFixed(2));
  const c2=card(S.side,'Lintasan coba: q = q<sub>benar</sub> + a₁ sin(πt/T) + a₂ sin(2πt/T)');
  const s1=slider(c2,'a1','a₁ (m)',-3,3,0.05,1,x=>x.toFixed(2));
  const s2=slider(c2,'a2','a₂ (m)',-3,3,0.05,0,x=>x.toFixed(2));
  const ro=readout(S.side);
  const pl=makePlot(S.side,'Aksi S terhadap a₁ (a₂ tetap)',150);
  let tA=0;
  const qTrue=(t,T)=> mode==='lempar' ? 0.5*G0*t*(T-t) : Math.sin(t)/Math.sin(T);
  const vTrue=(t,T)=> mode==='lempar' ? 0.5*G0*(T-2*t) : Math.cos(t)/Math.sin(T);
  function action(a1,a2,T){ const N=400, h=T/N; let Sx=0;
    for(let i=0;i<=N;i++){ const t=i*h, w=(i===0||i===N)?0.5:1;
      const q=qTrue(t,T)+a1*Math.sin(Math.PI*t/T)+a2*Math.sin(2*Math.PI*t/T);
      const v=vTrue(t,T)+a1*Math.PI/T*Math.cos(Math.PI*t/T)+a2*2*Math.PI/T*Math.cos(2*Math.PI*t/T);
      const Lg = mode==='lempar' ? 0.5*v*v - G0*q : 0.5*v*v - 0.5*q*q; Sx+=w*Lg*h; }
    return Sx; }
  S.cleanup.push(anim(dt=>{
    let T=+sT.value; if(mode==='osc' && Math.abs(T-Math.PI)<0.04) T=Math.PI+0.04*Math.sign(T-Math.PI||1);
    tA+=dt*0.8; if(tA>T+0.8) tA=0; const tt=Math.min(tA,T);
    const a1=+s1.value, a2=+s2.value;
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, L=46, R=14, Tp=16, B=28;
    const pts=[], ptt=[]; let mn=Infinity, mx=-Infinity;
    for(let i=0;i<=200;i++){ const t=T*i/200, q0=qTrue(t,T), q=q0+a1*Math.sin(Math.PI*t/T)+a2*Math.sin(2*Math.PI*t/T); pts.push([t,q0]); ptt.push([t,q]); mn=Math.min(mn,q0,q); mx=Math.max(mx,q0,q); }
    mn=Math.min(mn,-0.5); mx=Math.max(mx,0.5); const pad=(mx-mn)*0.1; mn-=pad; mx+=pad;
    const X=t=>L+t/T*(W*0.72-L), Y=q=>Tp+(mx-q)/(mx-mn)*(H-Tp-B);
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(L,Tp); ctx.lineTo(L,H-B); ctx.lineTo(W*0.72,H-B); ctx.stroke();
    if(mn<0&&mx>0){ ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.moveTo(L,Y(0)); ctx.lineTo(W*0.72,Y(0)); ctx.stroke(); }
    txt(ctx,'q (m)',6,Tp+6,css('--muted'),'11px system-ui'); txt(ctx,'t',W*0.72+4,H-B+4,css('--muted'),'12px system-ui'); txt(ctx,'0',L-4,H-8,css('--muted'),'11px system-ui','right'); txt(ctx,'T',W*0.72,H-8,css('--muted'),'11px system-ui','center');
    const line=(a,c,dash)=>{ ctx.save(); ctx.strokeStyle=c; ctx.lineWidth=2.4; if(dash) ctx.setLineDash(dash); ctx.beginPath(); a.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]))); ctx.stroke(); ctx.restore(); };
    line(pts,css('--vR')); line(ptt,css('--vA'),[6,4]);
    [pts[0],pts[200]].forEach(p=>{ ctx.fillStyle=css('--ink'); ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),5,0,7); ctx.fill(); });
    txt(ctx,'lintasan sebenarnya',L+8,Tp+12,css('--vR'),'12px system-ui'); txt(ctx,'lintasan coba',L+8,Tp+28,css('--vA'),'12px system-ui');
    // dua bola pada kolom kanan, posisi q
    const bx1=W*0.82, bx2=W*0.92; const qn=qTrue(tt,T), qc=qn+a1*Math.sin(Math.PI*tt/T)+a2*Math.sin(2*Math.PI*tt/T);
    ctx.strokeStyle=css('--grid'); ctx.beginPath(); ctx.moveTo(bx1,Tp); ctx.lineTo(bx1,H-B); ctx.moveTo(bx2,Tp); ctx.lineTo(bx2,H-B); ctx.stroke();
    ctx.fillStyle=css('--vR'); ctx.beginPath(); ctx.arc(bx1,Y(qn),9,0,7); ctx.fill(); ctx.fillStyle=css('--vA'); ctx.beginPath(); ctx.arc(bx2,Y(qc),9,0,7); ctx.fill();
    ctx.strokeStyle=css('--muted'); ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(X(tt),Tp); ctx.lineTo(X(tt),H-B); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx,'t = '+tt.toFixed(2)+' s',W*0.87,H-8,css('--muted'),'12px system-ui','center');
    const S0=action(0,a2,T), Sc=action(a1,a2,T), Sb=action(0,0,T);
    const curve=[]; for(let i=0;i<=60;i++){ const aa=-3+6*i/60; curve.push([aa,action(aa,a2,T)]); }
    pl([{pts:curve,color:css('--vB'),dot:[a1,Sc]}],{xl:'a₁ (m)', vline:0});
    ro([['S lintasan sebenarnya', Sb.toFixed(3)+' J·s'],['S lintasan coba', Sc.toFixed(3)+' J·s'],['ΔS', (Sc-Sb>=0?'+':'')+(Sc-Sb).toFixed(3)+' J·s'],['kurva S(a₁)', (action(1,a2,T)+action(-1,a2,T)-2*S0)>0?'lembah (minimum)':'puncak: stasioner tetapi bukan minimum']]);
  }));
};

/* ===================== SIM-14.3 Lepas dari kubah ===================== */
SIMS['SIM-14.3'] = function(){
  const S = sim('SIM-14.3','Lepas dari Kubah: Pengali Lagrange',14,[
    'Dengan laju awal hampir nol, catat sudut ketika partikel lepas. Bandingkan dengan cos θ = 2/3 (Contoh 14.1).',
    'Ubah jari-jari kubah. Apakah sudut lepas berubah? Mengapa?',
    'Beri laju awal lebih besar. Partikel lepas lebih awal; periksa cos θ<sub>lepas</sub> = (2 + v₀²/gR)/3. Pada laju berapa partikel langsung lepas dari puncak?'
  ], 0.6);
  const c1=card(S.side,'Parameter');
  const sR=slider(c1,'R','jari-jari kubah R (m)',0.5,3,0.1,1.5,x=>x.toFixed(1));
  const sV=slider(c1,'v0','laju awal di puncak v₀ (m/s)',0.01,5,0.01,0.05,x=>x.toFixed(2));
  const ro=readout(S.side);
  const pl=makePlot(S.side,'Gaya normal N/mg = λ/mg terhadap θ',150);
  let th,om,on,xy,vxy,thL,tr;
  function reset(){ const R=+sR.value, v0=+sV.value; th=0; om=v0/R; on=true; xy=null; vxy=null; thL=null; tr=[[0,R]]; if(v0*v0>=G0*R){ on=false; thL=0; xy=[0,R]; vxy=[v0,0]; } }
  reset(); [sR,sV].forEach(s=>s.addEventListener('input',reset));
  S.cleanup.push(anim(dt=>{
    const R=+sR.value, v0=+sV.value;
    const Nf=(t,w)=>Math.cos(t)-R*w*w/G0;
    if(dt>0){ const n=20, h=dt/n; for(let i=0;i<n;i++){
      if(on){ const y=rk4((t,y)=>[y[1],G0/R*Math.sin(y[0])],[th,om],0,h); th=y[0]; om=y[1];
        if(Nf(th,om)<=0){ on=false; thL=th; xy=[R*Math.sin(th),R*Math.cos(th)]; vxy=[R*om*Math.cos(th),-R*om*Math.sin(th)]; } }
      else if(xy && xy[1]>0){ vxy[1]-=G0*h; xy=[xy[0]+vxy[0]*h, xy[1]+vxy[1]*h]; if(xy[1]<0) xy[1]=0; } }
      const p=on?[R*Math.sin(th),R*Math.cos(th)]:xy; tr.push(p.slice()); if(tr.length>2000) tr.shift(); }
    const {ctx,cv}=S; S.clear(); const W=cv._w,H=cv._h, sc=Math.min(W*0.42/(R*2.2), H*0.8/(R*1.25)), ox=W*0.4, oy=H*0.9;
    const X=x=>ox+x*sc, Y=y=>oy-y*sc;
    ctx.fillStyle=css('--chip'); ctx.beginPath(); ctx.arc(ox,oy,R*sc,Math.PI,0); ctx.fill(); ctx.strokeStyle=css('--ink'); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(ox,oy,R*sc,Math.PI,0); ctx.stroke();
    ctx.strokeStyle=css('--axis'); ctx.beginPath(); ctx.moveTo(0,oy); ctx.lineTo(W,oy); ctx.stroke();
    const cth=Math.min(1,(2+v0*v0/(G0*R))/3), thTeo=Math.acos(cth);
    ctx.strokeStyle=css('--vAcc'); ctx.setLineDash([4,4]); ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(X(R*1.15*Math.sin(thTeo)),Y(R*1.15*Math.cos(thTeo))); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx,'θ lepas (teori)',X(R*1.18*Math.sin(thTeo))+4,Y(R*1.18*Math.cos(thTeo)),css('--vAcc'),'12px system-ui');
    ctx.strokeStyle=css('--vA'); ctx.lineWidth=1.8; ctx.beginPath(); tr.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1]))); ctx.stroke();
    const p=on?[R*Math.sin(th),R*Math.cos(th)]:xy; const px=X(p[0]), py=Y(p[1]);
    ctx.fillStyle=css('--vB'); ctx.beginPath(); ctx.arc(px,py,8,0,7); ctx.fill();
    const Nn=on?Nf(th,om):0;
    arrow(ctx,px,py,px,py+40,css('--vAcc'),2.2,'mg');
    if(on && Nn>0.01){ const k=40*Nn; arrow(ctx,px,py,px+k*Math.sin(th),py-k*Math.cos(th),css('--vR'),2.2,'N'); }
    txt(ctx,on?'di permukaan kubah':'lepas dari kubah'+(thL!==null?' pada θ = '+(thL*180/Math.PI).toFixed(1)+'°':''),10,20,on?css('--muted'):css('--vA'),'bold 13px system-ui');
    const curve=[]; for(let i=0;i<=90;i++){ const t=i*Math.PI/180, w2=v0*v0/(R*R)+2*G0/R*(1-Math.cos(t)); curve.push([i,Math.cos(t)-R*w2/G0]); }
    pl([{pts:curve,color:css('--vB'),dot:on?[th*180/Math.PI,Nn]:null},{pts:[[0,0],[90,0]],color:css('--muted'),dash:[3,3]}],{xmin:0,xmax:90,ymin:-1,ymax:1.05,xl:'θ (°)'});
    ro([['θ sekarang', on?(th*180/Math.PI).toFixed(1)+'°':'—'],['N/mg = cos θ − Rθ̇²/g', on?Nn.toFixed(3):'0 (lepas)'],['cos θ lepas teori', cth.toFixed(3)],['θ lepas teori', (thTeo*180/Math.PI).toFixed(1)+'°'],['θ lepas simulasi', thL!==null?(thL*180/Math.PI).toFixed(1)+'°':'—'],['laju untuk langsung lepas √(gR)', Math.sqrt(G0*R).toFixed(2)+' m/s']]);
  }));
};


route();
