otation></semantics></math>\ndi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><msub><mi>ω</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega = \\omega_0</annotation></semantics></math>.<br />\n<strong>3. B.</strong> Gaya berubah sangat pelan, sehingga responsnya\nstatis.<br />\n<strong>4. C.</strong> Inersia yang mendominasi.<br />\n<strong>5. E.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msub><mi>F</mi><mn>0</mn></msub><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mi>m</mi><mi>γ</mi><msub><mi>ω</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>∝</mo><mn>1</mn><mi>/</mi><mi>γ</mi></mrow><annotation encoding=\"application/x-tex\">A(\\omega_0) = F_0/(2m\\gamma\\omega_0) \\propto 1/\\gamma</annotation></semantics></math>.<br />\n<strong>6. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>ω</mi><mo>≈</mo><msub><mi>ω</mi><mn>0</mn></msub><mi>/</mi><mi>Q</mi></mrow><annotation encoding=\"application/x-tex\">\\Delta\\omega \\approx \\omega_0/Q</annotation></semantics></math>.<br />\n<strong>7. D.</strong> Angin tetap membangkitkan osilasi melalui\ninteraksi dengan gerak jembatan.<br />\n<strong>8. E.</strong> Persamaan (5.9) maksimum tepat di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ω</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\omega_0</annotation></semantics></math>\n(berbeda dengan amplitudo simpangan).<br />\n<strong>9. B.</strong> Transien berbanding dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mi>e</mi><mrow><mo>−</mo><mi>γ</mi><mi>t</mi></mrow></msup><annotation encoding=\"application/x-tex\">e^{-\\gamma t}</annotation></semantics></math>.<br />\n<strong>10. D.</strong> Persamaan (5.10).</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_0 = 10</annotation></semantics></math>\nrad/s,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\gamma = 1</annotation></semantics></math>\ns⁻¹;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>066</mn></mrow><annotation encoding=\"application/x-tex\">A \\approx 0{,}066</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><mo>≈</mo><mn>7</mn><mo>,</mo><mn>6</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\delta \\approx 7{,}6°</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">A = 0{,}25</annotation></semantics></math>\nm\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>5</mn><mo>×</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>F</mi><mn>0</mn></msub><mi>/</mi><mi>k</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">= 5 \\times (F_0/k)</annotation></semantics></math>,\nkarena\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">Q = 5</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><mo>=</mo><mn>90</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\delta = 90°</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>=</mo><mn>220</mn></mrow><annotation encoding=\"application/x-tex\">Q = 220</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>=</mo><mi>Δ</mi><mi>ω</mi><mi>/</mi><mn>2</mn><mo>=</mo><mn>2</mn><mi>π</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mn>2</mn><mo>≈</mo><mn>6</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">\\gamma = \\Delta\\omega/2 = 2\\pi(2)/2 \\approx 6{,}3</annotation></semantics></math>\ns⁻¹.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msub><mi>f</mi><mn>0</mn></msub><mi>λ</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">v = f_0\\lambda = 3</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mi>Q</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>F</mi><mn>0</mn></msub><mi>/</mi><mi>k</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">A = Q(F_0/k) = 5</annotation></semantics></math>\ncm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">|</mo><mi>C</mi><mo stretchy=\"true\" form=\"postfix\">|</mo></mrow><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>F</mi><mn>0</mn></msub><mi>/</mi><mi>m</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><msqrt><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msubsup><mi>ω</mi><mn>0</mn><mn>2</mn></msubsup><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mo>+</mo><mn>4</mn><msup><mi>γ</mi><mn>2</mn></msup><msup><mi>ω</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">|C| = (F_0/m)/\\sqrt{(\\omega_0^2 - \\omega^2)^2 + 4\\gamma^2\\omega^2}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>arg</mo><mi>C</mi><mo>=</mo><mo>−</mo><mi>δ</mi></mrow><annotation encoding=\"application/x-tex\">\\arg C = -\\delta</annotation></semantics></math>.</li>\n<li>Minimumkan penyebut; turunannya nol di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>ω</mi><mn>2</mn></msup><mo>=</mo><msubsup><mi>ω</mi><mn>0</mn><mn>2</mn></msubsup><mo>−</mo><mn>2</mn><msup><mi>γ</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\omega^2 = \\omega_0^2 - 2\\gamma^2</annotation></semantics></math>,\nyang hanya bermakna jika positif.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo stretchy=\"false\" form=\"prefix\">⟨</mo><mi>P</mi><mo stretchy=\"false\" form=\"postfix\">⟩</mo><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><msub><mi>F</mi><mn>0</mn></msub><mi>ω</mi><mi>A</mi><mo>sin</mo><mi>δ</mi></mrow><annotation encoding=\"application/x-tex\">\\langle P\\rangle = \\tfrac{1}{2}F_0\\omega A\\sin\\delta</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>P</mi><mo>max</mo></msub><mo>=</mo><msubsup><mi>F</mi><mn>0</mn><mn>2</mn></msubsup><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>4</mn><mi>m</mi><mi>γ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>12</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">P_{\\max} = F_0^2/(4m\\gamma) = 12{,}5</annotation></semantics></math>\nW.</li>\n<li>Di dekat\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>ω</mi><mn>0</mn></msub><annotation encoding=\"application/x-tex\">\\omega_0</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>ω</mi><mn>0</mn><mn>2</mn></msubsup><mo>−</mo><msup><mi>ω</mi><mn>2</mn></msup><mo>≈</mo><mn>2</mn><msub><mi>ω</mi><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mn>0</mn></msub><mo>−</mo><mi>ω</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\omega_0^2 - \\omega^2 \\approx 2\\omega_0(\\omega_0 - \\omega)</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mn>0</mn></msub><mo>≈</mo><mn>10</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">f_0 \\approx 10{,}1</annotation></semantics></math>\nHz\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>604</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 604</annotation></semantics></math>\nrpm.</li>\n<li>Untuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≫</mo><msub><mi>ω</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">\\omega \\gg \\omega_0</annotation></semantics></math>,\nsimpangan massa terhadap ruang\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 0</annotation></semantics></math>\n(fase 180°, amplitudo\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>∝</mo><mn>1</mn><mi>/</mi><msup><mi>ω</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\propto 1/\\omega^2</annotation></semantics></math>).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>∝</mo><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mn>0</mn></msub><mo>−</mo><mi>ω</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mn>0</mn></msub><mo>+</mo><mi>ω</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow></mrow><annotation encoding=\"application/x-tex\">x \\propto \\sin\\left[\\tfrac{1}{2}(\\omega_0 - \\omega)t\\right]\\sin\\left[\\tfrac{1}{2}(\\omega_0 + \\omega)t\\right]</annotation></semantics></math>;\nperiode layangan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>π</mi><mi>/</mi><mn>0</mn><mo>,</mo><mn>5</mn><mo>≈</mo><mn>12</mn><mo>,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">2\\pi/0{,}5 \\approx 12{,}6</annotation></semantics></math>\ns.</li>\n<li>Substitusi langsung; suku\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>cos</mo></mrow><annotation encoding=\"application/x-tex\">t\\cos</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>sin</mo></mrow><annotation encoding=\"application/x-tex\">t\\sin</annotation></semantics></math>\nsaling meniadakan.</li>\n<li>Rasio amplitudo harmonik ke-3 terhadap ke-1\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>Q</mi><mi>/</mi><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>9</mn><mi>/</mi><mn>8</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">\\approx (Q/3)/(9/8) \\approx 15</annotation></semantics></math>;\nharmonik ketiga dominan.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mo>−</mo><mi>A</mi><mi>ω</mi><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>ω</mi><mi>t</mi><mo>−</mo><mi>π</mi><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>A</mi><mi>ω</mi><mo>cos</mo><mi>ω</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">\\dot{x} = -A\\omega\\sin(\\omega t - \\pi/2) = A\\omega\\cos\\omega t</annotation></semantics></math>.</li>\n</ol>\n"}, "6": {"t": "Gerak Partikel dalam Tiga Dimensi", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Komponen mendatar kecepatan tetap; percepatan\nselalu\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>g</mi><annotation encoding=\"application/x-tex\">g</annotation></semantics></math>\nke bawah.<br />\n<strong>2. E.</strong> Hambatan udara paling merugikan lintasan tinggi\nyang lama di udara.<br />\n<strong>3. A.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>sin</mo><mn>60</mn><mi>°</mi><mo>=</mo><mo>sin</mo><mn>120</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\sin 60° = \\sin 120°</annotation></semantics></math>;\nwaktu terbang dan tinggi maksimumnya berbeda.<br />\n<strong>4. D.</strong> Kriteria rotasi nol.<br />\n<strong>5. E.</strong> Gravitasi konservatif.<br />\n<strong>6. C.</strong> Gesekan selalu melawan gerak.<br />\n<strong>7. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐅</mi><mo>⊥</mo><mi>𝐯</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{F}\\perp\\mathbf{v}</annotation></semantics></math>.<br />\n<strong>8. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐅</mi><mo>=</mo><mo>−</mo><mi>∇</mi><mi>V</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{F} = -\\nabla V</annotation></semantics></math>\nmenunjuk ke arah penurunan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>V</mi><annotation encoding=\"application/x-tex\">V</annotation></semantics></math>\npaling curam.<br />\n<strong>9. B.</strong> Tidak ada gaya mendatar.<br />\n<strong>10. E.</strong> Gerak tegak keduanya identik; gerak mendatar\ntidak memengaruhi gerak tegak.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>28</mn></mrow><annotation encoding=\"application/x-tex\">t \\approx 3{,}28</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>≈</mo><mn>62</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">R \\approx 62{,}8</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>H</mi><mo>≈</mo><mn>13</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">H \\approx 13{,}2</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>505</mn></mrow><annotation encoding=\"application/x-tex\">t \\approx 0{,}505</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>52</mn></mrow><annotation encoding=\"application/x-tex\">x \\approx 1{,}52</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐅</mi><mo>=</mo><mo>−</mo><mn>2</mn><mi>x</mi><mi>y</mi><mspace width=\"0.167em\"></mspace><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><msup><mi>z</mi><mn>3</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mn>3</mn><mi>y</mi><msup><mi>z</mi><mn>2</mn></msup><mspace width=\"0.167em\"></mspace><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{F} = -2xy\\,\\hat{\\mathbf{i}} - (x^2 + z^3)\\,\\hat{\\mathbf{j}} - 3yz^2\\,\\hat{\\mathbf{k}}</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>∇</mi><mo>×</mo><mi>𝐅</mi><mo>=</mo><mn>𝟎</mn></mrow><annotation encoding=\"application/x-tex\">\\nabla\\times\\mathbf{F} = \\mathbf{0}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mo>−</mo><mi>x</mi><mi>y</mi><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">V = -xyz</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mi>𝐅</mi><mo>⋅</mo><mi>Δ</mi><mi>𝐫</mi><mo>=</mo><mn>6</mn><mo>+</mo><mn>8</mn><mo>=</mo><mn>14</mn></mrow><annotation encoding=\"application/x-tex\">W = \\mathbf{F}\\cdot\\Delta\\mathbf{r} = 6 + 8 = 14</annotation></semantics></math>\nJ; gaya tetap selalu konservatif.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>1</mn><annotation encoding=\"application/x-tex\">1</annotation></semantics></math>\nJ; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0</mn><annotation encoding=\"application/x-tex\">0</annotation></semantics></math>\nJ. Usaha bergantung pada lintasan, jadi gaya ini tidak konservatif.</li>\n</ol></li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>78</mn></mrow><annotation encoding=\"application/x-tex\">t \\approx 2{,}78</annotation></semantics></math>\ns,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>≈</mo><mn>48</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">x \\approx 48{,}1</annotation></semantics></math>\nm; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>θ</mi><mtext mathvariant=\"normal\">opt</mtext></msub><mo>≈</mo><mn>39</mn><mo>,</mo><mn>3</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta_{\\text{opt}} \\approx 39{,}3°</annotation></semantics></math>.</li>\n</ol></li>\n<li>Uraikan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mo>ln</mo><annotation encoding=\"application/x-tex\">\\ln</annotation></semantics></math>\ndan eksponensial sampai orde kedua dalam\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mi>/</mi><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">t/\\tau</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tan</mo><mi>θ</mi><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta = 4</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>≈</mo><mn>76</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta \\approx 76°</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><mi>m</mi><mi>v</mi><mo>sin</mo><mn>30</mn><mi>°</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>e</mi><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>0</mn><mo>,</mo><mn>57</mn></mrow><annotation encoding=\"application/x-tex\">r = m v\\sin 30°/(eB) \\approx 0{,}57</annotation></semantics></math>\nmm; <em>pitch</em>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mi>v</mi><mo>cos</mo><mn>30</mn><mi>°</mi><mo>⋅</mo><mn>2</mn><mi>π</mi><mi>m</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>e</mi><mi>B</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>6</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">= v\\cos 30°\\cdot 2\\pi m/(eB) \\approx 6{,}2</annotation></semantics></math>\nmm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐅</mi><mo>⋅</mo><mi>d</mi><mi>𝐫</mi><mo>=</mo><mi>f</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{F}\\cdot d\\mathbf{r} = f(r)\\,dr</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mo>∫</mo><mi>f</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">W = \\int f(r)\\,dr</annotation></semantics></math>\nhanya bergantung pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>.</li>\n<li>Nol untuk satu putaran (bahkan setiap saat pada lingkaran, karena\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐅</mi><mo>⊥</mo><mi>𝐯</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{F}\\perp\\mathbf{v}</annotation></semantics></math>).\nDari perigee ke apogee jarak bertambah, sehingga usaha gravitasi negatif\ndan satelit melambat.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><msub><mi>k</mi><mi>x</mi></msub><msup><mi>x</mi><mn>2</mn></msup><mo>+</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><msub><mi>k</mi><mi>y</mi></msub><msup><mi>y</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">V = \\tfrac{1}{2}k_xx^2 + \\tfrac{1}{2}k_yy^2</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mi>A</mi><mo>cos</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mi>x</mi></msub><mi>t</mi><mo>+</mo><mi>α</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">x = A\\cos(\\omega_xt + \\alpha)</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>y</mi><mo>=</mo><mi>B</mi><mo>cos</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>ω</mi><mi>y</mi></msub><mi>t</mi><mo>+</mo><mi>β</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">y = B\\cos(\\omega_yt + \\beta)</annotation></semantics></math>;\nuntuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mi>y</mi></msub><mo>=</mo><mn>2</mn><msub><mi>ω</mi><mi>x</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\omega_y = 2\\omega_x</annotation></semantics></math>\nlintasannya berbentuk angka delapan atau parabola.</li>\n<li>Tetapkan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>y</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\dot{y} = 0</annotation></semantics></math>\npada Persamaan (6.4).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>x</mi><msup><mi>y</mi><mn>2</mn></msup><mo>+</mo><mi>y</mi><mi>z</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">V = -(xy^2 + yz)</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mi>V</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>−</mo><mi>V</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>,</mo><mn>2</mn><mo>,</mo><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>4</mn><mo>+</mo><mn>6</mn><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">W = V(0) - V(1, 2, 3) = 4 + 6 = 10</annotation></semantics></math>\nJ.</li>\n</ol>\n"}, "7": {"t": "Kerangka Acuan Non-Inersia", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Gaya inersia\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><mi>m</mi><msub><mi>𝐀</mi><mn>0</mn></msub></mrow><annotation encoding=\"application/x-tex\">-m\\mathbf{A}_0</annotation></semantics></math>\nmengarah ke belakang.<br />\n<strong>2. C.</strong> Tidak ada gaya sentrifugal di kerangka inersia;\ntubuh cenderung lurus (hukum I).<br />\n<strong>3. B.</strong> Tanpa gaya, batu bergerak lurus searah kecepatan\nterakhirnya.<br />\n<strong>4. D.</strong> Gaya Coriolis berbanding dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝛚</mi><mo>×</mo><mi>𝐯</mi><mi>′</mi></mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\omega}\\times\\mathbf{v}&#39;</annotation></semantics></math>.<br />\n<strong>5. A.</strong> Perkalian silang vektor sejajar bernilai\nnol.<br />\n<strong>6. C.</strong> Komponen tegak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝛚</mi><annotation encoding=\"application/x-tex\">\\boldsymbol{\\omega}</annotation></semantics></math>\nmengarah ke atas di belahan utara.<br />\n<strong>7. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>sin</mo><mn>0</mn><mi>°</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\sin 0° = 0</annotation></semantics></math>.<br />\n<strong>8. A.</strong> Tidak ada pelaku dan tidak ada pasangan\nreaksi.<br />\n<strong>9. C.</strong> Efek Coriolis terlalu kecil pada skala\nwastafel.<br />\n<strong>10. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mtext mathvariant=\"normal\">buatan</mtext></msub><mo>=</mo><msup><mi>ω</mi><mn>2</mn></msup><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">g_{\\text{buatan}} = \\omega^2R</annotation></semantics></math>.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mo>=</mo><mn>6</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">g_{\\text{ef}} = 6{,}8</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>41</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 2{,}41</annotation></semantics></math>\ns.</li>\n<li>Diperlukan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mo>&gt;</mo><msub><mi>μ</mi><mi>s</mi></msub><mi>g</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>47</mn></mrow><annotation encoding=\"application/x-tex\">2 &gt; \\mu_sg = 1{,}47</annotation></semantics></math>\nm/s², jadi kotak bergeser; relatif terhadap truk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mi>′</mi><mo>=</mo><mn>2</mn><mo>−</mo><mn>0</mn><mo>,</mo><mn>98</mn><mo>=</mo><mn>1</mn><mo>,</mo><mn>02</mn></mrow><annotation encoding=\"application/x-tex\">a&#39; = 2 - 0{,}98 = 1{,}02</annotation></semantics></math>\nm/s² ke belakang.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>443</mn></mrow><annotation encoding=\"application/x-tex\">\\omega \\approx 0{,}443</annotation></semantics></math>\nrad/s\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>4</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 4{,}2</annotation></semantics></math>\nrpm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>ω</mi><mn>2</mn></msup><mi>R</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>034</mn></mrow><annotation encoding=\"application/x-tex\">\\omega^2R \\approx 0{,}034</annotation></semantics></math>\nm/s², sekitar 0,35%.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>23</mn><mo>,</mo><mn>93</mn><mi>/</mi><mo>sin</mo><mn>45</mn><mi>°</mi><mo>≈</mo><mn>33</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">T = 23{,}93/\\sin 45° \\approx 33{,}8</annotation></semantics></math>\njam.</li>\n<li>Terapkan Persamaan (7.2) pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝐫</mi><annotation encoding=\"application/x-tex\">\\mathbf{r}</annotation></semantics></math>,\nlalu pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝐯</mi><annotation encoding=\"application/x-tex\">\\mathbf{v}</annotation></semantics></math>;\ngunakan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐯</mi><mo>=</mo><mi>𝐯</mi><mi>′</mi><mo>+</mo><mi>𝛚</mi><mo>×</mo><mi>𝐫</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v} = \\mathbf{v}&#39; + \\boldsymbol{\\omega}\\times\\mathbf{r}</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mn>2</mn><mi>m</mi><mi>ω</mi><mi>v</mi><mo>sin</mo><mi>λ</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">F = 2m\\omega v\\sin\\lambda \\approx 3{,}1</annotation></semantics></math>\nN ke timur (kanan); sekitar\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">3 \\times 10^{-4}</annotation></semantics></math>\nkali berat.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tan</mo><mi>α</mi><mo>=</mo><mn>2</mn><mi>ω</mi><mi>v</mi><mo>sin</mo><mi>λ</mi><mi>/</mi><mi>g</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\tan\\alpha = 2\\omega v\\sin\\lambda/g \\approx 2{,}1 \\times 10^{-5}</annotation></semantics></math>;\ntepi timur (kanan) lebih tinggi sekitar 1,05 cm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>19</mn></mrow><annotation encoding=\"application/x-tex\">t \\approx 3{,}19</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>x</mi><mo>≈</mo><mn>7</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta x \\approx 7{,}7</annotation></semantics></math>\nmm ke timur.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>ω</mi><mi>v</mi><mi>′</mi><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">2\\omega v&#39; = 10</annotation></semantics></math>\nm/s²; ke kanan relatif arah gerak, yaitu searah jarum jam.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tan</mo><mi>θ</mi><mo>=</mo><msup><mi>v</mi><mn>2</mn></msup><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>R</mi><mi>g</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>0</mn><mo>,</mo><mn>459</mn></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta = v^2/(Rg) \\approx 0{,}459</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>≈</mo><mn>24</mn><mo>,</mo><mn>7</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta \\approx 24{,}7°</annotation></semantics></math>,\nmiring ke luar tikungan.</li>\n<li>Permukaan tegak lurus\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>𝐠</mi><mtext mathvariant=\"normal\">ef</mtext></msub><annotation encoding=\"application/x-tex\">\\mathbf{g}_{\\text{ef}}</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>z</mi><mi>/</mi><mi>d</mi><mi>ρ</mi><mo>=</mo><msup><mi>ω</mi><mn>2</mn></msup><mi>ρ</mi><mi>/</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">dz/d\\rho = \\omega^2\\rho/g</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>≈</mo><mn>5</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">z \\approx 5{,}1</annotation></semantics></math>\ncm.</li>\n<li>Komponen sentrifugal tegak lurus arah radial\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><msup><mi>ω</mi><mn>2</mn></msup><mi>R</mi><mo>cos</mo><mi>λ</mi><mo>sin</mo><mi>λ</mi></mrow><annotation encoding=\"application/x-tex\">\\approx \\omega^2R\\cos\\lambda\\sin\\lambda</annotation></semantics></math>;\nmaksimum di 45° sekitar 5,9 menit busur.</li>\n<li>Coba\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>u</mi><mo>=</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>i</mi><msub><mi>Ω</mi><mi>z</mi></msub><mi>t</mi></mrow></msup><mi>w</mi></mrow><annotation encoding=\"application/x-tex\">u = e^{-i\\Omega_zt}w</annotation></semantics></math>;\ndiperoleh\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>w</mi><mo accent=\"true\">̈</mo></mover><mo>+</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msubsup><mi>ω</mi><mn>0</mn><mn>2</mn></msubsup><mo>+</mo><msubsup><mi>Ω</mi><mi>z</mi><mn>2</mn></msubsup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>w</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\ddot{w} + (\\omega_0^2 + \\Omega_z^2)w = 0</annotation></semantics></math>,\nsehingga bidang ayun berputar dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>−</mo><msub><mi>Ω</mi><mi>z</mi></msub></mrow><annotation encoding=\"application/x-tex\">-\\Omega_z</annotation></semantics></math>.</li>\n<li>Dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐯</mi><mi>′</mi><mo>=</mo><mo>−</mo><mi>𝛚</mi><mo>×</mo><mi>𝐫</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v}&#39; = -\\boldsymbol{\\omega}\\times\\mathbf{r}</annotation></semantics></math>:\nCoriolis memberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>m</mi><msup><mi>ω</mi><mn>2</mn></msup><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">2m\\omega^2r</annotation></semantics></math>\nke dalam, sentrifugal\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>ω</mi><mn>2</mn></msup><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">m\\omega^2r</annotation></semantics></math>\nke luar; netonya\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><msup><mi>ω</mi><mn>2</mn></msup><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">m\\omega^2r</annotation></semantics></math>\nke dalam.</li>\n</ol>\n"}, "8": {"t": "Gravitasi", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Semua benda di dalam stasiun jatuh bebas\nbersama.<br />\n<strong>2. E.</strong> Teorema kulit bola.<br />\n<strong>3. B.</strong> Untuk bola homogen,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>∝</mo><mi>r</mi></mrow><annotation encoding=\"application/x-tex\">g \\propto r</annotation></semantics></math>.<br />\n<strong>4. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>∝</mo><mn>1</mn><mi>/</mi><msup><mi>r</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">g \\propto 1/r^2</annotation></semantics></math>.<br />\n<strong>5. D.</strong> Hukum III; akibatnya pada Bumi sangat kecil\nkarena massanya besar.<br />\n<strong>6. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>e</mi></msub><mo>=</mo><msqrt><mrow><mn>2</mn><mi>G</mi><mi>M</mi><mi>/</mi><mi>R</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">v_e = \\sqrt{2GM/R}</annotation></semantics></math>.<br />\n<strong>7. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><mo>−</mo><mi>G</mi><mi>M</mi><mi>m</mi><mi>/</mi><mi>r</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">V = -GMm/r &lt; 0</annotation></semantics></math>.<br />\n<strong>8. A.</strong> Gravitasi menyediakan gaya sentripetal.<br />\n<strong>9. E.</strong> Efek perbedaan medan bekerja simetris.<br />\n<strong>10. A.</strong> Massa di luar tidak menyumbang fluks neto.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>≈</mo><mn>6</mn><mo>,</mo><mn>7</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>5</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">F \\approx 6{,}7 \\times 10^{-5}</annotation></semantics></math>\nN.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>g</mi><mtext mathvariant=\"normal\">Bulan</mtext></msub><mo>≈</mo><mn>1</mn><mo>,</mo><mn>63</mn></mrow><annotation encoding=\"application/x-tex\">g_{\\text{Bulan}} \\approx 1{,}63</annotation></semantics></math>\nm/s², kira-kira seperenam\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>g</mi><annotation encoding=\"application/x-tex\">g</annotation></semantics></math>\nBumi.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>≈</mo><mn>8</mn><mo>,</mo><mn>68</mn></mrow><annotation encoding=\"application/x-tex\">g \\approx 8{,}68</annotation></semantics></math>\nm/s² (89% nilai permukaan).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>e</mi></msub><mo>≈</mo><mn>2</mn><mo>,</mo><mn>38</mn></mrow><annotation encoding=\"application/x-tex\">v_e \\approx 2{,}38</annotation></semantics></math>\nkm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>≈</mo><mn>7</mn><mo>,</mo><mn>91</mn></mrow><annotation encoding=\"application/x-tex\">v \\approx 7{,}91</annotation></semantics></math>\nkm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>84</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 84{,}3</annotation></semantics></math>\nmenit, sama dengan periode terowongan.</li>\n<li>Komponen gaya sepanjang terowongan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><mi>g</mi><mi>/</mi><mi>R</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>s</mi></mrow><annotation encoding=\"application/x-tex\">= -(mg/R)s</annotation></semantics></math>,\ndengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math>\njarak dari titik tengah terowongan.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>⋅</mo><mn>4</mn><mi>π</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><mi>π</mi><mi>G</mi><mi>M</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>r</mi><mn>3</mn></msup><mi>/</mi><msup><mi>R</mi><mn>3</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">g\\cdot 4\\pi r^2 = 4\\pi GM(r^3/R^3)</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>U</mi><mo>≈</mo><mo>−</mo><mn>7</mn><mo>,</mo><mn>6</mn><mo>×</mo><msup><mn>10</mn><mn>28</mn></msup></mrow><annotation encoding=\"application/x-tex\">U \\approx -7{,}6 \\times 10^{28}</annotation></semantics></math>\nJ.</li>\n<li>Cincin pada sudut\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>θ</mi><annotation encoding=\"application/x-tex\">\\theta</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mi>Φ</mi><mo>=</mo><mo>−</mo><mi>G</mi><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>M</mi><mi>/</mi><mi>s</mi></mrow><annotation encoding=\"application/x-tex\">d\\Phi = -G\\,dM/s</annotation></semantics></math>,\ndengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>s</mi><mn>2</mn></msup><mo>=</mo><msup><mi>r</mi><mn>2</mn></msup><mo>+</mo><msup><mi>R</mi><mn>2</mn></msup><mo>−</mo><mn>2</mn><mi>r</mi><mi>R</mi><mo>cos</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">s^2 = r^2 + R^2 - 2rR\\cos\\theta</annotation></semantics></math>;\nintegrasikan terhadap\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>s</mi><annotation encoding=\"application/x-tex\">s</annotation></semantics></math>.</li>\n<li>Hanya komponen sumbu yang tersisa; maksimum di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>z</mi><mo>=</mo><mi>a</mi><mi>/</mi><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">z = a/\\sqrt{2}</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>E</mi><mo>=</mo><mi>G</mi><mi>M</mi><mi>m</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mi>/</mi><mi>R</mi><mo>−</mo><mn>1</mn><mi>/</mi><mn>2</mn><msub><mi>r</mi><mtext mathvariant=\"normal\">geo</mtext></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>5</mn><mo>,</mo><mn>8</mn><mo>×</mo><msup><mn>10</mn><mn>10</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\Delta E = GMm\\left(1/R - 1/2r_{\\text{geo}}\\right) \\approx 5{,}8 \\times 10^{10}</annotation></semantics></math>\nJ.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>g</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>4</mn><mn>3</mn></mfrac><mi>π</mi><mi>G</mi><mi>ρ</mi><mi>R</mi><mo>⋅</mo><mfrac displaystyle=\"false\"><mn>9</mn><mn>8</mn></mfrac></mrow><annotation encoding=\"application/x-tex\">g = \\tfrac{4}{3}\\pi G\\rho R \\cdot \\tfrac{9}{8}</annotation></semantics></math>,\nyaitu 12,5% lebih besar daripada planet homogen.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math>\nmenjadi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi>/</mi><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">1/\\sqrt{2}</annotation></semantics></math>\nkali,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>T</mi><annotation encoding=\"application/x-tex\">T</annotation></semantics></math>\nmenjadi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><msqrt><mn>2</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">2\\sqrt{2}</annotation></semantics></math>\nkali,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>K</mi><annotation encoding=\"application/x-tex\">K</annotation></semantics></math>\nmenjadi setengah,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>V</mi><annotation encoding=\"application/x-tex\">V</annotation></semantics></math>\nmenjadi setengah (kurang negatif),\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>E</mi><annotation encoding=\"application/x-tex\">E</annotation></semantics></math>\nmenjadi setengah (kurang negatif); energi total bertambah.</li>\n<li>Bulan:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>1</mn><mo>,</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>6</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\approx 1{,}1 \\times 10^{-6}</annotation></semantics></math>\nm/s²; Matahari:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>5</mn><mo>,</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\approx 5{,}1 \\times 10^{-7}</annotation></semantics></math>\nm/s²; perbandingan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>2</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 2{,}2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><mo>=</mo><mn>2</mn><mi>G</mi><mi>M</mi><mi>/</mi><msup><mi>c</mi><mn>2</mn></msup><mo>≈</mo><mn>2</mn><mo>,</mo><mn>9</mn></mrow><annotation encoding=\"application/x-tex\">R = 2GM/c^2 \\approx 2{,}9</annotation></semantics></math>\nkm.</li>\n</ol>\n"}, "9": {"t": "Gaya Sentral dan Gerak Planet", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. C.</strong> Momen gaya terhadap pusat nol.<br />\n<strong>2. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>r</mi><mn>2</mn></msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover></mrow><annotation encoding=\"application/x-tex\">r^2\\dot{\\theta}</annotation></semantics></math>\ntetap, sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>r</mi><annotation encoding=\"application/x-tex\">r</annotation></semantics></math>\nkecil berarti gerak cepat.<br />\n<strong>3. C.</strong> Hukum I Kepler.<br />\n<strong>4. D.</strong> Bumi justru terdekat ke Matahari pada bulan\nJanuari.<br />\n<strong>5. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">E &lt; 0</annotation></semantics></math>.<br />\n<strong>6. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><msup><mi>a</mi><mrow><mn>3</mn><mi>/</mi><mn>2</mn></mrow></msup><mo>=</mo><msup><mn>4</mn><mrow><mn>3</mn><mi>/</mi><mn>2</mn></mrow></msup><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">T = a^{3/2} = 4^{3/2} = 8</annotation></semantics></math>\ntahun.<br />\n<strong>7. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>L</mi><mn>2</mn></msup><mi>/</mi><mn>2</mn><mi>m</mi><msup><mi>r</mi><mn>2</mn></msup><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>m</mi><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>r</mi><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">L^2/2mr^2 = \\tfrac{1}{2}m(r\\dot{\\theta})^2</annotation></semantics></math>.<br />\n<strong>8. A.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">E = 0</annotation></semantics></math>\nmemberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">e = 1</annotation></semantics></math>.<br />\n<strong>9. C.</strong> Orbit lebih rendah mempunyai periode lebih\npendek.<br />\n<strong>10. E.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">E &gt; 0</annotation></semantics></math>\nmemberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>&gt;</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">e &gt; 1</annotation></semantics></math>.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>1</mn><mo>,</mo><msup><mn>524</mn><mrow><mn>3</mn><mi>/</mi><mn>2</mn></mrow></msup><mo>≈</mo><mn>1</mn><mo>,</mo><mn>88</mn></mrow><annotation encoding=\"application/x-tex\">T = 1{,}524^{3/2} \\approx 1{,}88</annotation></semantics></math>\ntahun.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>p</mi></msub><mi>/</mi><msub><mi>v</mi><mi>a</mi></msub><mo>=</mo><msub><mi>r</mi><mi>a</mi></msub><mi>/</mi><msub><mi>r</mi><mi>p</mi></msub><mo>≈</mo><mn>1</mn><mo>,</mo><mn>52</mn></mrow><annotation encoding=\"application/x-tex\">v_p/v_a = r_a/r_p \\approx 1{,}52</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mo>=</mo><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup><msup><mi>a</mi><mn>3</mn></msup><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>G</mi><msup><mi>T</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>1</mn><mo>,</mo><mn>99</mn><mo>×</mo><msup><mn>10</mn><mn>30</mn></msup></mrow><annotation encoding=\"application/x-tex\">M = 4\\pi^2a^3/(GT^2) \\approx 1{,}99 \\times 10^{30}</annotation></semantics></math>\nkg.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>055</mn></mrow><annotation encoding=\"application/x-tex\">e \\approx 0{,}055</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>7621</mn></mrow><annotation encoding=\"application/x-tex\">a = 7621</annotation></semantics></math>\nkm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>6620</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 6620</annotation></semantics></math>\ns\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>110</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 110</annotation></semantics></math>\nmenit.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>T</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup><msup><mi>a</mi><mn>2</mn></msup><msup><mi>b</mi><mn>2</mn></msup><msup><mi>m</mi><mn>2</mn></msup><mi>/</mi><msup><mi>L</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup><msup><mi>a</mi><mn>3</mn></msup><msup><mi>m</mi><mn>2</mn></msup><mi>p</mi><mi>/</mi><msup><mi>L</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">T^2 = 4\\pi^2a^2b^2m^2/L^2 = 4\\pi^2a^3m^2p/L^2</annotation></semantics></math>,\ndengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>p</mi><mo>=</mo><msup><mi>L</mi><mn>2</mn></msup><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>G</mi><mi>M</mi><msup><mi>m</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">p = L^2/(GMm^2)</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext mathvariant=\"normal\">perigee</mtext></msub><mo>≈</mo><mn>7</mn><mo>,</mo><mn>98</mn></mrow><annotation encoding=\"application/x-tex\">v_{\\text{perigee}} \\approx 7{,}98</annotation></semantics></math>\nkm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mtext mathvariant=\"normal\">apogee</mtext></msub><mo>≈</mo><mn>6</mn><mo>,</mo><mn>55</mn></mrow><annotation encoding=\"application/x-tex\">v_{\\text{apogee}} \\approx 6{,}55</annotation></semantics></math>\nkm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>17</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">a \\approx 17{,}8</annotation></semantics></math>\nAU;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>967</mn></mrow><annotation encoding=\"application/x-tex\">e \\approx 0{,}967</annotation></semantics></math>;\naphelion\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>35</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 35{,}1</annotation></semantics></math>\nAU.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>v</mi><mn>1</mn></msub><mo>≈</mo><mn>2</mn><mo>,</mo><mn>43</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta v_1 \\approx 2{,}43</annotation></semantics></math>\nkm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mi>v</mi><mn>2</mn></msub><mo>≈</mo><mn>1</mn><mo>,</mo><mn>47</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta v_2 \\approx 1{,}47</annotation></semantics></math>\nkm/s; total\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>3</mn><mo>,</mo><mn>89</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 3{,}89</annotation></semantics></math>\nkm/s; waktu transfer\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>5</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 5{,}3</annotation></semantics></math>\njam.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mi>′</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>c</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">U_{\\text{ef}}&#39;(r_c) = 0</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mi>″</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>c</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mi>G</mi><mi>M</mi><mi>m</mi><mi>/</mi><msubsup><mi>r</mi><mi>c</mi><mn>3</mn></msubsup><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">U_{\\text{ef}}&#39;&#39;(r_c) = GMm/r_c^3 &gt; 0</annotation></semantics></math>.</li>\n<li>Gunakan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>r</mi><mo accent=\"true\">̇</mo></mover><mo>=</mo><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mi>/</mi><mi>m</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>u</mi><mi>/</mi><mi>d</mi><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">\\dot{r} = -(L/m)\\,du/d\\theta</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>L</mi><mn>2</mn></msup><msup><mi>u</mi><mn>2</mn></msup><mi>/</mi><msup><mi>m</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><msup><mi>d</mi><mn>2</mn></msup><mi>u</mi><mi>/</mi><mi>d</mi><msup><mi>θ</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\ddot{r} = -(L^2u^2/m^2)\\,d^2u/d\\theta^2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>G</mi><mi>M</mi><mi>/</mi><msub><mi>r</mi><mi>p</mi></msub></mrow></msqrt><mo>≈</mo><mn>42</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{2GM/r_p} \\approx 42{,}1</annotation></semantics></math>\nkm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>U</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mi>″</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mi>c</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>∝</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>n</mi><mo>+</mo><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">U_{\\text{ef}}&#39;&#39;(r_c) \\propto (n + 3)</annotation></semantics></math>;\nuntuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi>/</mi><msup><mi>r</mi><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">1/r^3</annotation></semantics></math>\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>n</mi><mo>=</mo><mo>−</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">n = -3</annotation></semantics></math>)\norbit lingkaran tidak stabil (netral), sehingga gangguan kecil membuat\npartikel berspiral.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>4</mn><mo>,</mo><mn>68</mn><mo>×</mo><msup><mn>10</mn><mn>6</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\approx 4{,}68 \\times 10^6</annotation></semantics></math>\nm dari pusat Bumi, sekitar 1700 km di bawah permukaan.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>52</mn><mo>×</mo><msup><mn>10</mn><mn>9</mn></msup></mrow><annotation encoding=\"application/x-tex\">a \\approx 3{,}52 \\times 10^9</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>150</mn></mrow><annotation encoding=\"application/x-tex\">e \\approx 1{,}150</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>χ</mi><mo>≈</mo><mn>121</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\chi \\approx 121°</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>r</mi><mi>p</mi></msub><mo>≈</mo><mn>5</mn><mo>,</mo><mn>3</mn><mo>×</mo><msup><mn>10</mn><mn>8</mn></msup></mrow><annotation encoding=\"application/x-tex\">r_p \\approx 5{,}3 \\times 10^8</annotation></semantics></math>\nm (sekitar 7,5 jari-jari Jupiter).</li>\n</ol>\n"}, "10": {"t": "Dinamika Sistem Partikel", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Momentum selalu kekal dalam tumbukan; energi\nkinetik berkurang.<br />\n<strong>2. C.</strong> Gaya internal saling meniadakan\nberpasangan.<br />\n<strong>3. D.</strong> Gaya luar (gravitasi) tidak berubah oleh\nledakan.<br />\n<strong>4. E.</strong> Hukum III antara roket dan gas buangnya.<br />\n<strong>5. A.</strong> Persamaan (10.6) dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>=</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1 = m_2</annotation></semantics></math>.<br />\n<strong>6. B.</strong> Simetri; pusat massa tidak harus berada pada\nmateri.<br />\n<strong>7. C.</strong> Kedua benda bergerak bersama setelah\ntumbukan.<br />\n<strong>8. D.</strong> Momentum total tetap nol.<br />\n<strong>9. E.</strong> Persamaan (10.6) dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mo>≪</mo><msub><mi>m</mi><mn>2</mn></msub></mrow><annotation encoding=\"application/x-tex\">m_1 \\ll m_2</annotation></semantics></math>.<br />\n<strong>10. D.</strong> Persamaan (10.4).</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐑</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>667</mn><mo>;</mo><mspace width=\"0.222em\"></mspace><mn>1</mn><mo>,</mo><mn>5</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\mathbf{R} = (0{,}667;\\ 1{,}5)</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>2</mn><annotation encoding=\"application/x-tex\">2</annotation></semantics></math>\nm/s ke belakang.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>2</mn><annotation encoding=\"application/x-tex\">2</annotation></semantics></math>\nm/s, berlawanan arah.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">v = 12</annotation></semantics></math>\nm/s; energi yang hilang\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>300</mn><mo>−</mo><mn>180</mn><mo>=</mo><mn>120</mn></mrow><annotation encoding=\"application/x-tex\">= 300 - 180 = 120</annotation></semantics></math>\nkJ (40%).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>e</mi><mo>=</mo><msqrt><mrow><mn>1</mn><mo>,</mo><mn>28</mn><mi>/</mi><mn>2</mn></mrow></msqrt><mo>=</mo><mn>0</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">e = \\sqrt{1{,}28/2} = 0{,}8</annotation></semantics></math>.</li>\n<li>Gunakan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>v</mi><mn>1</mn></msub><mo>−</mo><msub><mi>v</mi><mn>1</mn></msub><mi>′</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msub><mi>m</mi><mn>2</mn></msub><msub><mi>v</mi><mn>2</mn></msub><mi>′</mi></mrow><annotation encoding=\"application/x-tex\">m_1(v_1 - v_1&#39;) = m_2v_2&#39;</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>1</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msubsup><mi>v</mi><mn>1</mn><mn>2</mn></msubsup><mo>−</mo><msub><mi>v</mi><mn>1</mn></msub><msup><mi>′</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><msub><mi>m</mi><mn>2</mn></msub><msub><mi>v</mi><mn>2</mn></msub><msup><mi>′</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">m_1(v_1^2 - v_1&#39;^2) = m_2v_2&#39;^2</annotation></semantics></math>;\nbagi kedua persamaan.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>g</mi><mi>h</mi></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">V = \\sqrt{2gh} \\approx 1{,}25</annotation></semantics></math>\nm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>≈</mo><mn>236</mn></mrow><annotation encoding=\"application/x-tex\">v \\approx 236</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>𝐯</mi><mn>1</mn></msub><mo>=</mo><msub><mi>𝐯</mi><mn>1</mn></msub><mi>′</mi><mo>+</mo><msub><mi>𝐯</mi><mn>2</mn></msub><mi>′</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v}_1 = \\mathbf{v}_1&#39; + \\mathbf{v}_2&#39;</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msubsup><mi>v</mi><mn>1</mn><mn>2</mn></msubsup><mo>=</mo><msub><mi>v</mi><mn>1</mn></msub><msup><mi>′</mi><mn>2</mn></msup><mo>+</mo><msub><mi>v</mi><mn>2</mn></msub><msup><mi>′</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">v_1^2 = v_1&#39;^2 + v_2&#39;^2</annotation></semantics></math>\nmemberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>𝐯</mi><mn>1</mn></msub><mi>′</mi><mo>⋅</mo><msub><mi>𝐯</mi><mn>2</mn></msub><mi>′</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v}_1&#39;\\cdot\\mathbf{v}_2&#39; = 0</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>1</mn></msub><mi>′</mi><mo>=</mo><mn>2</mn><mo>cos</mo><mn>30</mn><mi>°</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>73</mn></mrow><annotation encoding=\"application/x-tex\">v_1&#39; = 2\\cos 30° \\approx 1{,}73</annotation></semantics></math>\nm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mn>2</mn></msub><mi>′</mi><mo>=</mo><mn>2</mn><mo>sin</mo><mn>30</mn><mi>°</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">v_2&#39; = 2\\sin 30° = 1</annotation></semantics></math>\nm/s, pada 60° di sisi lain arah semula.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><mi>v</mi><mo>=</mo><mn>2500</mn><mo>ln</mo><mn>5</mn><mo>≈</mo><mn>4</mn><mo>,</mo><mn>02</mn></mrow><annotation encoding=\"application/x-tex\">\\Delta v = 2500\\ln 5 \\approx 4{,}02</annotation></semantics></math>\nkm/s; dengan gravitasi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>4</mn><mo>,</mo><mn>02</mn><mo>−</mo><mn>0</mn><mo>,</mo><mn>59</mn><mo>=</mo><mn>3</mn><mo>,</mo><mn>44</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 4{,}02 - 0{,}59 = 3{,}44</annotation></semantics></math>\nkm/s.</li>\n<li>Energi tersisa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>11</mn><mi>/</mi><mn>13</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mo>≈</mo><mn>72</mn><mi>%</mi></mrow><annotation encoding=\"application/x-tex\">= (11/13)^2 \\approx 72\\%</annotation></semantics></math>,\njadi hilang sekitar 28%; dengan hidrogen, neutron dapat kehilangan\nseluruh energinya dalam satu tumbukan sentral.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>I</mi><annotation encoding=\"application/x-tex\">I</annotation></semantics></math>\nturun dari 0,5 ke 0,125 kg·m², sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">\\omega = 8</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>K</mi><annotation encoding=\"application/x-tex\">K</annotation></semantics></math>\nnaik dari 1 J ke 4 J; tambahan berasal dari usaha mekanisme yang menarik\nbeban ke dalam.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mn>6</mn><mo>×</mo><msup><mn>10</mn><mn>5</mn></msup></mrow><annotation encoding=\"application/x-tex\">F = 6 \\times 10^5</annotation></semantics></math>\nN;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>m</mi><mn>0</mn></msub><mo>&lt;</mo><mi>F</mi><mi>/</mi><mi>g</mi><mo>≈</mo><mn>6</mn><mo>,</mo><mn>1</mn><mo>×</mo><msup><mn>10</mn><mn>4</mn></msup></mrow><annotation encoding=\"application/x-tex\">m_0 &lt; F/g \\approx 6{,}1 \\times 10^4</annotation></semantics></math>\nkg.</li>\n<li>Gaya untuk menghentikan bagian yang jatuh\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mi>λ</mi><msup><mi>v</mi><mn>2</mn></msup><mo>=</mo><mn>2</mn><mi>λ</mi><mi>g</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">= \\lambda v^2 = 2\\lambda gx</annotation></semantics></math>,\nditambah berat bagian yang sudah di timbangan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>λ</mi><mi>g</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">\\lambda gx</annotation></semantics></math>.</li>\n<li>Di kerangka bola basket yang memantul ke atas dengan laju\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>v</mi><annotation encoding=\"application/x-tex\">v</annotation></semantics></math>,\nbola tenis datang dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">2v</annotation></semantics></math>\ndan memantul balik dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">2v</annotation></semantics></math>;\nrelatif terhadap tanah,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi>v</mi></mrow><annotation encoding=\"application/x-tex\">3v</annotation></semantics></math>,\nsehingga tingginya\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>9</mn><mi>h</mi></mrow><annotation encoding=\"application/x-tex\">9h</annotation></semantics></math>.</li>\n</ol>\n"}, "11": {"t": "Benda Tegar: Rotasi terhadap Sumbu Tetap", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Seluruh massa cincin berada pada jarak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>R</mi><annotation encoding=\"application/x-tex\">R</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>I</mi><mtext mathvariant=\"normal\">cincin</mtext></msub><mo>=</mo><mn>2</mn><msub><mi>I</mi><mtext mathvariant=\"normal\">cakram</mtext></msub></mrow><annotation encoding=\"application/x-tex\">I_{\\text{cincin}} = 2I_{\\text{cakram}}</annotation></semantics></math>.<br />\n<strong>2. B.</strong> Benda tegar berputar sebagai satu kesatuan.<br />\n<strong>3. C.</strong> Lengan momen terbesar dan gaya tegak lurus\nlengan.<br />\n<strong>4. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mfrac displaystyle=\"false\"><mn>1</mn><mn>3</mn></mfrac><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><mo>÷</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>12</mn></mfrac><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">\\tfrac{1}{3}ML^2 \\div \\tfrac{1}{12}ML^2 = 4</annotation></semantics></math>.<br />\n<strong>5. B.</strong> Diperlukan momen gaya neto untuk mempercepat\nkatrol.<br />\n<strong>6. A.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><msup><mi>d</mi><mn>2</mn></msup><mo>≥</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">Md^2 \\ge 0</annotation></semantics></math>.<br />\n<strong>7. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>α</mi><mo>=</mo><mi>τ</mi><mi>/</mi><mi>I</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><mi>g</mi><mi>L</mi><mi>/</mi><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>M</mi><msup><mi>L</mi><mn>2</mn></msup><mi>/</mi><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>3</mn><mi>g</mi><mi>/</mi><mn>2</mn><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">\\alpha = \\tau/I = (MgL/2)/(ML^2/3) = 3g/2L</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><mfrac displaystyle=\"false\"><mn>3</mn><mn>2</mn></mfrac><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">a_t = \\tfrac{3}{2}g</annotation></semantics></math>.<br />\n<strong>8. E.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>K</mi><mo>∝</mo><msup><mi>ω</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">K \\propto \\omega^2</annotation></semantics></math>.<br />\n<strong>9. B.</strong> Persamaan (11.6).<br />\n<strong>10. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mtext mathvariant=\"normal\">cincin</mtext></msub><mo>=</mo><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">k_{\\text{cincin}} = R</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mtext mathvariant=\"normal\">bola</mtext></msub><mo>=</mo><mi>R</mi><msqrt><mrow><mn>2</mn><mi>/</mi><mn>5</mn></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">k_{\\text{bola}} = R\\sqrt{2/5}</annotation></semantics></math>.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">\\omega = 20</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>=</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">\\theta = 50</annotation></semantics></math>\nrad\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>7</mn><mo>,</mo><mn>96</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 7{,}96</annotation></semantics></math>\nputaran.</li>\n<li>Jarak ke titik berat\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>,</mo><mn>3</mn><mi>/</mi><msqrt><mn>3</mn></msqrt><mo>≈</mo><mn>0</mn><mo>,</mo><mn>173</mn></mrow><annotation encoding=\"application/x-tex\">0{,}3/\\sqrt{3} \\approx 0{,}173</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mn>3</mn><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>03</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>0</mn><mo>,</mo><mn>09</mn></mrow><annotation encoding=\"application/x-tex\">I = 3(1)(0{,}03) = 0{,}09</annotation></semantics></math>\nkg·m².</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>+</mo><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mfrac displaystyle=\"false\"><mn>3</mn><mn>2</mn></mfrac><mi>M</mi><msup><mi>R</mi><mn>2</mn></msup><mo>=</mo><mn>0</mn><mo>,</mo><mn>12</mn></mrow><annotation encoding=\"application/x-tex\">I = \\tfrac{1}{2}MR^2 + MR^2 = \\tfrac{3}{2}MR^2 = 0{,}12</annotation></semantics></math>\nkg·m².</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>50</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>sin</mo><mn>60</mn><mi>°</mi><mo>≈</mo><mn>13</mn></mrow><annotation encoding=\"application/x-tex\">\\tau = (0{,}3)(50)\\sin 60° \\approx 13</annotation></semantics></math>\nN·m.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>I</mi><mo>=</mo><mn>6</mn><mo>,</mo><mn>25</mn></mrow><annotation encoding=\"application/x-tex\">I = 6{,}25</annotation></semantics></math>\nkg·m²,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≈</mo><mn>31</mn><mo>,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">\\omega \\approx 31{,}4</annotation
