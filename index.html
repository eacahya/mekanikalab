<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mekanika Lab</title>
<meta name="description" content="Aplikasi pendamping buku Mekanika: simulasi interaktif, kunci jawaban, dan indeks istilah.">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1c2230; --muted:#5d6577; --line:#dcd7cc;
  --accent:#0f6b6b; --accent-soft:#e1efee;
  --vA:#c0392b; --vB:#1f5fbf; --vR:#1d7a3a; --vD:#8e44ad; --vAcc:#d4790f;
  --grid:#e9e5dc; --axis:#b9b2a3; --chip:#efeae0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171d; --panel:#1c2029; --ink:#e7e9ee; --muted:#9aa2b2; --line:#2e3441;
    --accent:#4fb3b0; --accent-soft:#1f3434;
    --vA:#ff6b5b; --vB:#5c9cff; --vR:#4cc574; --vD:#c58af0; --vAcc:#ffae4a;
    --grid:#232834; --axis:#454d5e; --chip:#262b36;
  }
}
:root[data-theme="dark"]{
  --bg:#14171d; --panel:#1c2029; --ink:#e7e9ee; --muted:#9aa2b2; --line:#2e3441;
  --accent:#4fb3b0; --accent-soft:#1f3434;
  --vA:#ff6b5b; --vB:#5c9cff; --vR:#4cc574; --vD:#c58af0; --vAcc:#ffae4a;
  --grid:#232834; --axis:#454d5e; --chip:#262b36;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
header a.brand{font-weight:700;color:var(--ink);text-decoration:none;letter-spacing:.2px}
header a.brand span{color:var(--accent)}
header .sp{flex:1}
header button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:5px 10px;cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:1.45rem;margin:.2em 0 .1em}
h2{font-size:1.1rem;margin:1.2em 0 .5em}
.muted{color:var(--muted)}
.code{display:inline-block;font:600 .8rem ui-monospace,Consolas,monospace;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:6px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ch{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ch h3{margin:0 0 6px;font-size:.98rem}
.ch .num{color:var(--accent);font-weight:700;margin-right:6px}
.ch ul{margin:0;padding-left:0;list-style:none}
.ch li{margin:4px 0}
.ch li a{color:var(--ink);text-decoration:none}
.ch li a:hover{color:var(--accent)}
.ch .soon{color:var(--muted);font-size:.85rem;font-style:italic}
.goto{display:flex;gap:8px;margin:12px 0 18px;flex-wrap:wrap}
.goto input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:160px}
.goto button,.btn{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--accent);color:#fff;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
@media (max-width:820px){.simwrap{grid-template-columns:1fr}}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
canvas{display:block;width:100%;touch-action:none}
.side{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h4{margin:0 0 8px;font-size:.92rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row label{flex:1}
.row input[type=range]{flex:1.4}
.row output{min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:inherit;font-size:.86rem;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
table.ro{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.ro td{padding:3px 2px;border-bottom:1px dashed var(--line)}
table.ro td:last-child{text-align:right;font-family:ui-monospace,Consolas,monospace}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.task{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:14px}
.task ol{margin:.3em 0 0;padding-left:1.2em}
.task li{margin:.3em 0}
.crumb{font-size:.88rem;margin-bottom:6px}
.crumb a{color:var(--accent);text-decoration:none}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
.transport .btn{min-width:96px}
.transport .btn:disabled{opacity:.4;cursor:default}
.transport .stop{background:var(--vA)}
.transport .spd{display:flex;gap:4px;margin-left:auto;align-items:center;font-size:.85rem;color:var(--muted)}
.transport .spd button{font:inherit;font-size:.82rem;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.transport .spd button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.transport .st{font-size:.85rem;color:var(--muted);min-width:70px}
.hint{position:absolute;left:10px;bottom:8px;font-size:.8rem;color:var(--muted);pointer-events:none}
.lock{max-width:560px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 22px}
.lock .goto input{width:220px;text-transform:uppercase;letter-spacing:1px}
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:0 0 18px}
.links a{display:block;background:var(--accent-soft);border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none}
.links a b{color:var(--accent)}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 18px 14px;max-width:820px}
.doc h2{color:var(--accent);border-bottom:1px solid var(--line);padding-bottom:4px}
.doc ol{padding-left:1.4em}.doc li{margin:.45em 0}
.doc .soal{line-height:1.75}
.doc math{font-size:1.05em}
.warn{background:var(--chip);border-radius:10px;padding:8px 12px;margin:8px 0 12px;font-size:.92rem}
.pager{display:flex;justify-content:space-between;gap:8px;margin:14px 0;max-width:820px;flex-wrap:wrap}
.pager a{color:var(--accent);text-decoration:none}
.chipnav{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.chipnav a{font-size:.86rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);text-decoration:none}
.chipnav a.on{background:var(--accent);border-color:var(--accent);color:#fff}
.idx{max-width:820px}
.idx .letter{font-weight:700;color:var(--accent);margin:16px 0 4px;font-size:1.05rem}
.idx .it{padding:7px 0;border-bottom:1px dashed var(--line)}
.idx .it .en{color:var(--muted);font-style:italic;margin-left:4px}
.idx .loc{font-size:.88rem;color:var(--muted);margin-top:2px}
.idx .loc b{color:var(--ink);font-weight:600}
.idx input{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:100%;max-width:420px}
footer{max-width:1100px;margin:24px auto;padding:0 16px 24px;color:var(--muted);font-size:.82rem}
</style>
</head>
<body>
<header>
  <a class="brand" href="#">Mekanika <span>Lab</span></a>
  <div class="sp"></div>
  <button id="themeBtn" title="Ganti tema">◐</button>
</header>
<main id="app"></main>
<footer>Mekanika Lab — aplikasi pendamping buku <i>Mekanika: Dari Newton hingga Lagrange</i>. Pindai kode QR di buku atau ketik kode SIM. Kunci jawaban dan indeks istilah juga tersedia di sini.</footer>

<script>
/* ===================== Data buku ===================== */
const CHAPTERS = [
  {n:1,  t:"Vektor dan Kinematika", sims:[["SIM-1.1","Penjumlahan & Komponen Vektor"],["SIM-1.2","Perkalian Titik & Silang"],["SIM-1.3","Kinematika Koordinat Polar"]]},
  {n:2,  t:"Hukum-Hukum Newton", sims:[["SIM-2.1","Bidang Miring dan Gaya Gesek"],["SIM-2.2","Mesin Atwood"],["SIM-2.3","Mobil di Tikungan"]]},
  {n:3,  t:"Gerak Lurus: Gaya Bergantung Waktu, Posisi, Kecepatan", sims:[["SIM-3.1","Diagram Energi Potensial"],["SIM-3.2","Jatuh dengan Hambatan Udara"],["SIM-3.3","Metode Numerik: Euler, Euler–Cromer, RK4"]]},
  {n:4,  t:"Osilator Harmonik Sederhana dan Teredam", sims:[["SIM-4.1","Osilator Pegas dan Bandul"],["SIM-4.2","Osilasi Teredam"]]},
  {n:5,  t:"Osilasi Paksa dan Resonansi", sims:[["SIM-5.1","Kurva Resonansi"],["SIM-5.2","Transien dan Layangan"]]},
  {n:6,  t:"Gerak Partikel dalam Tiga Dimensi", sims:[["SIM-6.1","Proyektil dengan Hambatan Udara"],["SIM-6.2","Usaha Sepanjang Lintasan"],["SIM-6.3","Partikel Bermuatan dalam Medan Magnet"]]},
  {n:7,  t:"Kerangka Acuan Non-Inersia", sims:[["SIM-7.1","Bola di Komidi Putar"],["SIM-7.2","Bandul Foucault"]]},
  {n:8,  t:"Gravitasi", sims:[["SIM-8.1","Medan Gravitasi Bola dan Kulit"],["SIM-8.2","Meriam Newton"],["SIM-8.3","Gaya Pasang Surut"]]},
  {n:9,  t:"Gaya Sentral dan Gerak Planet", sims:[["SIM-9.1","Orbit Kepler dan Hukum Luas"],["SIM-9.2","Potensial Efektif"],["SIM-9.3","Transfer Hohmann"]]},
  {n:10, t:"Dinamika Sistem Partikel", sims:[["SIM-10.1","Tumbukan Satu Dimensi"],["SIM-10.2","Roket"],["SIM-10.3","Tumbukan Dua Dimensi"]]},
  {n:11, t:"Benda Tegar: Rotasi terhadap Sumbu Tetap", sims:[["SIM-11.1","Momen Inersia"],["SIM-11.2","Bandul Fisis"]]},
  {n:12, t:"Benda Tegar: Gerak Bidang dan Menggelinding", sims:[["SIM-12.1","Lomba Menggelinding"],["SIM-12.2","Dari Meluncur ke Menggelinding"],["SIM-12.3","Presesi Giroskop"]]},
  {n:13, t:"Mekanika Lagrange I", sims:[["SIM-13.1","Manik pada Cincin Berputar"],["SIM-13.2","Bandul Ganda dan Kekacauan"],["SIM-13.3","Prinsip Hamilton: Aksi Stasioner"]]},
  {n:14, t:"Mekanika Lagrange II", sims:[["SIM-14.1","Osilator Tergandeng dan Mode Normal"],["SIM-14.2","Ruang Fase Bandul"],["SIM-14.3","Lepas dari Kubah: Pengali Lagrange"]]},
];
/* DATA-BUKU-MULAI */
const KUNCI = {"1": {"t": "Vektor dan Kinematika", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. E.</strong> Resultan dua vektor berada di antara\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mrow><mo stretchy=\"true\" form=\"prefix\">|</mo><mn>3</mn><mo>−</mo><mn>4</mn><mo stretchy=\"true\" form=\"postfix\">|</mo></mrow><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">|3 - 4| = 1</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mo>+</mo><mn>4</mn><mo>=</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">3 + 4 = 7</annotation></semantics></math>;\nnilai 8 di luar rentang itu.<br />\n<strong>2. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><mi>θ</mi><mo>&lt;</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\cos\\theta &lt; 0</annotation></semantics></math>\nhanya untuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>90</mn><mi>°</mi><mo>&lt;</mo><mi>θ</mi><mo>≤</mo><mn>180</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">90° &lt; \\theta \\le 180°</annotation></semantics></math>.<br />\n<strong>3. B.</strong> Hasil perkalian silang tegak lurus bidang yang\nmemuat kedua vektor.<br />\n<strong>4. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐀</mi><mo>×</mo><mi>𝐁</mi></mrow><annotation encoding=\"application/x-tex\">\\mathbf{A}\\times\\mathbf{B}</annotation></semantics></math>\ntegak lurus\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>𝐀</mi><annotation encoding=\"application/x-tex\">\\mathbf{A}</annotation></semantics></math>,\nsehingga perkalian titiknya nol untuk sudut berapa pun.<br />\n<strong>5. A.</strong> Arah kecepatan berubah terus; percepatan\nsentripetal\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>/</mi><mi>R</mi></mrow><annotation encoding=\"application/x-tex\">v^2/R</annotation></semantics></math>\nmenuju pusat.<br />\n<strong>6. B.</strong> Percepatan gravitasi tetap bekerja penuh;\nkecepatan sedang berubah dari ke atas menjadi ke bawah.<br />\n<strong>7. E.</strong> Laju tetap berarti\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>v</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mi>d</mi><mi>t</mi><mo>=</mo><mn>2</mn><mi>𝐯</mi><mo>⋅</mo><mi>𝐚</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">d(v^2)/dt = 2\\mathbf{v}\\cdot\\mathbf{a} = 0</annotation></semantics></math>;\npercepatan boleh ada asalkan tegak lurus kecepatan.<br />\n<strong>8. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>r</mi></msub><mo>=</mo><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>−</mo><mi>r</mi><msup><mover><mi>θ</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">a_r = \\ddot{r} - r\\dot{\\theta}^2</annotation></semantics></math>,\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">\\ddot{r} = 0</annotation></semantics></math>.<br />\n<strong>9. A.</strong> Sudut berubah, tetapi suku-suku percepatan saling\nmeniadakan karena geraknya lurus beraturan.<br />\n<strong>10. D.</strong> Momen gaya\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝛕</mi><mo>=</mo><mi>𝐫</mi><mo>×</mo><mi>𝐅</mi></mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\tau} = \\mathbf{r}\\times\\mathbf{F}</annotation></semantics></math>\nadalah vektor; yang lain skalar.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐀</mi><mo>+</mo><mi>𝐁</mi><mo>=</mo><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mn>4</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{A}+\\mathbf{B} = \\hat{\\mathbf{i}} + 4\\hat{\\mathbf{j}} - \\hat{\\mathbf{k}}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐀</mi><mo>−</mo><mi>𝐁</mi><mo>=</mo><mn>3</mn><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mn>2</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mn>5</mn><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{A}-\\mathbf{B} = 3\\hat{\\mathbf{i}} - 2\\hat{\\mathbf{j}} - 5\\hat{\\mathbf{k}}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mi>B</mi><mo>=</mo><msqrt><mn>14</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">A = B = \\sqrt{14}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>3</mn><mi>𝐀</mi><mo>−</mo><mn>2</mn><mi>𝐁</mi><mo>=</mo><mn>8</mn><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mn>3</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mn>13</mn><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">3\\mathbf{A}-2\\mathbf{B} = 8\\hat{\\mathbf{i}} - 3\\hat{\\mathbf{j}} - 13\\hat{\\mathbf{k}}</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐀</mi><mo>⋅</mo><mi>𝐁</mi><mo>=</mo><mo>−</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">\\mathbf{A}\\cdot\\mathbf{B} = -5</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>≈</mo><mn>110</mn><mo>,</mo><mn>9</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta \\approx 110{,}9°</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐀</mi><mo>×</mo><mi>𝐁</mi><mo>=</mo><mn>11</mn><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mn>7</mn><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{A}\\times\\mathbf{B} = 11\\hat{\\mathbf{i}} - \\hat{\\mathbf{j}} + 7\\hat{\\mathbf{k}}</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐝</mi><mo>=</mo><mn>2</mn><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mn>4</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover><mo>−</mo><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{d} = 2\\hat{\\mathbf{i}} + 4\\hat{\\mathbf{j}} - \\hat{\\mathbf{k}}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>W</mi><mo>=</mo><mo>−</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">W = -1</annotation></semantics></math>\nJ (gaya secara netto sedikit melawan perpindahan).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><mi>θ</mi><mo>=</mo><mn>2</mn><mi>/</mi><msqrt><mn>6</mn></msqrt></mrow><annotation encoding=\"application/x-tex\">\\cos\\theta = 2/\\sqrt{6}</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>θ</mi><mo>≈</mo><mn>35</mn><mo>,</mo><mn>3</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\theta \\approx 35{,}3°</annotation></semantics></math>.</li>\n<li>Volume\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mn>13</mn></mrow><annotation encoding=\"application/x-tex\">= 13</annotation></semantics></math>\nsatuan kubik.</li>\n<li>Gunakan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mi>B</mi><mo>sin</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">AB\\sin\\theta</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mi>B</mi><mo>cos</mo><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">AB\\cos\\theta</annotation></semantics></math>,\nlalu\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mo>sin</mo><mn>2</mn></msup><mi>θ</mi><mo>+</mo><msup><mo>cos</mo><mn>2</mn></msup><mi>θ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\sin^2\\theta + \\cos^2\\theta = 1</annotation></semantics></math>.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐯</mi><mo>=</mo><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mn>6</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v} = \\hat{\\mathbf{i}} + 6\\hat{\\mathbf{j}}</annotation></semantics></math>\nm/s,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐚</mi><mo>=</mo><mn>6</mn><mover><mi>𝐢</mi><mo accent=\"true\">̂</mo></mover><mo>+</mo><mn>6</mn><mover><mi>𝐣</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\mathbf{a} = 6\\hat{\\mathbf{i}} + 6\\hat{\\mathbf{j}}</annotation></semantics></math>\nm/s²; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><mn>42</mn><mi>/</mi><msqrt><mn>37</mn></msqrt><mo>≈</mo><mn>6</mn><mo>,</mo><mn>90</mn></mrow><annotation encoding=\"application/x-tex\">a_t = 42/\\sqrt{37} \\approx 6{,}90</annotation></semantics></math>\nm/s²,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>≈</mo><mn>4</mn><mo>,</mo><mn>93</mn></mrow><annotation encoding=\"application/x-tex\">a_n \\approx 4{,}93</annotation></semantics></math>\nm/s²; (c)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi><mo>=</mo><msup><mi>v</mi><mn>2</mn></msup><mi>/</mi><msub><mi>a</mi><mi>n</mi></msub><mo>≈</mo><mn>7</mn><mo>,</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">\\rho = v^2/a_n \\approx 7{,}50</annotation></semantics></math>\nm.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>n</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">a_n = 2</annotation></semantics></math>\nm/s²,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>t</mi></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">a_t = 2</annotation></semantics></math>\nm/s²,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>83</mn></mrow><annotation encoding=\"application/x-tex\">a \\approx 2{,}83</annotation></semantics></math>\nm/s², membentuk sudut 45° terhadap arah gerak (condong ke pusat\ntikungan).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐯</mi><mo>=</mo><mi>b</mi><mi>ω</mi><mspace width=\"0.167em\"></mspace><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>r</mi></msub><mo>+</mo><mi>b</mi><msup><mi>ω</mi><mn>2</mn></msup><mi>t</mi><mspace width=\"0.167em\"></mspace><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>θ</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mathbf{v} = b\\omega\\,\\hat{\\mathbf{e}}_r + b\\omega^2t\\,\\hat{\\mathbf{e}}_\\theta</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝐚</mi><mo>=</mo><mo>−</mo><mi>b</mi><msup><mi>ω</mi><mn>3</mn></msup><mi>t</mi><mspace width=\"0.167em\"></mspace><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>r</mi></msub><mo>+</mo><mn>2</mn><mi>b</mi><msup><mi>ω</mi><mn>2</mn></msup><mspace width=\"0.167em\"></mspace><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>θ</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\mathbf{a} = -b\\omega^3t\\,\\hat{\\mathbf{e}}_r + 2b\\omega^2\\,\\hat{\\mathbf{e}}_\\theta</annotation></semantics></math>.\nKomponen\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>v</mi><mi>θ</mi></msub><annotation encoding=\"application/x-tex\">v_\\theta</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mi>a</mi><mi>r</mi></msub><annotation encoding=\"application/x-tex\">a_r</annotation></semantics></math>\ntumbuh linear terhadap\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>t</mi><annotation encoding=\"application/x-tex\">t</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><msqrt><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><msub><mi>v</mi><mn>0</mn></msub><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mo>+</mo><msup><mi>D</mi><mn>2</mn></msup></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">r = \\sqrt{(x_0 + v_0t)^2 + D^2}</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tan</mo><mi>θ</mi><mo>=</mo><mi>D</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>x</mi><mn>0</mn></msub><mo>+</mo><msub><mi>v</mi><mn>0</mn></msub><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">\\tan\\theta = D/(x_0 + v_0t)</annotation></semantics></math>;\nsubstitusikan dan sederhanakan.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>=</mo><msub><mi>r</mi><mn>0</mn></msub><msup><mi>ω</mi><mn>2</mn></msup><mo>cosh</mo><mi>ω</mi><mi>t</mi><mo>=</mo><mi>r</mi><msup><mi>ω</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\ddot{r} = r_0\\omega^2\\cosh\\omega t = r\\omega^2</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>r</mi></msub><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">a_r = 0</annotation></semantics></math>;\n(b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mi>θ</mi></msub><mo>=</mo><mn>2</mn><msub><mi>r</mi><mn>0</mn></msub><msup><mi>ω</mi><mn>2</mn></msup><mo>sinh</mo><mi>ω</mi><mi>t</mi></mrow><annotation encoding=\"application/x-tex\">a_\\theta = 2r_0\\omega^2\\sinh\\omega t</annotation></semantics></math>;\n(c) tanpa dorongan menyamping, manik tidak dapat menambah kecepatan\ntangensial\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mi>ω</mi></mrow><annotation encoding=\"application/x-tex\">r\\omega</annotation></semantics></math>\nyang makin besar.</li>\n</ol></li>\n<li>Panjang\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Δ</mi><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>r</mi></msub></mrow><annotation encoding=\"application/x-tex\">\\Delta\\hat{\\mathbf{e}}_r</annotation></semantics></math>\nadalah busur\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mo>⋅</mo><mi>Δ</mi><mi>θ</mi></mrow><annotation encoding=\"application/x-tex\">1\\cdot\\Delta\\theta</annotation></semantics></math>,\narahnya mendekati\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msub><mover><mi>𝐞</mi><mo accent=\"true\">̂</mo></mover><mi>θ</mi></msub><annotation encoding=\"application/x-tex\">\\hat{\\mathbf{e}}_\\theta</annotation></semantics></math>.</li>\n<li><ol start=\"2\" type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>R</mi><msup><mi>Ω</mi><mn>2</mn></msup><mo>≈</mo><mn>3</mn><mo>,</mo><mn>39</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>2</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">R\\Omega^2 \\approx 3{,}39 \\times 10^{-2}</annotation></semantics></math>\nm/s²; dikali\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>sin</mo><mi>θ</mi><mo>=</mo><mo>cos</mo><mn>6</mn><mo>,</mo><mn>9</mn><mi>°</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>993</mn></mrow><annotation encoding=\"application/x-tex\">\\sin\\theta = \\cos 6{,}9° \\approx 0{,}993</annotation></semantics></math>\nmenjadi sekitar\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>0</mn><mo>,</mo><mn>034</mn></mrow><annotation encoding=\"application/x-tex\">0{,}034</annotation></semantics></math>\nm/s², yaitu kira-kira 0,34% dari\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>g</mi><annotation encoding=\"application/x-tex\">g</annotation></semantics></math>.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>𝛕</mi><mo>=</mo><mn>15</mn><mo>,</mo><mn>5</mn><mspace width=\"0.167em\"></mspace><mover><mi>𝐤</mi><mo accent=\"true\">̂</mo></mover></mrow><annotation encoding=\"application/x-tex\">\\boldsymbol{\\tau} = 15{,}5\\,\\hat{\\mathbf{k}}</annotation></semantics></math>\nN·m (berlawanan arah jarum jam dilihat dari\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>+</mo><mi>z</mi></mrow><annotation encoding=\"application/x-tex\">+z</annotation></semantics></math>).</li>\n</ol>\n"}, "2": {"t": "Hukum-Hukum Newton", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. B.</strong> Kecepatan tetap berarti percepatan nol,\nsehingga gaya neto nol (hukum I).<br />\n<strong>2. C.</strong> Hukum III: gaya interaksi selalu sama besar; yang\nberbeda adalah percepatannya.<br />\n<strong>3. B.</strong> Buku diam, sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mi>m</mi><mi>g</mi><mo>+</mo><msub><mi>F</mi><mtext mathvariant=\"normal\">tangan</mtext></msub><mo>&gt;</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">N = mg + F_{\\text{tangan}} &gt; mg</annotation></semantics></math>.<br />\n<strong>4. C.</strong> Beban ringan naik dipercepat\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>&gt;</mo><msub><mi>m</mi><mn>1</mn></msub><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">T &gt; m_1g</annotation></semantics></math>),\nbeban berat turun dipercepat\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>&lt;</mo><msub><mi>m</mi><mn>2</mn></msub><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">T &lt; m_2g</annotation></semantics></math>).<br />\n<strong>5. C.</strong> Kecepatan tetap berarti\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">a = 0</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mi>m</mi><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">N = mg</annotation></semantics></math>.<br />\n<strong>6. E.</strong> Balok diam, sehingga gesekan statis tepat\nmengimbangi komponen berat sepanjang bidang.<br />\n<strong>7. C.</strong> “Gaya lemparan” hanya bekerja selama bola masih\ndi tangan.<br />\n<strong>8. D.</strong> Pasangan reaksi harus sejenis (gravitasi) dan\nbekerja pada benda lain (Bumi).<br />\n<strong>9. E.</strong> Gaya neto nol berarti percepatan nol; benda bisa\ndiam atau bergerak lurus beraturan.<br />\n<strong>10. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>30</mn><mi>/</mi><mn>6</mn><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">a = 30/6 = 5</annotation></semantics></math>\nm/s², dan gaya pada balok 2 kg\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>5</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">= (2)(5) = 10</annotation></semantics></math>\nN.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>4</mn><annotation encoding=\"application/x-tex\">4</annotation></semantics></math>\nm/s²; (b) gaya neto\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>13</mn><annotation encoding=\"application/x-tex\">13</annotation></semantics></math>\nN,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>4</mn><mo>,</mo><mn>33</mn></mrow><annotation encoding=\"application/x-tex\">a \\approx 4{,}33</annotation></semantics></math>\nm/s².</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>J</mi><mo>=</mo><mn>13</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">J = 13{,}5</annotation></semantics></math>\nN·s (arah balik);\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mtext mathvariant=\"normal\">rata-rata</mtext></msub><mo>=</mo><mn>6</mn><mo>,</mo><mn>75</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">F_{\\text{rata-rata}} = 6{,}75 \\times 10^3</annotation></semantics></math>\nN.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>708</mn><annotation encoding=\"application/x-tex\">708</annotation></semantics></math>\nN; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>468</mn><annotation encoding=\"application/x-tex\">468</annotation></semantics></math>\nN; (c)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>0</mn><annotation encoding=\"application/x-tex\">0</annotation></semantics></math>\nN.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mi>g</mi><mo>sin</mo><mn>25</mn><mi>°</mi><mo>≈</mo><mn>4</mn><mo>,</mo><mn>14</mn></mrow><annotation encoding=\"application/x-tex\">a = g\\sin 25° \\approx 4{,}14</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>≈</mo><mn>8</mn><mo>,</mo><mn>14</mn></mrow><annotation encoding=\"application/x-tex\">v \\approx 8{,}14</annotation></semantics></math>\nm/s.</li>\n<li>Gesekan statis maksimum\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>49</mn><annotation encoding=\"application/x-tex\">49</annotation></semantics></math>\nN. (a) Peti diam,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>=</mo><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">f = 40</annotation></semantics></math>\nN,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">a = 0</annotation></semantics></math>;\n(b) peti bergerak,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>k</mi></msub><mo>=</mo><mn>39</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">f_k = 39{,}2</annotation></semantics></math>\nN,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>2</mn><mo>,</mo><mn>08</mn></mrow><annotation encoding=\"application/x-tex\">a = 2{,}08</annotation></semantics></math>\nm/s².</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>N</mi><mo>=</mo><mn>98</mn><mo>−</mo><mn>30</mn><mo>=</mo><mn>68</mn></mrow><annotation encoding=\"application/x-tex\">N = 98 - 30 = 68</annotation></semantics></math>\nN,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>k</mi></msub><mo>=</mo><mn>27</mn><mo>,</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">f_k = 27{,}2</annotation></semantics></math>\nN,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>48</mn></mrow><annotation encoding=\"application/x-tex\">a \\approx 2{,}48</annotation></semantics></math>\nm/s². Tarikan miring mengurangi gaya normal sehingga gesekan\nberkurang.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mn>2</mn><mo>,</mo><mn>45</mn></mrow><annotation encoding=\"application/x-tex\">a = 2{,}45</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>18</mn><mo>,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 18{,}4</annotation></semantics></math>\nN;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>90</mn></mrow><annotation encoding=\"application/x-tex\">t \\approx 0{,}90</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>19</mn><mo>,</mo><mn>6</mn><mo>−</mo><mn>7</mn><mo>,</mo><mn>84</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mn>6</mn><mo>=</mo><mn>1</mn><mo>,</mo><mn>96</mn></mrow><annotation encoding=\"application/x-tex\">a = (19{,}6 - 7{,}84)/6 = 1{,}96</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>15</mn><mo>,</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">T = 15{,}7</annotation></semantics></math>\nN.</li>\n<li>Balok atas paling banyak dipercepat\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub><mi>g</mi><mo>=</mo><mn>3</mn><mo>,</mo><mn>92</mn></mrow><annotation encoding=\"application/x-tex\">\\mu_s g = 3{,}92</annotation></semantics></math>\nm/s², sehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mo>max</mo></msub><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>5</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>3</mn><mo>,</mo><mn>92</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>19</mn><mo>,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">F_{\\max} = (5)(3{,}92) = 19{,}6</annotation></semantics></math>\nN.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>15</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">15{,}3</annotation></semantics></math>\nm/s\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>55</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 55</annotation></semantics></math>\nkm/jam; untuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>μ</mi><mi>s</mi></msub><mo>=</mo><mn>0</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">\\mu_s = 0{,}3</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>10</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 10{,}8</annotation></semantics></math>\nm/s\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>39</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 39</annotation></semantics></math>\nkm/jam.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mrow><mi>g</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mo>cos</mo><mi>θ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></msqrt><mo>≈</mo><mn>3</mn><mo>,</mo><mn>36</mn></mrow><annotation encoding=\"application/x-tex\">\\omega = \\sqrt{g/(L\\cos\\theta)} \\approx 3{,}36</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>87</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 1{,}87</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>F</mi><mi>r</mi></msub><mo>=</mo><mi>m</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mover><mi>r</mi><mo accent=\"true\">̈</mo></mover><mo>−</mo><mi>r</mi><msup><mi>ω</mi><mn>2</mn></msup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>−</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>05</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>75</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>4</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>−</mo><mn>0</mn><mo>,</mo><mn>15</mn></mrow><annotation encoding=\"application/x-tex\">F_r = m(\\ddot{r} - r\\omega^2) = -(0{,}05)(0{,}75)(4) = -0{,}15</annotation></semantics></math>\nN, yaitu 0,15 N menuju poros.</li>\n<li>Bagian tali sepanjang\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>−</mo><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">L - x</annotation></semantics></math>\n(massa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>M</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>L</mi><mo>−</mo><mi>x</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">M(L-x)/L</annotation></semantics></math>)\ndipercepat\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mi>/</mi><mi>M</mi></mrow><annotation encoding=\"application/x-tex\">F/M</annotation></semantics></math>\noleh tegangan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>x</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">T(x)</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mi>v</mi><mspace width=\"0.167em\"></mspace><mi>d</mi><mi>m</mi><mi>/</mi><mi>d</mi><mi>t</mi><mo>=</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">F = v\\,dm/dt = 6</annotation></semantics></math>\nN.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>f</mi><mi>k</mi></msub><mo>≈</mo><mn>5</mn><mo>,</mo><mn>09</mn></mrow><annotation encoding=\"application/x-tex\">f_k \\approx 5{,}09</annotation></semantics></math>\nN;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>a</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>856</mn></mrow><annotation encoding=\"application/x-tex\">a \\approx 0{,}856</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>22</mn><mo>,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 22{,}4</annotation></semantics></math>\nN.</li>\n</ol>\n"}, "3": {"t": "Gerak Lurus: Gaya yang Bergantung pada Waktu, Posisi, dan Kecepatan", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. C.</strong> Tanpa hambatan udara, semua benda jatuh dengan\npercepatan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>g</mi><annotation encoding=\"application/x-tex\">g</annotation></semantics></math>.<br />\n<strong>2. B.</strong> Kecepatan tetap berarti gaya neto nol; kedua gaya\ntetap bekerja.<br />\n<strong>3. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>V</mi><annotation encoding=\"application/x-tex\">V</annotation></semantics></math>\nmaksimum berarti gaya di sekitarnya menjauhkan partikel dari titik\nitu.<br />\n<strong>4. D.</strong> Energi kinetik tidak mungkin negatif.<br />\n<strong>5. E.</strong> Seluruh energi berupa energi potensial; partikel\nsesaat diam lalu berbalik.<br />\n<strong>6. A.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi>/</mi><mi>τ</mi></mrow></msup></mrow><annotation encoding=\"application/x-tex\">v = v_0e^{-t/\\tau}</annotation></semantics></math>\ntidak pernah tepat nol, tetapi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>x</mi><mi>∞</mi></msub><mo>=</mo><msub><mi>v</mi><mn>0</mn></msub><mi>τ</mi></mrow><annotation encoding=\"application/x-tex\">x_\\infty = v_0\\tau</annotation></semantics></math>\nterbatas.<br />\n<strong>7. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>f</mi><mo>∝</mo><msup><mi>v</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">f \\propto v^2</annotation></semantics></math>.<br />\n<strong>8. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>t</mi></msub><mo>=</mo><msqrt><mrow><mi>m</mi><mi>g</mi><mi>/</mi><msub><mi>c</mi><mn>2</mn></msub></mrow></msqrt><mo>∝</mo><msqrt><mi>m</mi></msqrt></mrow><annotation encoding=\"application/x-tex\">v_t = \\sqrt{mg/c_2} \\propto \\sqrt{m}</annotation></semantics></math>.<br />\n<strong>9. D.</strong> Energi kinetik tidak berubah, sehingga usaha neto\nnol (gaya sentripetal tegak lurus kecepatan).<br />\n<strong>10. E.</strong> Di dekat minimum, gaya selalu mengembalikan\npartikel ke dasar lembah.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>5</mn><msup><mi>t</mi><mn>2</mn></msup><mo>=</mo><mn>13</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">v = 1{,}5t^2 = 13{,}5</annotation></semantics></math>\nm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>5</mn><msup><mi>t</mi><mn>3</mn></msup><mo>=</mo><mn>13</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">x = 0{,}5t^3 = 13{,}5</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>∞</mi></msub><mo>=</mo><msub><mi>F</mi><mn>0</mn></msub><mi>T</mi><mi>/</mi><mi>m</mi><mo>=</mo><mn>2</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">v_\\infty = F_0T/m = 2{,}5</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mo>max</mo></msub><mo>=</mo><mi>A</mi><msqrt><mrow><mi>k</mi><mi>/</mi><mi>m</mi></mrow></msqrt><mo>=</mo><mn>1</mn><mo>,</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">v_{\\max} = A\\sqrt{k/m} = 1{,}0</annotation></semantics></math>\nm/s.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>F</mi><mo>=</mo><mo>−</mo><mn>6</mn><mi>x</mi><mo>+</mo><mn>3</mn><msup><mi>x</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">F = -6x + 3x^2</annotation></semantics></math>;\n(b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">x = 0</annotation></semantics></math>\nstabil\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mi>″</mi><mo>=</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">V&#39;&#39; = 6</annotation></semantics></math>),\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">x = 2</annotation></semantics></math>\nm tidak stabil\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mi>″</mi><mo>=</mo><mo>−</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">V&#39;&#39; = -6</annotation></semantics></math>);\n(c)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mo>max</mo></msub><mo>=</mo><mi>V</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">E_{\\max} = V(2) = 4</annotation></semantics></math>\nJ.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>r</mi><mo>=</mo><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mi>/</mi><mi>R</mi><mo>−</mo><msubsup><mi>v</mi><mn>0</mn><mn>2</mn></msubsup><mi>/</mi><mn>2</mn><mi>G</mi><mi>M</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mrow><mo>−</mo><mn>1</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">r = \\left(1/R - v_0^2/2GM\\right)^{-1}</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>h</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>59</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">h \\approx 1{,}59 \\times 10^3</annotation></semantics></math>\nkm; rumus\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>v</mi><mn>2</mn></msup><mi>/</mi><mn>2</mn><mi>g</mi></mrow><annotation encoding=\"application/x-tex\">v^2/2g</annotation></semantics></math>\nmemberi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>1</mn><mo>,</mo><mn>28</mn><mo>×</mo><msup><mn>10</mn><mn>3</mn></msup></mrow><annotation encoding=\"application/x-tex\">\\approx 1{,}28 \\times 10^3</annotation></semantics></math>\nkm (terlalu kecil).</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">\\tau = 5</annotation></semantics></math>\ns; (a)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mn>50</mn><annotation encoding=\"application/x-tex\">50</annotation></semantics></math>\nm; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mi>τ</mi><mo>ln</mo><mn>10</mn><mo>≈</mo><mn>11</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">t = \\tau\\ln 10 \\approx 11{,}5</annotation></semantics></math>\ns.</li>\n<li>Laju menjadi setengah pada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mi>m</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>c</mi><mn>2</mn></msub><msub><mi>v</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">t = m/(c_2v_0) = 40</annotation></semantics></math>\ns; jarak\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>m</mi><mi>/</mi><msub><mi>c</mi><mn>2</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>ln</mo><mn>2</mn><mo>≈</mo><mn>277</mn></mrow><annotation encoding=\"application/x-tex\">= (m/c_2)\\ln 2 \\approx 277</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>t</mi></msub><mo>≈</mo><mn>52</mn><mo>,</mo><mn>4</mn></mrow><annotation encoding=\"application/x-tex\">v_t \\approx 52{,}4</annotation></semantics></math>\nm/s\n(<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>189</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 189</annotation></semantics></math>\nkm/jam);\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>t</mi><mo>=</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>v</mi><mi>t</mi></msub><mi>/</mi><mi>g</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mspace width=\"0.167em\"></mspace><mtext mathvariant=\"normal\">artanh</mtext><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo>,</mo><mn>9</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>7</mn><mo>,</mo><mn>9</mn></mrow><annotation encoding=\"application/x-tex\">t = (v_t/g)\\,\\text{artanh}(0{,}9) \\approx 7{,}9</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>m</mi><mo>≈</mo><mn>5</mn><mo>,</mo><mn>24</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>7</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">m \\approx 5{,}24 \\times 10^{-7}</annotation></semantics></math>\nkg,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>t</mi></msub><mo>≈</mo><mn>4</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">v_t \\approx 4{,}5</annotation></semantics></math>\nm/s; rasio kuadratik/linear\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>7</mn></mrow><annotation encoding=\"application/x-tex\">\\approx 7</annotation></semantics></math>,\nasumsi tepat.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mi>t</mi></msub><mo>=</mo><mi>m</mi><mi>g</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>β</mi><mi>D</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mn>1</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">v_t = mg/(\\beta D) \\approx 1{,}3</annotation></semantics></math>\ncm/s; rasio kuadratik/linear\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>≈</mo><mn>4</mn><mo>×</mo><msup><mn>10</mn><mrow><mo>−</mo><mn>4</mn></mrow></msup></mrow><annotation encoding=\"application/x-tex\">\\approx 4 \\times 10^{-4}</annotation></semantics></math>.\nLaju sekecil ini mudah dikalahkan oleh arus udara.</li>\n<li>Integrasikan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">v(t)</annotation></semantics></math>;\nperluas\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>e</mi><mrow><mo>−</mo><mi>t</mi><mi>/</mi><mi>τ</mi></mrow></msup><mo>≈</mo><mn>1</mn><mo>−</mo><mi>t</mi><mi>/</mi><mi>τ</mi><mo>+</mo><msup><mi>t</mi><mn>2</mn></msup><mi>/</mi><mn>2</mn><msup><mi>τ</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">e^{-t/\\tau} \\approx 1 - t/\\tau + t^2/2\\tau^2</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msup><mi>x</mi><mn>2</mn></msup><mo>−</mo><mn>1</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>0</mn><mo>,</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">(x^2 - 1)^2 = 0{,}5</annotation></semantics></math>,\nsehingga titik balik di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>541</mn></mrow><annotation encoding=\"application/x-tex\">x \\approx 0{,}541</annotation></semantics></math>\nm dan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>307</mn></mrow><annotation encoding=\"application/x-tex\">x \\approx 1{,}307</annotation></semantics></math>\nm; di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">x = 1</annotation></semantics></math>\nm,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mi>E</mi><mi>/</mi><mi>m</mi></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>41</mn></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{2E/m} \\approx 1{,}41</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>E</mi><mo>min</mo></msub><mo>=</mo><mi>V</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">E_{\\min} = V(0) = 2</annotation></semantics></math>\nJ (lebih sedikit); untuk\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">E = 3</annotation></semantics></math>\nJ, di\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">x = 0</annotation></semantics></math>:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mo>=</mo><msqrt><mrow><mn>2</mn><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>3</mn><mo>−</mo><mn>2</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mn>1</mn></mrow></msqrt><mo>≈</mo><mn>1</mn><mo>,</mo><mn>41</mn></mrow><annotation encoding=\"application/x-tex\">v = \\sqrt{2(3 - 2)/1} \\approx 1{,}41</annotation></semantics></math>\nm/s.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mi>′</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>0</mn></mrow><annotation encoding=\"application/x-tex\">V&#39;(r_0) = 0</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>V</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>r</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>−</mo><mi>ε</mi></mrow><annotation encoding=\"application/x-tex\">V(r_0) = -\\varepsilon</annotation></semantics></math>;\n(b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><msqrt><mrow><mn>72</mn><mi>ε</mi><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>μ</mi><msubsup><mi>r</mi><mn>0</mn><mn>2</mn></msubsup><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">\\omega = \\sqrt{72\\varepsilon/(\\mu r_0^2)}</annotation></semantics></math>.</li>\n</ol></li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>τ</mi><mo>≈</mo><mn>3</mn><mo>,</mo><mn>06</mn></mrow><annotation encoding=\"application/x-tex\">\\tau \\approx 3{,}06</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>t</mi><mtext mathvariant=\"normal\">puncak</mtext></msub><mo>≈</mo><mn>1</mn><mo>,</mo><mn>56</mn></mrow><annotation encoding=\"application/x-tex\">t_{\\text{puncak}} \\approx 1{,}56</annotation></semantics></math>\ns (tanpa hambatan 2,04 s);\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>y</mi><mo>max</mo></msub><mo>=</mo><mi>τ</mi><mrow><mo stretchy=\"true\" form=\"prefix\">[</mo><msub><mi>v</mi><mn>0</mn></msub><mo>−</mo><msub><mi>v</mi><mi>t</mi></msub><mo>ln</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>1</mn><mo>+</mo><msub><mi>v</mi><mn>0</mn></msub><mi>/</mi><msub><mi>v</mi><mi>t</mi></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo stretchy=\"true\" form=\"postfix\">]</mo></mrow><mo>≈</mo><mn>14</mn><mo>,</mo><mn>3</mn></mrow><annotation encoding=\"application/x-tex\">y_{\\max} = \\tau\\left[v_0 - v_t\\ln(1 + v_0/v_t)\\right] \\approx 14{,}3</annotation></semantics></math>\nm (tanpa hambatan 20,4 m).</li>\n</ol>\n"}, "4": {"t": "Osilator Harmonik Sederhana dan Teredam", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. C.</strong> Periode osilator harmonik hanya bergantung\npada\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>m</mi><annotation encoding=\"application/x-tex\">m</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>k</mi><annotation encoding=\"application/x-tex\">k</annotation></semantics></math>.<br />\n<strong>2. B.</strong> Di simpangan terjauh benda sesaat diam, dan gaya\npemulihnya terbesar.<br />\n<strong>3. D.</strong> Massa saling meniadakan:\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>T</mi><mn>0</mn></msub><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mrow><mi>L</mi><mi>/</mi><mi>g</mi></mrow></msqrt></mrow><annotation encoding=\"application/x-tex\">T_0 = 2\\pi\\sqrt{L/g}</annotation></semantics></math>.<br />\n<strong>4. B.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>∝</mo><msqrt><mi>m</mi></msqrt></mrow><annotation encoding=\"application/x-tex\">T \\propto \\sqrt{m}</annotation></semantics></math>.<br />\n<strong>5. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><mi>k</mi><msup><mi>A</mi><mn>2</mn></msup><mo>∝</mo><msup><mi>A</mi><mn>2</mn></msup></mrow><annotation encoding=\"application/x-tex\">E = \\tfrac{1}{2}kA^2 \\propto A^2</annotation></semantics></math>.<br />\n<strong>6. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>∝</mo><mn>1</mn><mi>/</mi><msqrt><mi>g</mi></msqrt></mrow><annotation encoding=\"application/x-tex\">T \\propto 1/\\sqrt{g}</annotation></semantics></math>.<br />\n<strong>7. B.</strong> Itulah definisi praktis redaman kritis.<br />\n<strong>8. D.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mi>x</mi><mn>2</mn></msup><mi>/</mi><msup><mi>A</mi><mn>2</mn></msup><mo>+</mo><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mi>/</mi><msup><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>A</mi><msub><mi>ω</mi><mn>0</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mn>2</mn></msup><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">x^2/A^2 + \\dot{x}^2/(A\\omega_0)^2 = 1</annotation></semantics></math>.<br />\n<strong>9. E.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mi>Q</mi><annotation encoding=\"application/x-tex\">Q</annotation></semantics></math>\nbesar berarti energi yang hilang tiap siklus kecil.<br />\n<strong>10. E.</strong> Energi terbagi rata antara bentuk kinetik dan\npotensial.</p>\n</div>\n<h2 id=\"soal-latihan-jawaban-singkat\">Soal Latihan (jawaban\nsingkat)</h2>\n<ol type=\"1\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><mn>20</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_0 = 20</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>314</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 0{,}314</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>v</mi><mo>max</mo></msub><mo>=</mo><mn>2</mn></mrow><annotation encoding=\"application/x-tex\">v_{\\max} = 2</annotation></semantics></math>\nm/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>a</mi><mo>max</mo></msub><mo>=</mo><mn>40</mn></mrow><annotation encoding=\"application/x-tex\">a_{\\max} = 40</annotation></semantics></math>\nm/s²;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>E</mi><mo>=</mo><mn>1</mn><mo>,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">E = 1{,}6</annotation></semantics></math>\nJ.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">A = 0{,}1</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">\\omega = 5</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>26</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 1{,}26</annotation></semantics></math>\ns;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>0</mn><mo>,</mo><mn>05</mn></mrow><annotation encoding=\"application/x-tex\">x(0) = 0{,}05</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>v</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mn>0</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mo>−</mo><mn>0</mn><mo>,</mo><mn>5</mn><mo>sin</mo><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>π</mi><mi>/</mi><mn>3</mn><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>≈</mo><mo>−</mo><mn>0</mn><mo>,</mo><mn>433</mn></mrow><annotation encoding=\"application/x-tex\">v(0) = -0{,}5\\sin(\\pi/3) \\approx -0{,}433</annotation></semantics></math>\nm/s.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>A</mi><mo>=</mo><msqrt><mrow><mn>0</mn><mo>,</mo><msup><mn>03</mn><mn>2</mn></msup><mo>+</mo><mn>0</mn><mo>,</mo><msup><mn>04</mn><mn>2</mn></msup></mrow></msqrt><mo>=</mo><mn>0</mn><mo>,</mo><mn>05</mn></mrow><annotation encoding=\"application/x-tex\">A = \\sqrt{0{,}03^2 + 0{,}04^2} = 0{,}05</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>cos</mo><mi>ϕ</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>6</mn></mrow><annotation encoding=\"application/x-tex\">\\cos\\phi = 0{,}6</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>sin</mo><mi>ϕ</mi><mo>=</mo><mo>−</mo><mn>0</mn><mo>,</mo><mn>8</mn></mrow><annotation encoding=\"application/x-tex\">\\sin\\phi = -0{,}8</annotation></semantics></math>,\nsehingga\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ϕ</mi><mo>≈</mo><mo>−</mo><mn>53</mn><mo>,</mo><mn>1</mn><mi>°</mi></mrow><annotation encoding=\"application/x-tex\">\\phi \\approx -53{,}1°</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>L</mi><mo>=</mo><mi>g</mi><msup><mi>T</mi><mn>2</mn></msup><mi>/</mi><mn>4</mn><msup><mi>π</mi><mn>2</mn></msup><mo>≈</mo><mn>0</mn><mo>,</mo><mn>991</mn></mrow><annotation encoding=\"application/x-tex\">L = gT^2/4\\pi^2 \\approx 0{,}991</annotation></semantics></math>\nm.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>k</mi><mo>=</mo><mn>49</mn></mrow><annotation encoding=\"application/x-tex\">k = 49</annotation></semantics></math>\nN/m;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>635</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 0{,}635</annotation></semantics></math>\ns.</li>\n<li>Rata-rata\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mo>sin</mo><mn>2</mn></msup><annotation encoding=\"application/x-tex\">\\sin^2</annotation></semantics></math>\ndan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><msup><mo>cos</mo><mn>2</mn></msup><annotation encoding=\"application/x-tex\">\\cos^2</annotation></semantics></math>\nselama satu periode masing-masing\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mfrac displaystyle=\"false\"><mn>1</mn><mn>2</mn></mfrac><annotation encoding=\"application/x-tex\">\\tfrac{1}{2}</annotation></semantics></math>.</li>\n<li><ol type=\"a\">\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub><mo>=</mo><mn>200</mn></mrow><annotation encoding=\"application/x-tex\">k_{\\text{ef}} = k_1 + k_2 = 200</annotation></semantics></math>\nN/m,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≈</mo><mn>14</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\omega \\approx 14{,}1</annotation></semantics></math>\nrad/s; (b)\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>k</mi><mtext mathvariant=\"normal\">ef</mtext></msub><mo>=</mo><msub><mi>k</mi><mn>1</mn></msub><msub><mi>k</mi><mn>2</mn></msub><mi>/</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><msub><mi>k</mi><mn>1</mn></msub><mo>+</mo><msub><mi>k</mi><mn>2</mn></msub><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mo>=</mo><mn>50</mn></mrow><annotation encoding=\"application/x-tex\">k_{\\text{ef}} = k_1k_2/(k_1 + k_2) = 50</annotation></semantics></math>\nN/m,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ω</mi><mo>≈</mo><mn>7</mn><mo>,</mo><mn>07</mn></mrow><annotation encoding=\"application/x-tex\">\\omega \\approx 7{,}07</annotation></semantics></math>\nrad/s.</li>\n</ol></li>\n<li>Gaya pemulih\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>2</mn><mi>ρ</mi><mi>A</mi><mi>g</mi><mi>x</mi></mrow><annotation encoding=\"application/x-tex\">2\\rho Agx</annotation></semantics></math>\nbekerja pada massa\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>ρ</mi><mi>A</mi><mi>L</mi></mrow><annotation encoding=\"application/x-tex\">\\rho AL</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>1</mn><mo>,</mo><mn>00</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 1{,}00</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>d</mi><mo>=</mo><mn>0</mn><mo>,</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">d = 0{,}1</annotation></semantics></math>\nm;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>=</mo><mn>2</mn><mi>π</mi><msqrt><mrow><mi>d</mi><mi>/</mi><mi>g</mi></mrow></msqrt><mo>≈</mo><mn>0</mn><mo>,</mo><mn>635</mn></mrow><annotation encoding=\"application/x-tex\">T = 2\\pi\\sqrt{d/g} \\approx 0{,}635</annotation></semantics></math>\ns.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>T</mi><mo>≈</mo><mn>2</mn><mo>,</mo><mn>007</mn><mo>×</mo><mn>1</mn><mo>,</mo><mn>069</mn><mo>≈</mo><mn>2</mn><mo>,</mo><mn>144</mn></mrow><annotation encoding=\"application/x-tex\">T \\approx 2{,}007 \\times 1{,}069 \\approx 2{,}144</annotation></semantics></math>\ns; kesalahan sekitar 0,5%.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>=</mo><mn>1</mn></mrow><annotation encoding=\"application/x-tex\">\\gamma = 1</annotation></semantics></math>\ns⁻¹;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mn>0</mn></msub><mo>=</mo><mn>10</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_0 = 10</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>ω</mi><mi>d</mi></msub><mo>=</mo><msqrt><mn>99</mn></msqrt><mo>≈</mo><mn>9</mn><mo>,</mo><mn>95</mn></mrow><annotation encoding=\"application/x-tex\">\\omega_d = \\sqrt{99} \\approx 9{,}95</annotation></semantics></math>\nrad/s;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>=</mo><mn>5</mn></mrow><annotation encoding=\"application/x-tex\">Q = 5</annotation></semantics></math>;\namplitudo menjadi\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mn>1</mn><mi>/</mi><mi>e</mi></mrow><annotation encoding=\"application/x-tex\">1/e</annotation></semantics></math>\nsetelah 1 s, yaitu sekitar 1,6 osilasi.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>c</mi><mo>=</mo><mn>2</mn><msqrt><mrow><mi>k</mi><mi>m</mi></mrow></msqrt><mo>=</mo><mn>6000</mn></mrow><annotation encoding=\"application/x-tex\">c = 2\\sqrt{km} = 6000</annotation></semantics></math>\nN·s/m.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>δ</mi><mo>=</mo><mo>ln</mo><mn>1</mn><mo>,</mo><mn>25</mn><mo>≈</mo><mn>0</mn><mo>,</mo><mn>223</mn></mrow><annotation encoding=\"application/x-tex\">\\delta = \\ln 1{,}25 \\approx 0{,}223</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>γ</mi><mo>≈</mo><mn>0</mn><mo>,</mo><mn>446</mn></mrow><annotation encoding=\"application/x-tex\">\\gamma \\approx 0{,}446</annotation></semantics></math>\ns⁻¹;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>Q</mi><mo>≈</mo><mi>π</mi><mi>/</mi><mi>δ</mi><mo>≈</mo><mn>14</mn></mrow><annotation encoding=\"application/x-tex\">Q \\approx \\pi/\\delta \\approx 14</annotation></semantics></math>.</li>\n<li><math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>1</mn></msub><mo>=</mo><msub><mi>x</mi><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>γ</mi><mo>+</mo><mi>β</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mn>2</mn><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">C_1 = x_0(\\gamma + \\beta)/2\\beta</annotation></semantics></math>,\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msub><mi>C</mi><mn>2</mn></msub><mo>=</mo><msub><mi>x</mi><mn>0</mn></msub><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>β</mi><mo>−</mo><mi>γ</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow><mi>/</mi><mn>2</mn><mi>β</mi></mrow><annotation encoding=\"application/x-tex\">C_2 = x_0(\\beta - \\gamma)/2\\beta</annotation></semantics></math>;\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mi>x</mi><mrow><mo stretchy=\"true\" form=\"prefix\">(</mo><mi>t</mi><mo stretchy=\"true\" form=\"postfix\">)</mo></mrow></mrow><annotation encoding=\"application/x-tex\">x(t)</annotation></semantics></math>\ntidak pernah berganti tanda.</li>\n<li>Kalikan persamaan gerak dengan\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><annotation encoding=\"application/x-tex\">\\dot{x}</annotation></semantics></math>;\nrata-rata\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><msup><mover><mi>x</mi><mo accent=\"true\">̇</mo></mover><mn>2</mn></msup><mo>=</mo><mi>E</mi><mi>/</mi><mi>m</mi></mrow><annotation encoding=\"application/x-tex\">\\dot{x}^2 = E/m</annotation></semantics></math>.</li>\n</ol>\n"}, "5": {"t": "Osilasi Paksa dan Resonansi", "h": "<h2 id=\"uji-pemahaman\">Uji Pemahaman</h2>\n<div data-custom-style=\"Soal\">\n<p><strong>1. D.</strong> Transien meluruh; keadaan tunak mengikuti\nirama pemaksa.<br />\n<strong>2. C.</strong>\n<math display=\"inline\" xmlns=\"http://www.w3.org/1998/Math/MathML\"><semantics><mrow><mo>tan</mo><mi>δ</mi><mo>→</mo><mi>∞</mi></mrow><annotation encoding=\"application/x-tex\">\\tan\\delta \\to \\infty</ann
